<!DOCTYPE html>
<html lang="ko" data-page="participation">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="구슬요가 참가한 왁타버스·VR·마인크래프트·게임 콘텐츠 이력">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://qlmcwobfldgmhwhptkfz.supabase.co https://videoimg.sooplive.com https://videoimg.sooplive.co.kr https://stimg.sooplive.com https://stimg.sooplive.co.kr; connect-src 'self' https://qlmcwobfldgmhwhptkfz.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="theme-color" content="#76ad39">
    <title>참가 콘텐츠 — BEADYO</title>
    <link rel="icon" href="logo-icon.webp">
    <script src="site-backdrop.js?v=release-20261011-all"></script>
    <link rel="stylesheet" href="records.css?v=records-20261113c">
    <script defer src="supabase.min.js?v=supabase-2-119-0"></script>
    <script defer src="beadyo-common.js?v=auth-security-20261105"></script>
    <script defer src="records-common.js?v=review-20261115"></script>
    <script defer src="participation.js?v=review-20261115"></script>
</head>
<body>
    <a class="skip-link" href="#records">참가 목록으로 건너뛰기</a>
    <header class="standalone-nav" id="standalone-nav">
        <a class="brand" href="./#home"><img src="logo-icon.webp" width="28" height="28" alt="">BEADYO</a>
        <a class="home-link" href="./#home">홈으로 <span aria-hidden="true">↗</span></a>
    </header>
    <main class="page">
        <header class="page-heading">
            <div>
                <p class="eyebrow">BEADYO PARTICIPATION</p>
                <h1>참가 콘텐츠<span class="heading-dot" aria-hidden="true">.</span></h1>
                <p class="lead">구슬요가 함께한 콘텐츠와 그날의 활약.</p>
            </div>
            <div class="heading-symbol" aria-hidden="true">
                <svg viewBox="0 0 80 80"><path d="M27 18h26v10c0 9-6 16-13 16s-13-7-13-16Z"/><path d="M27 23h-8c0 8 4 12 9 12M53 23h8c0 8-4 12-9 12M40 44v10M30 62h20M33 54h14v8H33Z"/></svg>
            </div>
        </header>

        <div class="archive-summary" id="summary" aria-live="polite"><span>기록을 불러오고 있어요.</span></div>
        <div class="archive-actions">
            <button id="copy-btn" class="secondary-action" type="button" hidden>지원서용 목록 복사</button>
            <button id="add-btn" class="primary-action" type="button" hidden>+ 참가 기록 추가</button>
        </div>
        <p id="notice" class="save-notice" role="status" hidden></p>

        <section class="toolbar" aria-label="참가 기록 검색과 필터">
            <label class="search-field">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.2 16.2 4.4 4.4"/></svg>
                <span class="sr-only">콘텐츠·팀 이름 검색</span>
                <input id="search" type="search" placeholder="콘텐츠·팀 이름 검색" autocomplete="off" maxlength="100">
            </label>
            <label class="select-field"><span class="sr-only">연도</span><select id="year-filter"><option value="">전체 연도</option></select></label>
            <div class="chip-row" id="category-filter" role="group" aria-label="분류"></div>
        </section>

        <div class="list-controls">
            <span id="result-count" class="result-count" role="status"></span>
            <div id="view-toggle" class="view-toggle" role="group" aria-label="목록 보기 방식"></div>
        </div>
        <section id="records" class="record-years" aria-label="참가 콘텐츠 목록" aria-busy="true"></section>
        <div id="empty" class="empty-state" hidden><h2>조건에 맞는 기록이 없어요</h2><p>다른 이름으로 검색하거나 분류를 바꿔보세요.</p><button id="reset" type="button">전체 보기</button></div>
        <div id="load-error" class="empty-state" hidden><h2>기록을 불러오지 못했어요</h2><p>잠시 후 다시 시도해 주세요.</p><button id="retry" type="button">다시 불러오기</button></div>

        <footer class="archive-footer">
            <p><span class="source-dot" aria-hidden="true"></span>구슬요가 직접 기획한 콘텐츠는 '기획 콘텐츠'에, 다른 분이 주최한 콘텐츠에 참가한 기록은 이곳에 모아요.</p>
            <span class="footer-brand">BEADYO · PARTICIPATION</span>
        </footer>
    </main>

    <dialog id="edit-dialog" class="record-dialog" aria-labelledby="edit-title">
        <form id="edit-form" novalidate>
            <div class="dialog-top"><h2 id="edit-title">참가 기록 추가</h2><button type="button" id="close-edit" aria-label="닫기">×</button></div>
            <fieldset id="edit-fields" class="form-fields">
                <label class="span-2"><span>콘텐츠명 <b aria-hidden="true">*</b></span><input name="title" required maxlength="200" autocomplete="off"></label>
                <label><span>분류 <b aria-hidden="true">*</b></span><select name="category" required></select></label>
                <label><span>주최 <i>선택</i></span><input name="host" maxlength="120" autocomplete="off"></label>
                <label><span>연도 <b aria-hidden="true">*</b></span><input name="year" type="number" min="2015" max="2100" required inputmode="numeric"></label>
                <label><span>월 <i>모르면 비움</i></span><input name="month" type="number" min="1" max="12" inputmode="numeric"></label>
                <label><span>정확한 날짜 <i>선택</i></span><input name="event_date" type="date"></label>
                <label><span>팀 이름 <i>선택</i></span><input name="team" maxlength="120" autocomplete="off"></label>
                <label><span>역할(RP) <i>선택</i></span><input name="role" maxlength="200" autocomplete="off"></label>
                <label><span>닉네임 <i>선택</i></span><input name="nickname" maxlength="120" autocomplete="off"></label>
                <label class="span-2"><span>성적·특이사항 <i>여러 줄 가능</i></span><textarea name="result" rows="3" maxlength="2000"></textarea></label>
                <label class="span-2"><span>홈페이지·세부설명 링크 <i>한 줄에 하나, "이름 | 주소" 형식</i></span><textarea name="result_links" rows="3" placeholder="홈페이지 | https://..."></textarea></label>
                <label class="span-2"><span>다시보기 주소 <i>SOOP 다시보기 주소</i></span><input name="replay_url" type="url" maxlength="2048" placeholder="https://vod.sooplive.com/player/..." autocomplete="off"></label>
                <label class="span-2"><span>썸네일 이미지 주소 <i>선택</i></span><input name="image_url" type="url" maxlength="2048" placeholder="https://" autocomplete="off"></label>
                <label class="span-2"><span>메모 <i>선택</i></span><textarea name="notes" rows="2" maxlength="2000"></textarea></label>
            </fieldset>
            <p id="edit-message" class="form-message" role="alert"></p>
            <div class="dialog-footer">
                <button id="delete-btn" class="danger-action" type="button" hidden>삭제</button>
                <button id="cancel-edit" class="secondary-action" type="button">취소</button>
                <button id="save-btn" class="primary-action" type="submit">저장</button>
            </div>
        </form>
    </dialog>
</body>
</html>
