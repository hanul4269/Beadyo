<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구슬요 일정표</title>
    <link rel="icon" href="logo-icon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent:       #8bc34a;
            --accent-dark:  #6d9c32;
            --accent-light: #f1f8e9;
            --bg:           #f5f4f0;
            --surface:      #ffffff;
            --border:       rgba(0,0,0,0.07);
            --text:         #222222;
            --muted:        #888888;
            --shadow:       0 1px 4px rgba(0,0,0,0.07);
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle, rgba(139,195,74,0.10) 1px, transparent 1px);
            background-size: 22px 22px;
            min-height: 100vh;
            color: var(--text);
        }

        /* ── 상단 권한 영역 ── */
        .header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 2px 16px 0;
        }
        .header-right { display: flex; align-items: center; gap: 8px; }

        .auth-chip {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.35);
            color: #5e8426;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .auth-chip.owner {
            cursor: pointer;
            transition: background 0.15s;
            font-weight: 800;
            background: rgba(245, 255, 236, 0.92);
            border-color: rgba(139,195,74,0.26);
        }
        .auth-chip.owner:hover { background: rgba(239, 251, 223, 0.96); }
        .auth-chip.owner img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            flex-shrink: 0;
        }

        /* ── 프로필 드롭다운 ── */
        .profile-wrap { position: relative; }

        .user-badge {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        .user-badge:hover { background: rgba(255,255,255,0.30); }

        .editor-tag {
            font-size: 10px;
            background: rgba(255,255,255,0.3);
            padding: 1px 6px;
            border-radius: 8px;
        }

        .profile-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 148px;
            overflow: hidden;
            z-index: 300;
        }
        .profile-menu.open { display: block; }
        .profile-menu button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: left;
            padding: 11px 16px;
            border: none;
            background: none;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
            color: #333;
            white-space: nowrap;
        }
        .profile-menu button:hover { background: #f5f5f5; }
        .profile-menu button.danger { color: #e53935; }
        .profile-menu-divider { height: 1px; background: #f0f0f0; }

        /* ── 캘린더 네비게이션 ── */
        .cal-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px 10px;
        }
        .nav-center { display: flex; align-items: center; gap: 10px; }

        .nav-btn {
            width: 42px; height: 42px;
            border: 2px solid rgba(255,255,255,0.95);
            background: linear-gradient(180deg, #b9e87b 0%, #7fbe43 100%);
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 0 #5f9430, 0 7px 14px rgba(95,148,48,0.22);
            color: #fff;
            position: relative;
            transition: transform 0.12s, box-shadow 0.12s, filter 0.15s;
        }
        .nav-btn:hover {
            filter: brightness(1.03);
            transform: translateY(-2px) rotate(-3deg);
            box-shadow: 0 6px 0 #5f9430, 0 10px 18px rgba(95,148,48,0.25);
        }
        .nav-btn.next:hover { transform: translateY(-2px) rotate(3deg); }
        .nav-btn::after {
            content: attr(data-tip);
            position: absolute;
            left: 50%;
            bottom: calc(100% + 9px);
            transform: translateX(-50%) translateY(4px);
            background: #fff;
            color: var(--accent-dark);
            border: 1px solid rgba(109,156,50,0.22);
            border-radius: 14px;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            box-shadow: 0 5px 14px rgba(0,0,0,0.12);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s, transform 0.12s;
        }
        .nav-btn::before {
            content: "";
            position: absolute;
            left: 50%;
            bottom: calc(100% + 4px);
            transform: translateX(-50%) translateY(4px) rotate(45deg);
            width: 8px;
            height: 8px;
            background: #fff;
            border-right: 1px solid rgba(109,156,50,0.18);
            border-bottom: 1px solid rgba(109,156,50,0.18);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s, transform 0.12s;
        }
        .nav-btn:hover::after,
        .nav-btn:hover::before {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .month-label {
            font-size: 22px;
            font-weight: 700;
            min-width: 136px;
            text-align: center;
        }

        .today-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 16px;
            border-radius: 20px;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
        }
        .today-btn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent-dark); transform: translateY(-1px); }

        .view-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .view-toggle button {
            border: none;
            background: transparent;
            color: var(--muted);
            border-radius: 999px;
            padding: 6px 12px;
            font: inherit;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .view-toggle button.active {
            background: var(--accent);
            color: #fff;
        }
        .cal-area.week-mode .cal-grid {
            grid-template-rows: 1fr;
        }
        .cal-area.week-mode .cal-cell {
            min-height: 520px;
        }
        .cal-area.week-mode .cal-cell.other-month {
            display: none;
        }
        .cal-area.week-mode .chips-area {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }
        .cal-area.week-mode .chips-area .event-chip {
            flex: 1 1 0;
            grid-column: auto;
            min-height: 0;
            padding: 7px 9px;
        }
        .cal-area.week-mode .chips-area .chip-body {
            font-size: clamp(12px, 1.15vw, 18px) !important;
            line-height: 1.25;
            -webkit-line-clamp: 2;
        }
        .cal-area.week-mode .chips-area .chip-subtitle {
            font-size: clamp(9px, 0.85vw, 12px) !important;
            line-height: 1.2;
        }
        .week-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            border-radius: 9px;
            padding: 4px 7px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.25;
            border: 1px solid transparent;
            box-shadow: inset 0 -1px 0 rgba(255,255,255,0.65);
            overflow: hidden;
        }
        .week-chip span {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* ── 메인 레이아웃 ── */
        .main-layout {
            display: flex;
            gap: 16px;
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 12px 48px;
            align-items: flex-start;
        }
        .cal-area { flex: 1; min-width: 0; }

        /* ── 캘린더 그리드 ── */
        .cal-head-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 4px;
        }
        .day-label {
            text-align: center;
            font-size: clamp(16px, 2.0vw, 26px);
            font-weight: 700;
            padding: 12px 0;
            color: var(--muted);
            letter-spacing: 0.5px;
            background: rgba(255,255,255,0.82);
            border: 1px solid rgba(0,0,0,0.04);
            border-radius: 10px;
            box-shadow: inset 0 -1px 0 rgba(255,255,255,0.65);
        }
        .day-label.sun { color: #e53935; }
        .day-label.sat { color: #1976d2; }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .cal-cell {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
            min-height: 165px;
            padding: 8px;
            position: relative;
            transition: box-shadow 0.15s, transform 0.1s;
            display: flex;
            flex-direction: column;
        }
        .cal-cell.other-month {
            background: rgba(0,0,0,0.025);
            box-shadow: none;
        }
        .cal-cell.other-month .date-num { color: #ccc; }
        .cal-cell.today {
            border: 2px dashed rgba(139,195,74,0.85);
            box-shadow: 0 0 0 4px rgba(139,195,74,0.12), 0 4px 18px rgba(139,195,74,0.24);
            overflow: visible;
        }
        .cal-cell.today::before {
            content: "✦";
            position: absolute;
            top: -10px;
            left: 11px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff7a8;
            color: #7cad37;
            border: 2px solid #fff;
            border-radius: 50%;
            font-size: 14px;
            box-shadow: 0 3px 10px rgba(139,195,74,0.25);
            z-index: 2;
        }
        .cal-cell.today::after {
            content: "";
            position: absolute;
            inset: 5px;
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 9px;
            pointer-events: none;
        }
        .cal-cell.today .date-num {
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
        }
        .cal-cell.is-rest { background: #f7f7f4; }
        .cal-cell:not(.other-month):hover {
            box-shadow: 0 4px 14px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.05);
            transform: translateY(-1px);
        }

        .date-num {
            font-size: clamp(14px, 1.5vw, 20px);
            font-weight: 700;
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            margin-bottom: 2px;
        }
        .date-num.sun { color: #e53935; }
        .date-num.sat { color: #1976d2; }

        /* ── 셀 우상단 영역 ── */
        .cell-top-right {
            position: absolute;
            top: 5px; right: 5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .today-badge {
            background: var(--accent);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            letter-spacing: 0.5px;
            line-height: 1.6;
        }
        .cell-add-btn {
            width: 22px; height: 22px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: none;
            align-items: center; justify-content: center;
            opacity: 0;
            transition: opacity 0.15s, transform 0.1s;
            box-shadow: 0 2px 6px rgba(139,195,74,0.4);
        }
        .cell-add-btn:hover { transform: scale(1.12); }
        .is-editor .cell-add-btn { display: flex; }
        .cal-cell:hover .cell-add-btn { opacity: 1; }
        .is-editor .cal-cell.empty { cursor: pointer; }
        .is-editor .cal-cell.empty .cell-add-btn { display: none !important; }

        .rest-label {
            font-size: 12px;
            color: #aaa;
            font-weight: 600;
            text-align: center;
            padding: 16px 0 0;
        }

        /* ── 공휴일 표시 ── */
        .holiday-label {
            font-size: clamp(8px, 0.72vw, 10px);
            color: #e53935;
            font-weight: 700;
            margin: 0 0 3px 2px;
            line-height: 1.2;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* ── 이벤트 카드 ── */
        .chips-area {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
        }
        .chips-area.single {
            flex: 1;
        }
        .chips-area.single .event-chip {
            flex: 1;
        }
        .chips-area.single .chip-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: clamp(14px, 2.0vw, 26px);
            font-weight: 700;
            white-space: normal;
            overflow: visible;
            display: flex;
        }

        .chips-area.stable-list {
            justify-content: flex-start;
            gap: 3px;
        }
        .chips-area.stable-list .event-chip {
            min-height: 0;
            flex: 1 1 0;
            padding: 5px 7px;
            flex-direction: column;
            justify-content: center;
        }
        .chips-area.stable-list .chip-body {
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            font-weight: 700;
        }
        .chips-area.stable-list .chip-time-badge {
            font-size: clamp(8px, 0.8vw, 10px);
            line-height: 1.25;
            padding: 1px 5px;
            margin-bottom: 2px;
            align-self: flex-start;
        }
        .chips-area.stable-list .chip-subtitle {
            margin-top: 1px;
            line-height: 1.2;
        }
        .chips-area.stable-list .event-chip.has-subtitle {
            padding-top: 4px;
            padding-bottom: 4px;
            flex: 2.25 1 0;
        }
        .chips-area.stable-list .event-chip.has-subtitle .chip-body {
            font-size: clamp(8px, 0.82vw, 11px) !important;
            line-height: 1.1;
            -webkit-line-clamp: 1;
        }
        .chips-area.stable-list .event-chip.has-subtitle .chip-subtitle {
            font-size: clamp(7px, 0.68vw, 9px) !important;
            line-height: 1.1;
            -webkit-line-clamp: 1;
        }
        .chips-area.stable-list.count-3 .event-chip.has-time {
            padding-top: 3px;
            padding-bottom: 3px;
        }
        .chips-area.stable-list.count-3 .event-chip.has-time .chip-time-badge {
            font-size: clamp(7px, 0.72vw, 9px);
            line-height: 1.0;
            padding: 1px 4px;
            margin-bottom: 0;
        }
        .chips-area.stable-list.count-3 .event-chip.has-time .chip-body {
            font-size: clamp(10px, 1.1vw, 13px) !important;
            line-height: 1.08;
        }
        .chips-area.stable-list.count-3 .event-chip.short-title.has-time .chip-body {
            font-size: clamp(12px, 1.32vw, 15px) !important;
            line-height: 1.05;
        }
        .chips-area.stable-list.count-4 .event-chip.short-title .chip-body {
            font-size: clamp(11px, 1.12vw, 14px) !important;
            line-height: 1.05;
        }

        .chips-area.packed {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 3px;
            align-content: start;
        }
        .chips-area.packed .event-chip.long-title,
        .chips-area.compact .event-chip.long-title {
            grid-column: 1 / -1;
        }
        .chips-area.packed .event-chip.has-subtitle,
        .chips-area.compact .event-chip.has-subtitle {
            grid-column: 1 / -1;
            min-height: 42px;
            padding-top: 5px;
            padding-bottom: 5px;
        }
        .chips-area.packed .event-chip.has-subtitle .chip-body,
        .chips-area.compact .event-chip.has-subtitle .chip-body {
            -webkit-line-clamp: 1;
            line-height: 1.2;
        }
        .chips-area.packed .event-chip.has-subtitle .chip-subtitle,
        .chips-area.compact .event-chip.has-subtitle .chip-subtitle {
            line-height: 1.2;
            -webkit-line-clamp: 1;
        }

        /* ── 5-6 이벤트 2열 컴팩트 ── */
        .chips-area.compact {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 3px;
            flex: unset;
            align-content: start;
        }
        .chips-area.compact .event-chip {
            padding: 4px 5px;
        }
        .chips-area.compact .chip-body {
            font-size: clamp(9px, 1.0vw, 13px) !important;
            -webkit-line-clamp: 2;
        }
        .chips-area.compact .chip-time-badge {
            font-size: clamp(8px, 0.78vw, 10px);
            padding: 1px 5px;
            margin-bottom: 2px;
        }
        .chips-area.compact .chip-subtitle {
            font-size: clamp(7px, 0.68vw, 9px);
            line-height: 1.15;
        }

        .event-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 7px 9px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.72);
            width: 100%;
            text-align: center;
            box-shadow: inset 0 -1px 0 rgba(255,255,255,0.62), 0 2px 5px rgba(0,0,0,0.06);
            transition: filter 0.15s, transform 0.1s, outline 0.1s;
        }
        .event-chip:hover { filter: brightness(0.92); transform: scale(1.01); }
        .is-editor .event-chip { cursor: grab; }
        .event-chip.dragging { opacity: 0.35; cursor: grabbing; }
        .event-chip.drag-over { outline: 2px dashed var(--accent); transform: translateY(-2px); }

        .chip-time-badge {
            display: inline-block;
            background: rgba(255,255,255,0.55);
            border-radius: 20px;
            padding: 2px 8px;
            font-size: clamp(12px, 1.1vw, 16px);
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 3px;
            align-self: flex-start;
        }

        .chip-body {
            font-size: clamp(13px, 1.6vw, 20px);
            font-weight: 600;
            line-height: 1.4;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            text-align: center;
            width: 100%;
        }
        .type-icon {
            display: none;
            align-items: center;
            justify-content: center;
            min-width: 1.1em;
            margin-right: 3px;
            font-size: 0.9em;
            opacity: 0.86;
        }

        .chip-subtitle {
            font-size: clamp(10px, 0.9vw, 13px);
            font-weight: 400;
            opacity: 0.75;
            text-align: center;
            width: 100%;
            margin-top: 2px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            line-height: 1.25;
        }

        .vod-dot {
            display: inline-block;
            width: 6px; height: 6px;
            background: #ff5252;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 3px;
        }

        /* ── 범례 사이드바 ── */
        .legend-sidebar {
            width: 112px;
            flex-shrink: 0;
            padding-top: 28px;
        }
        .up-launcher {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
            padding: 8px 10px;
            border: 1px solid rgba(139,195,74,0.28);
            border-radius: 14px;
            background: linear-gradient(180deg, #f8fff1 0%, #e7f6d1 100%);
            color: #6e9731;
            box-shadow: 0 4px 12px rgba(139,195,74,0.14);
            font: inherit;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s, filter 0.15s;
        }
        .up-launcher:hover {
            filter: brightness(0.98);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(139,195,74,0.18);
        }
        .up-launcher-emoji {
            width: 18px;
            height: 18px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .legend-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 9px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--text);
            margin-bottom: 4px;
            padding: 3px 5px;
            border-radius: 5px;
            transition: background 0.15s;
        }
        .is-editor .legend-item { cursor: pointer; }
        .is-editor .legend-item:hover { background: var(--accent-light); }
        .legend-add {
            margin-left: auto;
            font-size: 15px;
            font-weight: 700;
            color: var(--accent);
            opacity: 0;
            transition: opacity 0.15s;
            line-height: 1;
        }
        .is-editor .legend-item:hover .legend-add { opacity: 1; }
        .legend-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            line-height: 1;
        }
        .legend-sticker {
            margin-top: 16px;
            text-align: center;
            opacity: 0.88;
        }
        .legend-sticker img {
            width: 76px;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.12));
        }

        /* ── 모달 공통 ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: #fff;
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            position: relative;
            box-shadow: 0 12px 40px rgba(0,0,0,0.18);
        }

        .modal-close {
            position: absolute;
            top: 16px; right: 16px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--muted);
            line-height: 1;
        }
        .modal-close:hover { color: var(--text); }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            padding-right: 28px;
        }
        /* ── UP 랭킹 모달 ── */
        #upModal .modal { max-width: 520px; }
        .up-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .up-tab-btn {
            padding: 5px 13px;
            border-radius: 999px;
            border: 1.5px solid var(--border);
            background: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            color: var(--muted);
            font-family: 'Noto Sans KR', sans-serif;
            transition: background 0.12s, color 0.12s;
        }
        .up-tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .up-event-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .up-event-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            flex: 1;
            min-width: 0;
        }
        .up-goto-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 13px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
            font-family: 'Noto Sans KR', sans-serif;
            flex-shrink: 0;
        }
        .up-goto-btn:hover { opacity: 0.85; }
        .up-ranking-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
            max-height: 52vh;
            overflow-y: auto;
        }
        .up-rank-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 11px;
            border-radius: 11px;
            border: 1.5px solid var(--border);
            background: #fff;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .up-rank-item:hover {
            background: #fdf3e3;
            border-color: var(--accent);
        }
        .up-rank-num {
            font-size: 16px;
            font-weight: 900;
            color: var(--accent);
            min-width: 22px;
            text-align: center;
        }
        .up-rank-num.top1 { color: #e8a020; }
        .up-rank-num.top2 { color: #888; }
        .up-rank-num.top3 { color: #b87333; }
        .up-rank-profile {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--border);
        }
        .up-rank-info { flex: 1; min-width: 0; }
        .up-rank-name { font-size: 13px; font-weight: 700; color: var(--text); }
        .up-rank-handle { font-size: 11px; color: var(--muted); }
        .up-rank-time { font-size: 11px; color: var(--muted); margin-top: 1px; }
        .up-rank-count {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            font-weight: 900;
            color: var(--accent);
            white-space: nowrap;
        }
        .up-updated {
            font-size: 11px;
            color: var(--muted);
            text-align: right;
            margin-top: 8px;
        }
        .up-empty {
            text-align: center;
            padding: 36px 0;
            color: var(--muted);
            font-size: 14px;
        }
        /* ── 어드민 탭 ── */
        .admin-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }
        .admin-tab-btn {
            padding: 7px 16px;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            font-family: 'Noto Sans KR', sans-serif;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .admin-tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        .admin-section { display: none; }
        .admin-section.active { display: block; }

        /* ── 보기 모달 ── */
        .view-section { margin-bottom: 12px; }
        .view-label { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
        .view-value { font-size: 15px; }

        .type-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .vod-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ff5252;
            color: #fff;
            text-decoration: none;
            padding: 9px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }
        .vod-link:hover { background: #e53935; }

        /* ── 폼 ── */
        .field { margin-bottom: 13px; }
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 5px;
        }
        .field input, .field select, .field textarea {
            width: 100%;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 8px 10px;
            font: inherit;
            font-size: 14px;
            outline: none;
            background: #fff;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .field input:focus, .field select:focus, .field textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .field textarea { resize: vertical; min-height: 64px; }
        .field-row { display: flex; gap: 10px; }
        .field-row .field { flex: 1; margin-bottom: 0; }

        .check-field {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 13px;
        }
        .check-field input { width: auto; cursor: pointer; }

        /* ── 버튼 ── */
        .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
        .btn {
            flex: 1;
            min-width: 92px;
            padding: 10px;
            border-radius: 12px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: filter 0.15s, transform 0.1s;
        }
        .btn:hover { filter: brightness(0.93); transform: translateY(-1px); }
        .btn-primary  { background: var(--accent); color: #fff; }
        .btn-danger   { background: #ff5252; color: #fff; }
        .btn-secondary{ background: #f0f0f0; color: var(--text); }

        /* ── 편집자 관리 ── */
        .editor-list {
            border: 1px solid #ebebeb;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 14px;
        }
        .editor-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid #f5f5f5;
            font-size: 14px;
        }
        .editor-item:last-child { border-bottom: none; }
        .editor-remove-btn {
            background: none;
            border: 1px solid #ffcdd2;
            color: #e53935;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .editor-remove-btn:hover { background: #ffebee; }
        .editor-add-row { display: flex; gap: 8px; }
        .editor-add-row input {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 8px 10px;
            font: inherit;
            font-size: 14px;
            outline: none;
        }
        .editor-add-row input:focus { border-color: var(--accent); }
        .editor-add-row button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .editor-add-row button:hover { background: var(--accent-dark); }

        /* ── 토스트 ── */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #333;
            color: #fff;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 9999;
            transition: transform 0.25s;
            white-space: nowrap;
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ── 메모 툴팁 ── */
        .memo-tooltip {
            position: fixed;
            background: #2d2d2d;
            color: #fff;
            font-size: 13px;
            line-height: 1.6;
            padding: 9px 13px;
            border-radius: 8px;
            max-width: 240px;
            z-index: 9000;
            pointer-events: none;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            opacity: 0;
            transition: opacity 0.15s;
        }
        .memo-tooltip.show { opacity: 1; }

        .mobile-schedule-view,
        .mobile-add-fab {
            display: none;
        }

        /* ── 반응형 ── */
        @media (max-width: 900px) {
            .legend-sidebar { display: none; }
        }
        @media (max-width: 640px) {
            body {
                background: #f6f6f6;
                background-image: none;
                height: 100dvh;
                overflow: hidden;
                overflow-x: hidden;
            }
            .header {
                background: transparent;
                box-shadow: none;
                border-radius: 0;
                min-height: 0;
                height: auto;
                padding: 4px 14px 0;
                position: relative;
            }
            .header-right {
                position: relative;
                right: auto;
                top: auto;
            }
            .auth-chip,
            .user-badge {
                background: #fff;
                border: 2px solid #d8d8d8;
                color: #777;
                min-width: 54px;
                justify-content: center;
                padding: 6px 10px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            }
            .cal-nav {
                padding: 8px 16px 8px;
            }
            .nav-center {
                width: 100%;
                justify-content: center;
                background: #fff;
                border: 1px solid #f5d5dd;
                border-radius: 999px;
                box-shadow: 0 7px 20px rgba(0,0,0,0.06);
                padding: 11px 16px;
            }
            .nav-btn {
                display: none;
            }
            .today-btn {
                display: none;
            }
            .view-toggle #weekModeBtn,
            .view-toggle #monthModeBtn {
                display: none;
            }
            .month-label {
                min-width: auto;
                color: #4a3131;
                font-size: 20px;
                font-weight: 900;
            }
            .month-label::after {
                content: "⌄";
                font-size: 18px;
                margin-left: 8px;
            }
            .main-layout {
                display: none;
            }
            .mobile-schedule-view {
                display: block;
                height: calc(100dvh - 146px);
                padding: 8px 14px 0;
                overflow-y: auto;
            }
            .mobile-day-card {
                background: #fff;
                border-radius: 20px;
                padding: 12px 14px;
                margin-bottom: 10px;
                box-shadow: 0 8px 24px rgba(0,0,0,0.05);
                position: relative;
            }
            .mobile-day-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                margin-bottom: 10px;
            }
            .mobile-date-title {
                color: #2f2f2f;
                font-size: 22px;
                font-weight: 900;
                line-height: 1;
            }
            .mobile-date-title.sun {
                color: #e45147;
            }
            .mobile-today-badge {
                background: #ff827a;
                color: #fff;
                border-radius: 999px;
                padding: 7px 13px;
                font-size: 12px;
                font-weight: 900;
                box-shadow: 0 4px 12px rgba(255,130,122,0.28);
            }
            .mobile-event-list {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .mobile-event-pill {
                min-height: clamp(36px, 6vh, 44px);
                width: 100%;
                border-radius: 16px;
                border: 1px solid transparent;
                display: grid;
                grid-template-columns: auto 1fr auto;
                align-items: center;
                gap: 10px;
                padding: 10px 13px;
                font: inherit;
                cursor: pointer;
                box-shadow: inset 0 -1px 0 rgba(255,255,255,0.62);
            }
            .mobile-event-time {
                background: #fffefa;
                border-radius: 10px;
                padding: 5px 8px;
                color: #ff7f35;
                font-size: 14px;
                font-weight: 900;
                min-width: 52px;
                text-align: center;
            }
            .mobile-event-title {
                color: inherit;
                font-size: 16px;
                font-weight: 900;
                text-align: center;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .mobile-event-icon {
                font-size: 14px;
                opacity: 0.72;
            }
            .mobile-empty-note {
                color: #b8b8b8;
                font-size: 14px;
                font-weight: 700;
                padding-top: 8px;
            }
            .mobile-add-fab {
                position: fixed;
                right: 18px;
                bottom: 96px;
                z-index: 240;
                width: 58px;
                height: 58px;
                border-radius: 50%;
                border: none;
                background: #ff6074;
                color: #fff;
                font-size: 25px;
                font-weight: 900;
                box-shadow: 0 8px 22px rgba(255,96,116,0.36);
                align-items: center;
                justify-content: center;
            }
            .is-editor .mobile-add-fab {
                display: flex;
            }
        }
        /* ── 이스터에그 ── */
        @keyframes confettiFall {
            0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }
        @keyframes stickerFly {
            0%   { transform: translateX(0) translateY(0) rotate(0deg) scale(1); opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translateX(calc(100vw + 100px)) translateY(var(--dy)) rotate(var(--rot)) scale(0.7); opacity: 0; }
        }
        .easter-confetti {
            position: fixed; top: 0; pointer-events: none; z-index: 9998;
            width: 10px; height: 10px; border-radius: 2px;
            animation: confettiFall linear forwards;
        }
        .easter-sticker {
            position: fixed; pointer-events: none; z-index: 9998;
            animation: stickerFly linear forwards;
        }
        .birthday-overlay {
            position: fixed; inset: 0; z-index: 9997;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.45);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .birthday-card {
            background: #fff; border-radius: 28px;
            padding: 36px 32px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            max-width: 320px; width: 90%;
            animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        .birthday-card .bd-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
        .birthday-card .bd-title { font-size: 22px; font-weight: 900; color: #e8508a; margin-bottom: 8px; }
        .birthday-card .bd-msg   { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 20px; }
        .birthday-card .bd-close {
            background: linear-gradient(135deg, #ff7eb3, #e8508a);
            color: #fff; border: none; border-radius: 999px;
            padding: 10px 28px; font-size: 14px; font-weight: 800;
            cursor: pointer; font-family: inherit;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-right" id="headerRight"></div>
</header>

<!-- 네비게이션 -->
<div class="cal-nav">
    <div class="nav-center">
        <button class="today-btn" onclick="goToday()">Today</button>
        <button class="nav-btn prev" onclick="changeMonth(-1)" data-tip="이전 달">&#8249;</button>
        <span class="month-label" id="monthLabel"></span>
        <button class="nav-btn next" onclick="changeMonth(1)" data-tip="다음 달">&#8250;</button>
        <div class="view-toggle" role="group" aria-label="캘린더 보기">
            <button type="button" id="weekModeBtn" onclick="setViewMode('week')">주간</button>
            <button type="button" id="monthModeBtn" onclick="setViewMode('month')">월간</button>
            <button type="button" onclick="goToday()">Today</button>
            <button type="button" onclick="openUpModal()"><img src="stickers/s8.png" alt="" style="width:14px;height:14px;vertical-align:middle;margin-right:3px;">UP</button>
        </div>
    </div>
</div>

<!-- 모바일 일정 리스트 -->
<main class="mobile-schedule-view" id="mobileScheduleView"></main>

<!-- 메인 레이아웃 -->
<div class="main-layout">
    <div class="cal-area">
        <div class="cal-head-row">
            <div class="day-label sun">SUN</div>
            <div class="day-label">MON</div>
            <div class="day-label">TUE</div>
            <div class="day-label">WED</div>
            <div class="day-label">THU</div>
            <div class="day-label">FRI</div>
            <div class="day-label sat">SAT</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="legend-sidebar" id="legend"></div>
</div>

<button class="mobile-add-fab" onclick="openAddModal(dateToStr(new Date()))" title="일정 추가">＋</button>
<!-- ─── 보기 모달 ─── -->
<div class="modal-overlay" id="viewModal" onmousedown="if(event.target===this)closeViewModal()">
    <div class="modal">
        <button class="modal-close" onclick="closeViewModal()">×</button>
        <div id="viewContent"></div>
        <div class="btn-row" id="viewBtns"></div>
    </div>
</div>

<!-- ─── 추가/수정 모달 ─── -->
<div class="modal-overlay" id="editModal" onmousedown="if(event.target===this)closeEditModal()">
    <div class="modal">
        <button class="modal-close" onclick="closeEditModal()">×</button>
        <div class="modal-title" id="editModalTitle">일정 추가</div>

        <div class="field-row" style="margin-bottom:13px;">
            <div class="field">
                <label>시작 날짜 *</label>
                <input type="date" id="editDate">
            </div>
            <div class="field">
                <label>종료 날짜</label>
                <input type="date" id="editEndDate">
            </div>
        </div>
        <div class="field-row" style="margin-bottom:13px;">
            <div class="field">
                <label>방송 시간</label>
                <input type="time" id="editTime">
            </div>
            <div class="field">
                <label>방송 길이</label>
                <input type="text" id="editDuration" placeholder="예: 02:30">
            </div>
        </div>
        <div class="field">
            <label>제목 *</label>
            <input type="text" id="editTitle" placeholder="방송/일정 제목">
        </div>
        <div class="field">
            <label>컨텐츠 유형</label>
            <select id="editType"></select>
        </div>
        <div class="field">
            <label>콜라보 (w.)</label>
            <input type="text" id="editCollab" placeholder="예: 크로방, 서브병주">
        </div>
        <div class="field">
            <label>부제</label>
            <input type="text" id="editSubtitle" placeholder="부제목">
        </div>
        <div class="field">
            <label>다시보기 URL</label>
            <input type="url" id="editVodUrl" placeholder="https://...">
        </div>
        <div class="field">
            <label>메모</label>
            <textarea id="editMemo" placeholder="추가 메모"></textarea>
        </div>

function formatDate(s) {
    if (!s) return '';
    const [y, m, d] = s.split('-');
    return `${y}년 ${+m}월 ${+d}일`;
}
function dateFromStr(s) {
    const [y, m, d] = String(s).split('-').map(Number);

    const d = new Date(date);

function eventOnDate(ev, dateStr) {
    return dateStr >= ev.date && dateStr <= eventEndDate(ev);
}
function typeStyle(t) {
    return `background:${t.color};color:${t.text};border-color:${t.border || t.text};`;

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
    );
}
function safeUrl(s) {

}

// ─── 드래그앤드랍 순서 ───
let dragState = { id: null, dateStr: null };
let _dragged = false;

function getLocalOrder(dateStr, events) {
    const saved = localStorage.getItem('beadyo_order_' + dateStr);
    if (!saved) return events.map(e => e.id);
    const ids = saved.split(',');
    const ordered = [];
    ids.forEach(id => { if (events.find(e => e.id === id)) ordered.push(id); });
    events.forEach(ev => { if (!ordered.includes(ev.id)) ordered.push(ev.id); });
    return ordered;
}

function applyLocalOrder(dateStr, events) {
    const order = getLocalOrder(dateStr, events);
    return order.map(id => events.find(e => e.id === id)).filter(Boolean);
}

function dragStart(e, id, dateStr) {
    _dragged = false;
    dragState = { id, dateStr };
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
}
function dragEnd(e) {
    _dragged = true;
    setTimeout(() => { _dragged = false; }, 100);
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
}
function dragOver(e, id, dateStr) {
    if (dragState.dateStr !== dateStr || dragState.id === id) return;
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
}
function dragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
}
function dragDrop(e, targetId, dateStr) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    const { id: sourceId, dateStr: srcDate } = dragState;
    if (!sourceId || sourceId === targetId || srcDate !== dateStr) return;

    const cellEvents = state.events.filter(ev => {
        const endDate = ev.end_date || ev.date;
        return dateStr >= ev.date && dateStr <= endDate;
    });
    const order = getLocalOrder(dateStr, cellEvents);
    const fromIdx = order.indexOf(sourceId);
    const toIdx   = order.indexOf(targetId);
    if (fromIdx === -1 || toIdx === -1) return;

    order.splice(fromIdx, 1);
    order.splice(toIdx, 0, sourceId);
    localStorage.setItem('beadyo_order_' + dateStr, order.join(','));
    renderCalendar();
    dragState = { id: null, dateStr: null };
}

// ─── 데이터 로드 ───
async function loadEvents() {
    const first = toDateStr(state.year, state.month, 1);
    const last  = toDateStr(state.year, state.month, new Date(state.year, state.month + 1, 0).getDate());
    // 이전 달부터 로드해 다중일 이벤트 커버
    const prev  = new Date(state.year, state.month - 1, 1);
    const extFirst = `${prev.getFullYear()}-${pad(prev.getMonth() + 1)}-01`;

    const { data, error } = await db
        .from('schedules')
        .select('*')
        .gte('date', extFirst)
        .lte('date', last)
        .order('date')
        .order('start_time', { nullsFirst: false });

    if (error) {
        console.error('loadEvents:', error);
        state.events = [];
        renderCalendar();
        return;
    }
    state.events = data ?? [];
    renderCalendar();
}

async function loadEditors() {
    const { data, error } = await db.from('editors').select('*').order('created_at');
    if (error) {
        console.error('loadEditors:', error);
        state.editors = [];
        return;
    }
    state.editors = data ?? [];
}

function eventsForDate(dateStr) {
    return state.events
        .filter(ev => eventOnDate(ev, dateStr))
        .sort((a, b) => {
            if (!!b.is_rest !== !!a.is_rest) return (b.is_rest ? 1 : 0) - (a.is_rest ? 1 : 0);
            return String(a.start_time || '99:99').localeCompare(String(b.start_time || '99:99'));
        });
}

function renderMobileSchedule() {
    const wrap = document.getElementById('mobileScheduleView');
    if (!wrap) return;
    const todayStr = dateToStr(new Date());
    const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
    const [y, m, d] = state.mobileStartDate.split('-').map(Number);
    const cards = [];

    for (let i = 0; i < 3; i++) {
        const date = new Date(y, m - 1, d + i);
        const dateStr = dateToStr(date);
        const events = eventsForDate(dateStr);
        const dow = date.getDay();
        const day = date.getDate();
        const titleCls = dow === 0 ? ' sun' : '';
        const eventHtml = events.length
            ? events.map(ev => {
                const t = typeOf(ev.type);
                const time = ev.start_time ? ev.start_time.slice(0, 5) : '미정';
                return `<button class="mobile-event-pill" style="${typeStyle(t)}" onclick="openViewModal('${esc(ev.id)}')">
                    <span class="mobile-event-time">${esc(time)}</span>
                    <span class="mobile-event-title">${esc(ev.title)}</span>
                    <span class="mobile-event-icon">${esc(t.icon)}</span>
                </button>`;
            }).join('')
            : `<div class="mobile-empty-note">일정이 비어있어요</div>`;
        cards.push(`<section class="mobile-day-card">
            <div class="mobile-day-head">
                <div class="mobile-date-title${titleCls}">${day}일(${dayNames[dow]})</div>
                ${dateStr === todayStr ? '<div class="mobile-today-badge">TODAY</div>' : ''}
            </div>
            <div class="mobile-event-list">${eventHtml}</div>
        </section>`);
    }

    wrap.innerHTML = cards.join('');
}

function renderCalendar() {
    document.getElementById('monthLabel').textContent = `${state.year}.${pad(state.month + 1)}`;
    document.getElementById('weekModeBtn')?.classList.toggle('active', state.viewMode === 'week');
    document.getElementById('monthModeBtn')?.classList.toggle('active', state.viewMode === 'month');
    document.querySelector('.cal-area')?.classList.toggle('week-mode', state.viewMode === 'week');

    const today    = new Date();
    const todayStr = toDateStr(today.getFullYear(), today.getMonth(), today.getDate());

    const cells = [];
    if (state.viewMode === 'week') {
        const base = state.year === today.getFullYear() && state.month === today.getMonth()
            ? today
            : new Date(state.year, state.month, 1);
        const start = addDays(base, -base.getDay());
        for (let i = 0; i < 7; i++) {
            const date = addDays(start, i);
            cells.push({
                day: date.getDate(),
                dateStr: dateToStr(date),
                other: date.getMonth() !== state.month,
            });
        }
    } else {
        const firstWd  = new Date(state.year, state.month, 1).getDay();
        const daysInM  = new Date(state.year, state.month + 1, 0).getDate();
        const daysInP  = new Date(state.year, state.month, 0).getDate();
        for (let i = firstWd - 1; i >= 0; i--)
            cells.push({ day: daysInP - i, dateStr: toDateStr(state.year, state.month - 1, daysInP - i), other: true });
        for (let d = 1; d <= daysInM; d++)
            cells.push({ day: d, dateStr: toDateStr(state.year, state.month, d), other: false });
        for (let d = 1; cells.length < 42; d++)
            cells.push({ day: d, dateStr: toDateStr(state.year, state.month + 1, d), other: true });
    }

    document.getElementById('calGrid').innerHTML = cells.map(({ day, dateStr, other }, idx) => {
        const dow     = idx % 7;
        const isToday = !other && dateStr === todayStr;
        const events  = other ? [] : applyLocalOrder(dateStr,
            state.events.filter(e => {
                return eventOnDate(e, dateStr);
            }).sort((a, b) => (b.is_rest ? 1 : 0) - (a.is_rest ? 1 : 0))
        );
        const hasRest = events.some(e => e.is_rest);

        const isEmpty = !other && events.length === 0;
        const cellCls = ['cal-cell',
            other   ? 'other-month' : '',
            isToday ? 'today'       : '',
            hasRest ? 'is-rest'     : '',
            isEmpty ? 'empty'       : '',
        ].filter(Boolean).join(' ');

        const cellClick = isEmpty && state.isEditor
            ? `onclick="openAddModal('${dateStr}')"` : '';

        const isHoliday = !other && !!HOLIDAYS[dateStr];
        const numCls = ['date-num',
            (dow === 0 || isHoliday) ? 'sun' : dow === 6 ? 'sat' : '',
        ].filter(Boolean).join(' ');

        const isSingle  = events.length === 1;
        const isStableList = events.length >= 2 && events.length <= 4;
        const isPacked  = events.length >= 5;
        const isCompact = events.length >= 5 && events.length <= 6;
        const chipsHtml = events.map(ev => {
            const t        = typeOf(ev.type);
            const isMulti  = ev.end_date && ev.end_date !== ev.date;
            const isStart  = ev.date === dateStr;
            const isEnd    = (ev.end_date || ev.date) === dateStr;
            const visStart = isStart || dow === 0;
            const visEnd   = isEnd   || dow === 6;

            let br = '10px';
            if (isMulti) {
                if      (visStart && visEnd) br = '10px';
                else if (visStart)           br = '10px 0 0 10px';
                else if (visEnd)             br = '0 10px 10px 0';
                else                         br = '0';
            }

            const timeBadge = isStart && ev.start_time
                ? `<div class="chip-time-badge">${toAmPm(ev.start_time)}</div>` : '';
            const vodDot = isStart && ev.vod_url
                ? `<span class="vod-dot"></span>` : '';
            const bodyStyle = `${!isStart ? 'opacity:0.55;' : ''}font-size:${chipFontSize(ev.title, isSingle, isCompact, events.length)};`;
            const titleSizeClass = String(ev.title ?? '').length <= 5 ? 'short-title' : 'long-title';
            const subtitleClass = isStart && ev.subtitle ? ' has-subtitle' : '';

            const memoAttr = isStart && ev.memo
                ? `data-memo="${esc(ev.memo)}"` : '';
            const memoEvents = isStart && ev.memo
                ? `onmouseenter="showMemoTooltip(event)" onmouseleave="hideMemoTooltip()"` : '';

            const subtitleHtml = isStart && ev.subtitle
                ? `<div class="chip-subtitle" style="font-size:${chipSubtitleFontSize(ev.subtitle, isSingle, isCompact)};">${esc(ev.subtitle)}</div>` : '';

            const dragAttrs = state.isEditor && isStart
                ? `draggable="true"
                   ondragstart="dragStart(event,'${esc(ev.id)}','${dateStr}')"
                   ondragend="dragEnd(event)"
                   ondragover="dragOver(event,'${esc(ev.id)}','${dateStr}')"
                   ondragleave="dragLeave(event)"
                   ondrop="dragDrop(event,'${esc(ev.id)}','${dateStr}')"` : '';

            const timeClass = isStart && ev.start_time ? ' has-time' : '';

            return `<button class="event-chip ${titleSizeClass}${subtitleClass}${timeClass}"
                style="${typeStyle(t)}border-radius:${br};"
                onclick="if(!_dragged)openViewModal('${esc(ev.id)}')"
                ${memoAttr} ${memoEvents} ${dragAttrs}
                title="${esc(ev.title)}">${timeBadge}<div class="chip-body" style="${bodyStyle}"><span class="type-icon">${esc(t.icon)}</span>${vodDot}${esc(ev.title)}</div>${subtitleHtml}</button>`;
        }).join('');

        const holiday   = !other ? (HOLIDAYS[dateStr] || null) : null;
        const holHtml   = holiday ? `<div class="holiday-label">${esc(holiday)}</div>` : '';
        const todayBadge = isToday ? `<span class="today-badge">TODAY</span>` : '';
        const addBtn = !other
            ? `<button class="cell-add-btn" onclick="openAddModal('${dateStr}')" title="일정 추가">+</button>`
            : '';
        const topRight = !other
            ? `<div class="cell-top-right">${todayBadge}${addBtn}</div>` : '';

        const chipsClass = `chips-area${isSingle ? ' single' : ''}${isStableList ? ' stable-list' : ''}${isPacked ? ' packed' : ''}${isCompact ? ' compact' : ''}${isStableList ? ` count-${events.length}` : ''}`;
        const body = `<div class="${chipsClass}">${chipsHtml}</div>`;

        return `<div class="${cellCls}" ${cellClick}>
            <div class="${numCls}">${day}</div>
            ${holHtml}
            ${topRight}
            ${body}
        </div>`;
    }).join('');
    renderSecondaryViews();
}

function parseSoopUrl(url) {
    const clean = url.split('#')[0];
    const m = clean.match(/\/(?:station\/)?(\w+)\/post\/(\d+)/);
    return m ? [m[1], m[2]] : [null, null];
}

async function fetchSoopRankingLive(bjId, postNo) {
    const PROXY = 'https://clever-rhino-36.hanul4269.deno.net';
    const allItems = [];
    let page = 1, lastPage = 1;
    do {
        const target = `https://api-channel.sooplive.com/v1.1/channel/${bjId}/post/${postNo}/comment?page=${page}&orderBy=reg_date&cCommentNo=0&perPage=100`;
        const url = `${PROXY}?url=${encodeURIComponent(target)}`;
        try {
            const resp = await fetch(url, { signal: AbortSignal.timeout(10000) });
            if (!resp.ok) break;
            const d = await resp.json();
            const items = d.data || [];
            for (const it of items) {
                if (it.pCommentNo) {
                    allItems.push({
                        bj_id:       String(it.userId || '').trim(),
                        name:        String(it.userNick || '').trim(),
                        profile_url: String(it.profileImage || '').trim(),
                        timestamp:   String(it.regDate || '').trim(),
                        up_count:    parseInt(it.likeCnt || 0) || 0,
                        reply_no:    String(it.pCommentNo || ''),
                    });
                }
            }
            lastPage = (d.meta || {}).lastPage || 1;
        } catch (e) {
            console.log('SOOP fetch error:', e.message);
            break;
        }
        page++;
    } while (page <= lastPage);

    if (!allItems.length) return null;
    allItems.sort((a, b) => b.up_count - a.up_count);
    allItems.forEach((r, i) => r.rank = i + 1);
    return allItems;
}

function renderUpModal(data, fetchLive = false) {
    const events = data.events || [];
    if (!events.length) {
        document.getElementById('upModalContent').innerHTML =
            '<div class="up-empty">진행 중인 UP 이벤트가 없습니다</div>';
        return;
    }
    const updatedStr = data.updated
        ? new Date(data.updated).toLocaleString('ko-KR') : '-';

    let currentIdx = 0;

    function renderTab(idx) {
        currentIdx = idx;
        const ev = events[idx];
        const tabs = events.map((e, i) =>
            `<button class="up-tab-btn${i===idx?' active':''}" onclick="renderUpTab(${i})">${esc(e.tab)}</button>`
        ).join('');
        const ranking = ev.ranking || [];
        const baseUrl = ev.soop_url.split('#')[0];
        const items = ranking.length
            ? ranking.map(r => {
                const cls = r.rank <= 3 ? ` top${r.rank}` : '';
                const href = r.reply_no ? `${baseUrl}#comment_noti${esc(r.reply_no)}` : esc(ev.soop_url);
                return `<div class="up-rank-item" role="link" tabindex="0" data-href="${esc(href)}"
                    onclick="window.open(this.dataset.href,'_blank','noopener noreferrer')"
                    onkeydown="if(event.key==='Enter')window.open(this.dataset.href,'_blank','noopener noreferrer')">
                    <div class="up-rank-num${cls}">${r.rank}</div>
                    <img class="up-rank-profile" src="${esc(r.profile_url)}"
                         onerror="this.src='stickers/s8.png'" alt="" loading="lazy">
                    <div class="up-rank-info">
                        <div class="up-rank-name">${esc(r.name)}</div>
                        <div class="up-rank-handle">@${esc(r.bj_id)}</div>
                        <div class="up-rank-time">${esc(r.timestamp)}</div>
                    </div>
                    <div class="up-rank-count">👍 ${Number(r.up_count).toLocaleString()}</div>
                </div>`;
            }).join('')
            : '<div class="up-empty">랭킹 데이터를 불러오는 중입니다...</div>';

        document.getElementById('upModalContent').innerHTML = `
            <div class="up-tabs">${tabs}</div>
            <div class="up-event-header">
                <div class="up-event-title">${esc(ev.title)}</div>
                <a class="up-goto-btn" href="${esc(ev.soop_url)}" target="_blank" rel="noopener">UP 바로가기 ↗</a>
            </div>
            <div class="up-ranking-list">${items}</div>
            <div class="up-updated">업데이트: ${updatedStr}</div>`;
    }

    window.renderUpTab = (idx) => renderTab(idx);
    renderTab(0);

    if (fetchLive) {
        events.forEach(async (ev, idx) => {
            const [bjId, postNo] = parseSoopUrl(ev.soop_url);
            if (!bjId) return;
            const ranking = await fetchSoopRankingLive(bjId, postNo);
            if (ranking !== null) {
                ev.ranking = ranking;
                if (currentIdx === idx) renderTab(idx);
            }
        });
    }
}

async function repeatWeekly(id) {
    const ev = state.events.find(e => e.id === id);
    if (!ev || !state.isEditor) return;
    const count = Number(prompt('몇 주 반복할까요? 다음 주부터 생성됩니다.', '4'));
    if (!Number.isInteger(count) || count < 1 || count > 24) {
        showToast('1~24 사이 숫자로 입력해주세요');
        return;
    }
    const payloads = Array.from({ length: count }, (_, i) => {
        const offset = (i + 1) * 7;
        const payload = {
            date: dateToStr(addDays(dateFromStr(ev.date), offset)),
            end_date: ev.end_date ? dateToStr(addDays(dateFromStr(ev.end_date), offset)) : null,
            start_time: ev.start_time || null,
            duration: ev.duration || null,
            title: ev.title,
            type: ev.type,
            collab: ev.collab || null,
            subtitle: ev.subtitle || null,
            vod_url: ev.vod_url || null,
            memo: ev.memo || null,
            is_rest: !!ev.is_rest,
        };
        return payload;
    });
    const { error } = await db.from('schedules').insert(payloads);
    if (error) { showToast('반복 생성 실패: ' + error.message); return; }
    showToast(`${count}개 반복 일정이 생성되었습니다`);
    closeViewModal();
    await loadEvents();
}

async function saveEvent() {
    const title = document.getElementById('editTitle').value.trim();
    if (!title) { showToast('제목을 입력해주세요'); return; }
    const date = document.getElementById('editDate').value;
    if (!date)  { showToast('날짜를 선택해주세요'); return; }

    const payload = {
        date,
        end_date:   document.getElementById('editEndDate').value   || null,
        start_time: document.getElementById('editTime').value      || null,
        duration:   document.getElementById('editDuration').value.trim() || null,
        title,
        type:       document.getElementById('editType').value,
        collab:     document.getElementById('editCollab').value.trim()   || null,
        subtitle:   document.getElementById('editSubtitle').value.trim() || null,
        vod_url:    document.getElementById('editVodUrl').value.trim()   || null,
        memo:       document.getElementById('editMemo').value.trim()     || null,
        is_rest:    document.getElementById('editIsRest').checked,
    };

    const id = document.getElementById('editId').value;
    const { error } = id
        ? await db.from('schedules').update(payload).eq('id', id)
        : await db.from('schedules').insert(payload);

    if (error) { showToast('저장 실패: ' + error.message); return; }
    showToast(id ? '수정되었습니다' : '추가되었습니다');
    closeEditModal();
    await loadEvents();
}

async function deleteEvent(id) {
    if (!confirm('이 일정을 삭제하시겠습니까?')) return;
    const { error } = await db.from('schedules').delete().eq('id', id);
    if (error) { showToast('삭제 실패'); return; }
    showToast('삭제되었습니다');
    closeViewModal();
    await loadEvents();
}

    }
    list.innerHTML = state.editors.map(e => `
        <div class="editor-item">
            <span>${esc(e.email)}</span>
            <button class="editor-remove-btn" onclick="removeEditor('${esc(e.id)}')">삭제</button>
        </div>
    `).join('');
}

async function addEditor() {
    const email = document.getElementById('newEditorEmail').value.trim().toLowerCase();
    if (!email.includes('@')) { showToast('올바른 이메일을 입력해주세요'); return; }
    const { error } = await db.from('editors').insert({ email, added_by: state.user?.email });
    if (error) {
        showToast(error.code === '23505' ? '이미 등록된 이메일입니다' : '추가 실패');
        return;
    }
    document.getElementById('newEditorEmail').value = '';
    showToast(`${email} 추가됨`);
    await loadEditors();
    renderEditorList();
}

async function removeEditor(id) {
    if (!confirm('이 편집자를 삭제하시겠습니까?')) return;
    const { error } = await db.from('editors').delete().eq('id', id);
    if (error) { showToast('삭제 실패'); return; }
    await loadEditors();
    renderEditorList();
    showToast('삭제되었습니다');
}

// ─── UP 이벤트 관리 ───
let upEvents = [];

async function loadUpEvents() {
    const { data, error } = await db.from('up_events').select('*').order('sort_order');
    if (!error) upEvents = data || [];
}

function renderUpEventList() {
    const list = document.getElementById('upEventList');
    if (!upEvents.length) {
        list.innerHTML = '<div class="editor-item" style="color:var(--muted);">등록된 UP 이벤트가 없습니다.</div>';
        return;
    }
    list.innerHTML = upEvents.map(e => `
        <div class="editor-item">
            <span style="flex:1;min-width:0;overflow:hidden;">
                <b>${esc(e.tab_name)}</b>
                <span style="color:var(--muted);font-size:12px;margin-left:6px;">${esc(e.title)}</span>
                <span style="color:${e.is_active ? 'var(--accent)' : 'var(--muted)'};font-size:11px;margin-left:6px;">${e.is_active ? '●활성' : '●비활성'}</span>
            </span>
            <button class="editor-remove-btn" onclick="removeUpEvent(${e.id})">삭제</button>
        </div>
    `).join('');
}

async function addUpEvent() {
    const tabName  = document.getElementById('newUpTab').value.trim();
    const title    = document.getElementById('newUpTitle').value.trim();
    const soopUrl  = document.getElementById('newUpUrl').value.trim();
    const sortOrder = parseInt(document.getElementById('newUpOrder').value) || 0;
    if (!tabName || !title || !soopUrl) { showToast('탭 이름, 제목, URL을 모두 입력해주세요'); return; }
    if (!soopUrl.includes('sooplive') && !soopUrl.includes('afreecatv')) {
        showToast('올바른 SOOP URL을 입력해주세요'); return;
    }
    const { error } = await db.from('up_events').insert({
        tab_name: tabName, title, soop_url: soopUrl, sort_order: sortOrder, is_active: true,
    });
    if (error) { showToast('추가 실패: ' + error.message); return; }
    ['newUpTab','newUpTitle','newUpUrl','newUpOrder'].forEach(id => {
        document.getElementById(id).value = '';
    });
    showToast('UP 이벤트 추가됨');
    await loadUpEvents();
    renderUpEventList();
}

async function removeUpEvent(id) {
    if (!confirm('이 UP 이벤트를 삭제하시겠습니까?')) return;
    const { error } = await db.from('up_events').delete().eq('id', id);
    if (error) { showToast('삭제 실패'); return; }
    await loadUpEvents();
    renderUpEventList();
    showToast('삭제되었습니다');
}

// ─── 네비게이션 ───
function setViewMode(mode) {
    state.viewMode = mode === 'week' ? 'week' : 'month';
    renderCalendar();
}

function changeMonth(delta) {
    state.month += delta;
    if (state.month > 11) { state.month = 0; state.year++; }
    if (state.month < 0)  { state.month = 11; state.year--; }
    state.mobileStartDate = `${state.year}-${String(state.month + 1).padStart(2, '0')}-01`;
    loadEvents();
}
function goToday() {
    const now = new Date();
    state.year  = now.getFullYear();
    state.month = now.getMonth();
    state.mobileStartDate = dateToStr(now);
    loadEvents();
}

function navigateMobileDays(delta) {
    const [y, m, d] = state.mobileStartDate.split('-').map(Number);
    const next = new Date(y, m - 1, d + delta);
    state.mobileStartDate = dateToStr(next);
    const newYear = next.getFullYear();
    const newMonth = next.getMonth();
    if (newYear !== state.year || newMonth !== state.month) {
        state.year = newYear;
        state.month = newMonth;
        loadEvents();
    } else {
        renderMobileSchedule();
    }
}

function normalizeAuthUser(userLike) {
    if (!userLike?.email) return null;
    return {
        email: userLike.email,
        name: userLike.name || userLike.user_metadata?.full_name || userLike.user_metadata?.name || userLike.email,
        picture: userLike.picture || userLike.user_metadata?.avatar_url || userLike.user_metadata?.picture || '',
    };
}

async function initAuth() {
    const { data: { session } } = await db.auth.getSession();
    await setSessionUser(normalizeAuthUser(session?.user));
    db.auth.onAuthStateChange((_event, session) => {
        setSessionUser(normalizeAuthUser(session?.user));
    });

    window.addEventListener('message', event => {
        const { data } = event;
        if (!data || data.type !== 'beadyo-auth-sync') return;
        setSessionUser(normalizeAuthUser(data.user));
    });

    window.addEventListener('message', event => {
        const { data } = event;
        if (!data || data.type !== 'beadyo-auth-action') return;
        if (data.action === 'open-admin' && state.isOwner) openAdminModal();
    });
}

async function setSessionUser(user) {
    state.user = user ? {
        email: user.email,
        name: user.name || user.email,
        picture: user.picture || '',
    } : null;
    if (!state.user) {
        state.isEditor = false;
        state.isOwner = false;
        document.body.classList.remove('is-editor');
        updateHeaderUI();
        renderCalendar();
        return;
    }
    state.isOwner = state.user.email.toLowerCase() === OWNER_EMAIL.toLowerCase();
    await loadEditors();
    state.isEditor = state.isOwner || state.editors.some(e => e.email.toLowerCase() === state.user.email.toLowerCase());
    document.body.classList.toggle('is-editor', state.isEditor);
    updateHeaderUI();
    renderCalendar();
}

function updateHeaderUI() {
    const right = document.getElementById('headerRight');
    right.innerHTML = '';
}

// ─── 모바일 스와이프 ───
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 60) {
        if (window.innerWidth <= 640) {
            navigateMobileDays(dx < 0 ? 3 : -3);
        } else {
            changeMonth(dx < 0 ? 1 : -1);
        }
    }
}, { passive: true });

// ─── 초기화 ───
renderLegend();
renderCalendar();
loadEvents().catch(err => {
    console.error('initial loadEvents:', err);
    state.events = [];
    renderCalendar();
});
initAuth();
checkBirthday();

// ── 이스터에그 ──
const STICKERS = ['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11','s12','s13','s14','s15'];
const CONFETTI_COLORS = ['#ff7eb3','#ffcd3c','#7bc67e','#6eb5ff','#ff8c69','#c77dff','#ff6b6b'];

function launchConfetti(count = 80) {
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const el = document.createElement('div');
            el.className = 'easter-confetti';
            el.style.cssText = `
                left: ${Math.random() * 100}vw;
                background: ${CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)]};
                width: ${6 + Math.random() * 8}px;
                height: ${6 + Math.random() * 8}px;
                border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                animation-duration: ${2 + Math.random() * 2}s;
                animation-delay: ${Math.random() * 0.5}s;
            `;
            document.body.appendChild(el);
            el.addEventListener('animationend', () => el.remove());
        }, i * 20);
    }
}

function launchStickerRain() {
    const picks = [...STICKERS].sort(() => Math.random() - 0.5).slice(0, 12);
    picks.forEach((s, i) => {
        setTimeout(() => {
            const el = document.createElement('img');
            el.className = 'easter-sticker';
            const size = 36 + Math.random() * 30;
            const top  = 5 + Math.random() * 80;
            const dy   = (Math.random() - 0.5) * 120;
            const rot  = (Math.random() - 0.5) * 540;
            const dur  = 1.2 + Math.random() * 0.8;
            el.src = `stickers/${s}.png`;
            el.style.cssText = `
                width: ${size}px; height: ${size}px;
                left: -${size + 10}px; top: ${top}vh;
                --dy: ${dy}px; --rot: ${rot}deg;
                animation-duration: ${dur}s;
            `;
            document.body.appendChild(el);
            el.addEventListener('animationend', () => el.remove());
        }, i * 120);
    });
}

function showBirthdayPopup() {
    const overlay = document.createElement('div');
    overlay.className = 'birthday-overlay';
    overlay.innerHTML = `
        <div class="birthday-card">
            <div class="bd-emoji">🎂</div>
            <div class="bd-title">구슬요 생일 축하해요!</div>
            <div class="bd-msg">오늘은 구슬요의 생일이에요 🎉<br>항상 건강하고 행복하게<br>방송해줘서 고마워요 💚</div>
            <button class="bd-close" onclick="this.closest('.birthday-overlay').remove()">감사해요 🫶</button>
        </div>`;
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
    launchConfetti(120);
}

function checkBirthday() {
    const now = new Date();
    if (now.getMonth() === 7 && now.getDate() === 18) {
        setTimeout(showBirthdayPopup, 1200);
    }
}

// 월 레이블 클릭 10번 이스터에그
let _labelClicks = 0, _labelTimer = null;
document.getElementById('monthLabel').addEventListener('click', () => {
    _labelClicks++;
    clearTimeout(_labelTimer);
    _labelTimer = setTimeout(() => { _labelClicks = 0; }, 1500);
    if (_labelClicks >= 5) {
        _labelClicks = 0;
        launchStickerRain();
    }
});
</script>
