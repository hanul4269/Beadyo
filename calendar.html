<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구슬요 일정표</title>
    <link rel="icon" href="logo-icon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://qlmcwobfldgmhwhptkfz.supabase.co">
    <script defer src="supabase.min.js"></script>
    <script defer src="app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet"></noscript>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent:       #8bc34a;
            --accent-dark:  #6d9c32;
            --accent-light: #f1f8e9;
            --bg:           #f5f4f0;
            --surface:      #ffffff;
            --border:       rgba(0,0,0,0.07);
            --text:         #222222;
            --muted:        #888888;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle, rgba(139,195,74,0.10) 1px, transparent 1px);
            background-size: 22px 22px;
            min-height: 100vh;
            color: var(--text);
        }

        /* ── 상단 권한 영역 ── */
        .header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 2px 16px 0;
        }
        .header-right { display: flex; align-items: center; gap: 8px; }

        .auth-chip {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.35);
            color: #5e8426;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .auth-chip.owner {
            cursor: pointer;
            transition: background 0.15s;
            font-weight: 800;
            background: rgba(245, 255, 236, 0.92);
            border-color: rgba(139,195,74,0.26);
        }
        .auth-chip.owner:hover { background: rgba(239, 251, 223, 0.96); }
        .auth-chip.owner img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            flex-shrink: 0;
        }

        /* ── 프로필 드롭다운 ── */
        .profile-wrap { position: relative; }

        .user-badge {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        .user-badge:hover { background: rgba(255,255,255,0.30); }

        .editor-tag {
            font-size: 10px;
            background: rgba(255,255,255,0.3);
            padding: 1px 6px;
            border-radius: 8px;
        }

        .profile-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 148px;
            overflow: hidden;
            z-index: 300;
        }
        .profile-menu.open { display: block; }
        .profile-menu button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: left;
            padding: 11px 16px;
            border: none;
            background: none;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
            color: #333;
            white-space: nowrap;
        }
        .profile-menu button:hover { background: #f5f5f5; }
        .profile-menu button.danger { color: #e53935; }
        .profile-menu-divider { height: 1px; background: #f0f0f0; }

        /* ── 캘린더 네비게이션 ── */
        .cal-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px 10px;
        }
        .nav-center { display: flex; align-items: center; gap: 10px; }

        .nav-btn {
            width: 42px; height: 42px;
            border: 2px solid rgba(255,255,255,0.95);
            background: linear-gradient(180deg, #b9e87b 0%, #7fbe43 100%);
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 0 #5f9430, 0 7px 14px rgba(95,148,48,0.22);
            color: #fff;
            position: relative;
            transition: transform 0.12s, box-shadow 0.12s, filter 0.15s;
        }
        .nav-btn:hover {
            filter: brightness(1.03);
            transform: translateY(-2px) rotate(-3deg);
            box-shadow: 0 6px 0 #5f9430, 0 10px 18px rgba(95,148,48,0.25);
        }
        .nav-btn.next:hover { transform: translateY(-2px) rotate(3deg); }
        .nav-btn::after {
            content: attr(data-tip);
            position: absolute;
            left: 50%;
            top: calc(100% + 9px);
            transform: translateX(-50%) translateY(-4px);
            background: #fff;
            color: var(--accent-dark);
            border: 1px solid rgba(109,156,50,0.22);
            border-radius: 14px;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            box-shadow: 0 5px 14px rgba(0,0,0,0.12);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s, transform 0.12s;
            z-index: 200;
        }
        .nav-btn::before {
            content: "";
            position: absolute;
            left: 50%;
            top: calc(100% + 4px);
            transform: translateX(-50%) translateY(-4px) rotate(45deg);
            width: 8px;
            height: 8px;
            background: #fff;
            border-left: 1px solid rgba(109,156,50,0.18);
            border-top: 1px solid rgba(109,156,50,0.18);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s, transform 0.12s;
            z-index: 201;
        }
        .nav-btn:hover::after,
        .nav-btn:hover::before {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .month-label {
            font-size: 22px;
            font-weight: 700;
            min-width: 136px;
            text-align: center;
        }

        .today-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 16px;
            border-radius: 20px;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
        }
        .today-btn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent-dark); transform: translateY(-1px); }

        .view-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .view-toggle button {
            border: none;
            background: transparent;
            color: var(--muted);
            border-radius: 999px;
            padding: 6px 12px;
            font: inherit;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .view-toggle button.active {
            background: var(--accent);
            color: #fff;
        }
        #mobileTodayBtn { display: none; }
        .cal-area.week-mode .cal-grid {
            grid-template-rows: 1fr;
        }
        .cal-area.week-mode .cal-cell {
            min-height: 520px;
        }
        .cal-area.week-mode .cal-cell.other-month {
            display: none;
        }
        .cal-area.week-mode .chips-area {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }
        .cal-area.week-mode .chips-area .event-chip {
            flex: 1 1 0;
            grid-column: auto;
            min-height: 0;
            padding: 7px 9px;
        }
        .cal-area.week-mode .chips-area .chip-body {
            font-size: clamp(12px, 1.15vw, 18px) !important;
            line-height: 1.25;
            -webkit-line-clamp: 2;
        }
        .cal-area.week-mode .chips-area .chip-subtitle {
            font-size: clamp(9px, 0.85vw, 12px) !important;
            line-height: 1.2;
        }
        .week-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            border-radius: 9px;
            padding: 4px 7px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.25;
            border: 1px solid transparent;
            box-shadow: inset 0 -1px 0 rgba(255,255,255,0.65);
            overflow: hidden;
        }
        .week-chip span {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* ── 메인 레이아웃 ── */
        .main-layout {
            display: flex;
            gap: 16px;
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 12px 48px;
            align-items: flex-start;
        }
        .cal-area { flex: 1; min-width: 0; }

        /* ── 캘린더 그리드 ── */
        .cal-head-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 4px;
        }
        .day-label {
            text-align: center;
            font-size: clamp(16px, 2.0vw, 26px);
            font-weight: 700;
            padding: 12px 0;
            color: var(--muted);
            letter-spacing: 0.5px;
            background: rgba(255,255,255,0.82);
            border: 1px solid rgba(0,0,0,0.04);
            border-radius: 10px;
            box-shadow: inset 0 -1px 0 rgba(255,255,255,0.65);
        }
        .day-label.sun { color: #e53935; }
        .day-label.sat { color: #1976d2; }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .cal-cell {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
            min-height: 165px;
            padding: 8px;
            position: relative;
            transition: box-shadow 0.15s, transform 0.1s;
            display: flex;
            flex-direction: column;
        }
        .cal-cell.other-month {
            background: rgba(0,0,0,0.025);
            box-shadow: none;
        }
        .cal-cell.other-month .date-num { color: #ccc; }
        .cal-cell.today {
            border: 2px dashed rgba(139,195,74,0.85);
            box-shadow: 0 0 0 4px rgba(139,195,74,0.12), 0 4px 18px rgba(139,195,74,0.24);
            overflow: visible;
        }
        .cal-cell.today::before {
            content: "✦";
            position: absolute;
            top: -10px;
            left: 11px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff7a8;
            color: #7cad37;
            border: 2px solid #fff;
            border-radius: 50%;
            font-size: 14px;
            box-shadow: 0 3px 10px rgba(139,195,74,0.25);
            z-index: 2;
        }
        .cal-cell.today::after {
            content: "";
            position: absolute;
            inset: 5px;
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 9px;
            pointer-events: none;
        }
        .cal-cell.today .date-num {
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
        }
        .cal-cell.is-rest { background: #f7f7f4; }
        .cal-cell:not(.other-month):hover {
            box-shadow: 0 4px 14px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.05);
            transform: translateY(-1px);
        }

        .date-num {
            font-size: clamp(14px, 1.5vw, 20px);
            font-weight: 700;
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            margin-bottom: 2px;
        }
        .date-num.sun { color: #e53935; }
        .date-num.sat { color: #1976d2; }

        /* ── 셀 우상단 영역 ── */
        .cell-top-right {
            position: absolute;
            top: 5px; right: 5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .today-badge {
            background: var(--accent);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            letter-spacing: 0.5px;
            line-height: 1.6;
        }
        .cell-add-btn {
            width: 22px; height: 22px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: none;
            align-items: center; justify-content: center;
            opacity: 0;
            transition: opacity 0.15s, transform 0.1s;
            box-shadow: 0 2px 6px rgba(139,195,74,0.4);
        }
        .cell-add-btn:hover { transform: scale(1.12); }
        .is-editor .cell-add-btn { display: flex; }
        .cal-cell:hover .cell-add-btn { opacity: 1; }
        .is-editor .cal-cell.empty { cursor: pointer; }
        .is-editor .cal-cell.empty .cell-add-btn { display: none !important; }

        .rest-label {
            font-size: 12px;
            color: #aaa;
            font-weight: 600;
            text-align: center;
            padding: 16px 0 0;
        }

        /* ── 공휴일 표시 ── */
        .holiday-label {
            font-size: clamp(8px, 0.72vw, 10px);
            color: #e53935;
            font-weight: 700;
            margin: 0 0 3px 2px;
            line-height: 1.2;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* ── 이벤트 카드 ── */
        .chips-area {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
        }
        .chips-area.single {
            flex: 1;
        }
        .chips-area.single .event-chip {
            flex: 1;
        }
        .chips-area.single .chip-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: clamp(14px, 2.0vw, 26px);
            font-weight: 700;
            white-space: normal;
            overflow: visible;
            display: flex;
        }

        .chips-area.stable-list {
            justify-content: flex-start;
            gap: 3px;
        }
        .chips-area.stable-list .event-chip {
            min-height: 0;
            flex: 1 1 0;
            padding: 5px 7px;
            flex-direction: column;
            justify-content: center;
        }
        .chips-area.stable-list .chip-body {
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            font-weight: 700;
        }
        .chips-area.stable-list .chip-time-badge {
            font-size: clamp(8px, 0.8vw, 10px);
            line-height: 1.25;
            padding: 1px 5px;
            margin-bottom: 2px;
            align-self: flex-start;
        }
        .chips-area.stable-list .chip-subtitle {
            margin-top: 1px;
            line-height: 1.2;
        }
        .chips-area.stable-list .event-chip.has-subtitle {
            padding-top: 4px;
            padding-bottom: 4px;
            flex: 2.25 1 0;
        }
        .chips-area.stable-list .event-chip.has-subtitle .chip-body {
            font-size: clamp(8px, 0.82vw, 11px) !important;
            line-height: 1.1;
            -webkit-line-clamp: 1;
        }
        .chips-area.stable-list .event-chip.has-subtitle .chip-subtitle {
            font-size: clamp(7px, 0.68vw, 9px) !important;
            line-height: 1.1;
            -webkit-line-clamp: 1;
        }
        .chips-area.stable-list.count-3 .event-chip.has-time {
            padding-top: 3px;
            padding-bottom: 3px;
        }
        .chips-area.stable-list.count-3 .event-chip.has-time .chip-time-badge {
            font-size: clamp(7px, 0.72vw, 9px);
            line-height: 1.0;
            padding: 1px 4px;
            margin-bottom: 0;
        }
        .chips-area.stable-list.count-3 .event-chip.has-time .chip-body {
            font-size: clamp(10px, 1.1vw, 13px) !important;
            line-height: 1.08;
        }
        .chips-area.stable-list.count-3 .event-chip.short-title.has-time .chip-body {
            font-size: clamp(12px, 1.32vw, 15px) !important;
            line-height: 1.05;
        }
        .chips-area.stable-list.count-4 .event-chip.short-title .chip-body {
            font-size: clamp(11px, 1.12vw, 14px) !important;
            line-height: 1.05;
        }

        .chips-area.packed {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 3px;
            align-content: start;
        }
        .chips-area.packed .event-chip.long-title,
        .chips-area.compact .event-chip.long-title {
            grid-column: 1 / -1;
        }
        .chips-area.packed .event-chip.has-subtitle,
        .chips-area.compact .event-chip.has-subtitle {
            grid-column: 1 / -1;
            min-height: 42px;
            padding-top: 5px;
            padding-bottom: 5px;
        }
        .chips-area.packed .event-chip.has-subtitle .chip-body,
        .chips-area.compact .event-chip.has-subtitle .chip-body {
            -webkit-line-clamp: 1;
            line-height: 1.2;
        }
        .chips-area.packed .event-chip.has-subtitle .chip-subtitle,
        .chips-area.compact .event-chip.has-subtitle .chip-subtitle {
            line-height: 1.2;
            -webkit-line-clamp: 1;
        }

        /* ── 5-6 이벤트 2열 컴팩트 ── */
        .chips-area.compact {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 3px;
            flex: unset;
            align-content: start;
        }
        .chips-area.compact .event-chip {
            padding: 4px 5px;
        }
        .chips-area.compact .chip-body {
            font-size: clamp(9px, 1.0vw, 13px) !important;
            -webkit-line-clamp: 2;
        }
        .chips-area.compact .chip-time-badge {
            font-size: clamp(8px, 0.78vw, 10px);
            padding: 1px 5px;
            margin-bottom: 2px;
        }
        .chips-area.compact .chip-subtitle {
            font-size: clamp(7px, 0.68vw, 9px);
            line-height: 1.15;
        }

        .event-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 7px 9px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.72);
            width: 100%;
            text-align: center;
            box-shadow: inset 0 -1px 0 rgba(255,255,255,0.62), 0 2px 5px rgba(0,0,0,0.06);
            transition: filter 0.15s, transform 0.1s, outline 0.1s;
        }
        .event-chip:hover { filter: brightness(0.92); transform: scale(1.01); }
        .is-editor .event-chip { cursor: grab; }
        .event-chip.dragging { opacity: 0.35; cursor: grabbing; }
        .event-chip.drag-over { outline: 2px dashed var(--accent); transform: translateY(-2px); }

        .chip-time-badge {
            display: inline-block;
            background: rgba(255,255,255,0.55);
            border-radius: 20px;
            padding: 2px 8px;
            font-size: clamp(12px, 1.1vw, 16px);
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 3px;
            align-self: flex-start;
        }

        .chip-body {
            font-size: clamp(13px, 1.6vw, 20px);
            font-weight: 600;
            line-height: 1.4;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            text-align: center;
            width: 100%;
        }
        .chip-subtitle {
            font-size: clamp(10px, 0.9vw, 13px);
            font-weight: 400;
            opacity: 0.75;
            text-align: center;
            width: 100%;
            margin-top: 2px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            line-height: 1.25;
        }

        .vod-dot {
            display: inline-block;
            width: 6px; height: 6px;
            background: #ff5252;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 3px;
        }

        /* ── 범례 사이드바 ── */
        .legend-sidebar {
            width: 112px;
            flex-shrink: 0;
            padding-top: 28px;
        }
        .up-launcher {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
            padding: 8px 10px;
            border: 1px solid rgba(139,195,74,0.28);
            border-radius: 14px;
            background: linear-gradient(180deg, #f8fff1 0%, #e7f6d1 100%);
            color: #6e9731;
            box-shadow: 0 4px 12px rgba(139,195,74,0.14);
            font: inherit;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s, filter 0.15s;
        }
        .up-launcher:hover {
            filter: brightness(0.98);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(139,195,74,0.18);
        }
        .up-launcher-emoji {
            width: 18px;
            height: 18px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .legend-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 9px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--text);
            margin-bottom: 4px;
            padding: 3px 5px;
            border-radius: 5px;
            transition: background 0.15s;
        }
        .is-editor .legend-item { cursor: pointer; }
        .is-editor .legend-item:hover { background: var(--accent-light); }
        .legend-add {
            margin-left: auto;
            font-size: 15px;
            font-weight: 700;
            color: var(--accent);
            opacity: 0;
            transition: opacity 0.15s;
            line-height: 1;
        }
        .is-editor .legend-item:hover .legend-add { opacity: 1; }
        .legend-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            line-height: 1;
        }
        .legend-sticker {
            margin-top: 16px;
            text-align: center;
            opacity: 0.88;
        }
        .legend-sticker img {
            width: 76px;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.12));
        }

        /* ── 모달 공통 ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: #fff;
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            position: relative;
            box-shadow: 0 12px 40px rgba(0,0,0,0.18);
        }

        .modal-close {
            position: absolute;
            top: 16px; right: 16px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--muted);
            line-height: 1;
        }
        .modal-close:hover { color: var(--text); }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            padding-right: 28px;
            white-space: pre-wrap;
        }
        /* ── UP 랭킹 모달 ── */
        #upModal .modal { max-width: 520px; }
        .up-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .up-tab-btn {
            padding: 5px 13px;
            border-radius: 999px;
            border: 1.5px solid var(--border);
            background: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            color: var(--muted);
            font-family: 'Noto Sans KR', sans-serif;
            transition: background 0.12s, color 0.12s;
        }
        .up-tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .up-event-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .up-event-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            flex: 1;
            min-width: 0;
        }
        .up-goto-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 13px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
            font-family: 'Noto Sans KR', sans-serif;
            flex-shrink: 0;
        }
        .up-goto-btn:hover { opacity: 0.85; }
        .up-ranking-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
            max-height: 52vh;
            overflow-y: auto;
        }
        .up-rank-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 11px;
            border-radius: 11px;
            border: 1.5px solid var(--border);
            background: #fff;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .up-rank-item:hover {
            background: #fdf3e3;
            border-color: var(--accent);
        }
        .up-rank-num {
            font-size: 16px;
            font-weight: 900;
            color: var(--accent);
            min-width: 22px;
            text-align: center;
        }
        .up-rank-num.top1 { color: #e8a020; }
        .up-rank-num.top2 { color: #888; }
        .up-rank-num.top3 { color: #b87333; }
        .up-rank-profile {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--border);
        }
        .up-rank-info { flex: 1; min-width: 0; }
        .up-rank-name { font-size: 13px; font-weight: 700; color: var(--text); }
        .up-rank-handle { font-size: 11px; color: var(--muted); }
        .up-rank-time { font-size: 11px; color: var(--muted); margin-top: 1px; }
        .up-rank-count {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            font-weight: 900;
            color: var(--accent);
            white-space: nowrap;
        }
        .up-updated {
            font-size: 11px;
            color: var(--muted);
            text-align: right;
            margin-top: 8px;
        }
        .up-empty {
            text-align: center;
            padding: 36px 0;
            color: var(--muted);
            font-size: 14px;
        }
        /* ── 어드민 탭 ── */
        .admin-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }
        .admin-tab-btn {
            padding: 7px 16px;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            font-family: 'Noto Sans KR', sans-serif;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .admin-tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        .admin-section { display: none; }
        .admin-section.active { display: block; }

        /* ── 보기 모달 ── */
        .view-section { margin-bottom: 12px; }
        .view-label { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
        .view-value { font-size: 15px; }

        .type-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .vod-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ff5252;
            color: #fff;
            text-decoration: none;
            padding: 9px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }
        .vod-link:hover { background: #e53935; }

        /* ── 폼 ── */
        .field { margin-bottom: 13px; }
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 5px;
        }
        .field input, .field select, .field textarea {
            width: 100%;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 8px 10px;
            font: inherit;
            font-size: 14px;
            outline: none;
            background: #fff;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .field input:focus, .field select:focus, .field textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .field textarea { resize: vertical; min-height: 64px; }
        #editTitle { min-height: 0; height: 54px; resize: none; line-height: 1.45; }
        .field-row { display: flex; gap: 10px; }
        .field-row .field { flex: 1; margin-bottom: 0; }

        .check-field {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 13px;
        }
        .check-field input { width: auto; cursor: pointer; }

        /* ── 버튼 ── */
        .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
        .btn {
            flex: 1;
            min-width: 92px;
            padding: 10px;
            border-radius: 12px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: filter 0.15s, transform 0.1s;
        }
        .btn:hover { filter: brightness(0.93); transform: translateY(-1px); }
        .btn-primary  { background: var(--accent); color: #fff; }
        .btn-danger   { background: #ff5252; color: #fff; }
        .btn-secondary{ background: #f0f0f0; color: var(--text); }

        /* ── 편집자 관리 ── */
        .editor-list {
            border: 1px solid #ebebeb;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 14px;
        }
        .editor-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid #f5f5f5;
            font-size: 14px;
        }
        .editor-item:last-child { border-bottom: none; }
        .editor-remove-btn {
            background: none;
            border: 1px solid #ffcdd2;
            color: #e53935;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .editor-remove-btn:hover { background: #ffebee; }
        .editor-add-row { display: flex; gap: 8px; }
        .editor-add-row input {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 8px 10px;
            font: inherit;
            font-size: 14px;
            outline: none;
        }
        .editor-add-row input:focus { border-color: var(--accent); }
        .editor-add-row button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .editor-add-row button:hover { background: var(--accent-dark); }

        /* ── 토스트 ── */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #333;
            color: #fff;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 9999;
            transition: transform 0.25s;
            white-space: nowrap;
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ── 메모 툴팁 ── */
        .memo-tooltip {
            position: fixed;
            background: #2d2d2d;
            color: #fff;
            font-size: 13px;
            line-height: 1.6;
            padding: 9px 13px;
            border-radius: 8px;
            max-width: 240px;
            z-index: 9000;
            pointer-events: none;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            opacity: 0;
            transition: opacity 0.15s;
        }
        .memo-tooltip.show { opacity: 1; }

        .mobile-schedule-view,
        .mobile-add-fab {
            display: none;
        }

        /* ── 반응형 ── */
        @media (max-width: 900px) {
            .legend-sidebar { display: none; }
        }
        @media (max-width: 640px) {
            body {
                background: #f6f6f6;
                background-image: none;
                height: 100dvh;
                overflow: hidden;
            }
            .header {
                background: transparent;
                box-shadow: none;
                border-radius: 0;
                min-height: 0;
                height: auto;
                padding: 4px 14px 0;
                position: relative;
            }
            .header-right {
                position: relative;
                right: auto;
                top: auto;
            }
            .auth-chip,
            .user-badge {
                background: #fff;
                border: 2px solid #d8d8d8;
                color: #777;
                min-width: 54px;
                justify-content: center;
                padding: 6px 10px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            }
            .cal-nav {
                padding: 8px 16px 8px;
            }
            .nav-center {
                width: 100%;
                justify-content: center;
                background: #fff;
                border: 1px solid #f5d5dd;
                border-radius: 999px;
                box-shadow: 0 7px 20px rgba(0,0,0,0.06);
                padding: 11px 16px;
            }
            .nav-btn {
                display: none;
            }
            .today-btn {
                display: none;
            }
            .view-toggle #weekModeBtn,
            .view-toggle #monthModeBtn {
                display: none;
            }
            #mobileTodayBtn {
                display: inline-block;
            }
            .month-label {
                min-width: auto;
                color: #4a3131;
                font-size: 20px;
                font-weight: 900;
            }
            .month-label::after {
                content: "⌄";
                font-size: 18px;
                margin-left: 8px;
            }
            .main-layout {
                display: none;
            }
            .mobile-schedule-view {
                display: block;
                height: calc(100dvh - 146px);
                padding: 8px 14px 0;
                overflow-y: auto;
            }
            .mobile-day-card {
                background: #fff;
                border-radius: 20px;
                padding: 12px 14px;
                margin-bottom: 10px;
                box-shadow: 0 8px 24px rgba(0,0,0,0.05);
                position: relative;
            }
            .mobile-day-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                margin-bottom: 10px;
            }
            .mobile-date-title {
                color: #2f2f2f;
                font-size: 22px;
                font-weight: 900;
                line-height: 1;
            }
            .mobile-date-title.sun {
                color: #e45147;
            }
            .mobile-today-badge {
                background: #ff827a;
                color: #fff;
                border-radius: 999px;
                padding: 7px 13px;
                font-size: 12px;
                font-weight: 900;
                box-shadow: 0 4px 12px rgba(255,130,122,0.28);
            }
            .mobile-event-list {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .mobile-event-pill {
                min-height: clamp(36px, 6vh, 44px);
                width: 100%;
                border-radius: 16px;
                border: 1px solid transparent;
                display: grid;
                grid-template-columns: auto 1fr auto;
                align-items: center;
                gap: 10px;
                padding: 10px 13px;
                font: inherit;
                cursor: pointer;
                box-shadow: inset 0 -1px 0 rgba(255,255,255,0.62);
            }
            .mobile-event-time {
                background: #fffefa;
                border-radius: 10px;
                padding: 5px 8px;
                color: #ff7f35;
                font-size: 14px;
                font-weight: 900;
                min-width: 52px;
                text-align: center;
            }
            .mobile-event-title {
                color: inherit;
                font-size: 16px;
                font-weight: 900;
                text-align: center;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .mobile-event-icon {
                font-size: 14px;
                opacity: 0.72;
            }
            .mobile-empty-note {
                color: #b8b8b8;
                font-size: 14px;
                font-weight: 700;
                padding-top: 8px;
            }
            .mobile-add-fab {
                position: fixed;
                right: 18px;
                bottom: 96px;
                z-index: 240;
                width: 58px;
                height: 58px;
                border-radius: 50%;
                border: none;
                background: #ff6074;
                color: #fff;
                font-size: 25px;
                font-weight: 900;
                box-shadow: 0 8px 22px rgba(255,96,116,0.36);
                align-items: center;
                justify-content: center;
            }
            .is-editor .mobile-add-fab {
                display: flex;
            }
        }
        /* ── 이스터에그 ── */
        @keyframes confettiFall {
            0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }
        @keyframes stickerFly {
            0%   { transform: translateX(0) translateY(0) rotate(0deg) scale(1); opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translateX(calc(100vw + 100px)) translateY(var(--dy)) rotate(var(--rot)) scale(0.7); opacity: 0; }
        }
        .easter-confetti {
            position: fixed; top: 0; pointer-events: none; z-index: 9998;
            width: 10px; height: 10px; border-radius: 2px;
            animation: confettiFall linear forwards;
        }
        .easter-sticker {
            position: fixed; pointer-events: none; z-index: 9998;
            animation: stickerFly linear forwards;
        }
        .birthday-overlay {
            position: fixed; inset: 0; z-index: 9997;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.45);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .birthday-card {
            background: #fff; border-radius: 28px;
            padding: 36px 32px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            max-width: 320px; width: 90%;
            animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        .birthday-card .bd-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
        .birthday-card .bd-title { font-size: 22px; font-weight: 900; color: #e8508a; margin-bottom: 8px; }
        .birthday-card .bd-msg   { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 20px; }
        .birthday-card .bd-close {
            background: linear-gradient(135deg, #ff7eb3, #e8508a);
            color: #fff; border: none; border-radius: 999px;
            padding: 10px 28px; font-size: 14px; font-weight: 800;
            cursor: pointer; font-family: inherit;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-right" id="headerRight"></div>
</header>

<!-- 네비게이션 -->
<div class="cal-nav">
    <div class="nav-center">
        <button class="today-btn" onclick="goToday()">Today</button>
        <button class="nav-btn prev" onclick="changeMonth(-1)" data-tip="이전 달">&#8249;</button>
        <span class="month-label" id="monthLabel"></span>
        <button class="nav-btn next" onclick="changeMonth(1)" data-tip="다음 달">&#8250;</button>
        <div class="view-toggle" role="group" aria-label="캘린더 보기">
            <button type="button" id="weekModeBtn" onclick="setViewMode('week')">주간</button>
            <button type="button" id="monthModeBtn" onclick="setViewMode('month')">월간</button>
            <button type="button" id="mobileTodayBtn" onclick="goToday()">Today</button>
            <button type="button" onclick="openUpModal()"><img src="stickers/s8.png" alt="" style="width:14px;height:14px;vertical-align:middle;margin-right:3px;">UP</button>
        </div>
    </div>
</div>

<!-- 모바일 일정 리스트 -->
<main class="mobile-schedule-view" id="mobileScheduleView"></main>

<!-- 메인 레이아웃 -->
<div class="main-layout">
    <div class="cal-area">
        <div class="cal-head-row">
            <div class="day-label sun">SUN</div>
            <div class="day-label">MON</div>
            <div class="day-label">TUE</div>
            <div class="day-label">WED</div>
            <div class="day-label">THU</div>
            <div class="day-label">FRI</div>
            <div class="day-label sat">SAT</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="legend-sidebar" id="legend"></div>
</div>

<button class="mobile-add-fab" onclick="openAddModal(dateToStr(new Date()))" title="일정 추가">＋</button>
<!-- ─── 보기 모달 ─── -->
<div class="modal-overlay" id="viewModal" onmousedown="if(event.target===this)closeViewModal()">
    <div class="modal">
        <button class="modal-close" onclick="closeViewModal()">×</button>
        <div id="viewContent"></div>
        <div class="btn-row" id="viewBtns"></div>
    </div>
</div>

<!-- ─── 추가/수정 모달 ─── -->
<div class="modal-overlay" id="editModal" onmousedown="if(event.target===this)closeEditModal()">
    <div class="modal">
        <button class="modal-close" onclick="closeEditModal()">×</button>
        <div class="modal-title" id="editModalTitle">일정 추가</div>

        <div class="field-row" style="margin-bottom:13px;">
            <div class="field">
                <label>시작 날짜 *</label>
                <input type="date" id="editDate">
            </div>
            <div class="field">
                <label>종료 날짜</label>
                <input type="date" id="editEndDate">
            </div>
        </div>
        <div class="field-row" style="margin-bottom:13px;">
            <div class="field">
                <label>방송 시간</label>
                <input type="time" id="editTime">
            </div>
            <div class="field">
                <label>방송 길이</label>
                <input type="text" id="editDuration" placeholder="예: 02:30">
            </div>
        </div>
        <div class="field">
            <label>제목 *</label>
            <textarea id="editTitle" rows="2" placeholder="방송/일정 제목"></textarea>
        </div>
        <div class="field">
            <label>컨텐츠 유형</label>
            <select id="editType"></select>
        </div>
        <div class="field">
            <label>콜라보 (w.)</label>
            <input type="text" id="editCollab" placeholder="예: 크로방, 서브병주">
        </div>
        <div class="field">
            <label>부제</label>
            <input type="text" id="editSubtitle" placeholder="부제목">
        </div>
        <div class="field">
            <label>다시보기 URL</label>
            <input type="url" id="editVodUrl" placeholder="https://...">
        </div>
        <div class="field">
            <label>메모</label>
            <textarea id="editMemo" placeholder="추가 메모"></textarea>
        </div>
        <label class="check-field">
            <input type="checkbox" id="editIsRest"> 휴방으로 표시
        </label>
        <input type="hidden" id="editId">
        <div class="btn-row">
            <button class="btn btn-primary" onclick="saveEvent()">저장</button>
            <button class="btn btn-secondary" onclick="closeEditModal()">취소</button>
        </div>
    </div>
</div>

<!-- ─── 편집자 관리 모달 ─── -->
<div class="modal-overlay" id="adminModal" onmousedown="if(event.target===this)closeAdminModal()">
    <div class="modal">
        <button class="modal-close" onclick="closeAdminModal()">×</button>
        <div class="modal-title">⚙ 편집 설정</div>
        <div class="admin-tabs">
            <button class="admin-tab-btn active" onclick="switchAdminTab('editors')">편집자 관리</button>
            <button class="admin-tab-btn" onclick="switchAdminTab('upevents')">UP 이벤트</button>
        </div>
        <!-- 편집자 관리 -->
        <div class="admin-section active" id="adminSectionEditors">
            <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">
                등록된 편집자는 일정을 추가·수정·삭제할 수 있습니다.
            </p>
            <div class="editor-list" id="editorList"></div>
            <div class="field">
                <label>편집자 추가</label>
                <div class="editor-add-row">
                    <input type="email" id="newEditorEmail" placeholder="example@gmail.com"
                        onkeydown="if(event.key==='Enter')addEditor()">
                    <button onclick="addEditor()">추가</button>
                </div>
            </div>
        </div>
        <!-- UP 이벤트 관리 -->
        <div class="admin-section" id="adminSectionUpevents">
            <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">
                SOOP 게시글 UP 랭킹을 5분마다 자동으로 가져옵니다.
            </p>
            <div class="editor-list" id="upEventList"></div>
            <div class="field" style="margin-top:12px;">
                <label>이벤트 추가</label>
                <div style="display:flex;flex-direction:column;gap:7px;margin-top:6px;">
                    <input type="text" id="newUpTab" placeholder="탭 이름 (예: 종겜동 운동회)">
                    <input type="text" id="newUpTitle" placeholder="제목 (예: [종겜동 운동회2] 참가 모집)">
                    <input type="url" id="newUpUrl" placeholder="SOOP 게시글 URL">
                    <div style="display:flex;gap:8px;align-items:center;">
                        <input type="number" id="newUpOrder" placeholder="순서 (기본 0)" style="width:130px;">
                        <button onclick="addUpEvent()" style="flex:1;">추가</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="upModal" onmousedown="if(event.target===this)closeUpModal()">
    <div class="modal">
        <button class="modal-close" onclick="closeUpModal()">×</button>
        <div class="modal-title">👍 UP 랭킹</div>
        <div id="upModalContent">
            <div class="up-empty">불러오는 중...</div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
<div class="memo-tooltip" id="memoTooltip"></div>

</body>
</html>
