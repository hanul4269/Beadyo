<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구슬요모아보기</title>
    <link rel="icon" type="image/webp" href="logo-icon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://docs.google.com">
    <link rel="preconnect" href="https://sheets.googleapis.com">
    <link rel="preconnect" href="https://accounts.google.com">
    <link rel="preconnect" href="https://ssl.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://ssl.gstatic.com">
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link rel="preload" href="logo-icon.webp" as="image">
    <link rel="preload" href="loading-img.png" as="image">
    <link rel="preload" href="login-icon.png" as="image">
    <link rel="preload" href="supabase.min.js" as="script">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="supabase.min.js"></script>
    <script defer src="index-app.js?v=guide-modal-20260604"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #8bc34a;
            --accent-light: #f1f8e9;
            --header-bg: #8bc34a;
            --tab-hover: rgba(139,195,74,0.1);
            --bg: #f7f7f9;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── 헤더 ── */
        .header {
            background: var(--header-bg);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 24px 8px;
            border-bottom: 2px solid rgba(255,255,255,0.35);
            gap: 8px;
            position: relative;
        }

        .logo-text {
            font-size: 39px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
            text-align: center;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-mascot {
            width: 34px;
            height: 34px;
            object-fit: contain;
            filter: drop-shadow(0 1px 4px rgba(0,0,0,0.2));
            flex-shrink: 0;
        }

        .logo-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .logo-sub {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-links {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .header-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.3);
            background: transparent;
            -webkit-appearance: none;
            transition: all 0.15s;
            cursor: pointer;
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            white-space: nowrap;
        }

        .header-link:hover {
            color: #fff;
            border-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.1);
        }

        .header-link.icon-only {
            padding: 5px 7px;
            gap: 0;
            background: rgba(255,255,255,0.18);
        }

        .header-link.icon-only:hover {
            background: rgba(255,255,255,0.32);
        }

        .header-link.icon-only img,
        .header-link.icon-only svg {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .header-link.edit-active {
            color: #fff;
            border-color: var(--accent);
            background: rgba(139,195,74,0.15);
        }

        #auth-badge {
            display: none;
            position: relative;
            align-items: center;
        }

        #auth-badge.show { display: flex; }

        .auth-menu-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .auth-trigger {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.16);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            overflow: hidden;
            padding: 0;
        }

        .auth-trigger:hover {
            background: rgba(255,255,255,0.26);
            border-color: rgba(255,255,255,0.55);
            transform: translateY(-1px);
        }

        .auth-trigger img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .auth-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 154px;
            padding: 6px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 28px rgba(0,0,0,0.16);
            border: 1px solid rgba(0,0,0,0.05);
            z-index: 120;
        }

        .auth-menu.open { display: block; }

        .auth-menu button {
            width: 100%;
            border: none;
            background: transparent;
            border-radius: 12px;
            padding: 10px 12px;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            color: #4f5d38;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auth-menu button:hover {
            background: #f4f8ee;
        }

        .auth-menu button.danger {
            color: #c44747;
        }

        .auth-menu button.danger:hover {
            background: #fff3f3;
        }

        #signout-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.75);
            font-size: 10px;
            cursor: pointer;
            padding: 0;
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
        }

        #signout-btn:hover { color: #fff; }

        /* ── 라이브 뱃지 ── */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.5px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .live-badge.is-live {
            color: #fff;
            border-color: rgba(255, 60, 60, 0.7);
            background: rgba(255, 60, 60, 0.18);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            flex-shrink: 0;
        }

        .live-badge.is-live .live-dot {
            background: #ff3c3c;
            animation: live-pulse 1.4s ease-in-out infinite;
        }

        @keyframes live-pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        /* ── 탭 ── */
        .tabs {
            display: flex;
            justify-content: center;
            padding: 0 14px;
            gap: 2px;
            overflow-x: auto;
        }

        .tabs::-webkit-scrollbar { display: none; }

        .tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            flex: 1;
            max-width: 130px;
            padding: 6px 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            color: rgba(255,255,255,0.65);
            border-bottom: 2px solid transparent;
            transition: all 0.15s, border-bottom-color 0.2s;
            white-space: nowrap;
            user-select: none;
            border-radius: 6px 6px 0 0;
            letter-spacing: 0.8px;
        }

        .tab:hover {
            color: rgba(255,255,255,0.92);
            background: var(--tab-hover);
        }

        .tab.active {
            color: #fff;
            border-bottom-color: var(--accent);
            background: rgba(139,195,74,0.1);
        }

        .tab-icon {
            width: 42px;
            height: 28px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(170deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 100%);
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.32), 0 2px 5px rgba(0,0,0,0.18);
            transition: background 0.2s, box-shadow 0.2s;
        }

        .tab-icon svg {
            width: 17px;
            height: 17px;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.18));
        }

        .tab.active .tab-icon {
            background: linear-gradient(170deg, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0.20) 100%);
            border-color: rgba(255,255,255,0.35);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 3px 8px rgba(0,0,0,0.22);
        }

        .tab:hover .tab-icon {
            background: linear-gradient(170deg, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0.13) 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.42), 0 2px 6px rgba(0,0,0,0.2);
        }

        /* ── 콘텐츠 ── */
        .content {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
        }

        .frame-stack {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .sheet-frame {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .sheet-frame.active {
            display: block;
        }

        .sheet-frame.active.loaded {
            opacity: 1;
        }

        .calendar-frame-host {
            background: #f5f4f0;
        }

        .site-footer {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 10px 16px 12px;
            border-top: 1px solid rgba(139,195,74,0.12);
            background: linear-gradient(180deg, rgba(248,251,243,0.96) 0%, rgba(244,248,238,0.98) 100%);
            color: #6b725f;
            text-align: center;
        }

        .footer-line {
            font-size: 12px;
            line-height: 1.45;
        }

        .footer-contact {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #5d6c42;
            text-decoration: none;
        }

        .footer-contact strong {
            color: #7aa53b;
            font-weight: 800;
        }

        .footer-contact:hover {
            color: #46601c;
        }

        .desktop-only { display: none; }
        .mobile-only  { display: inline-flex; }

        /* ── 데스크탑 ── */
        @media (min-width: 641px) {
            .desktop-only { display: inline-flex; align-items: center; }
            .mobile-only  { display: none !important; }
            .header-top {
                flex-direction: row;
                justify-content: space-between;
                padding: 0 32px;
                height: 56px;
                gap: 0;
            }

            .logo-group {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                flex-direction: row;
                align-items: center;
                gap: 14px;
            }

            .logo-title {
                gap: 12px;
            }

            .logo-text {
                font-size: 41px;
                letter-spacing: 4px;
            }

            .live-badge {
                padding: 7px 14px;
                font-size: 13px;
            }

            .live-dot {
                width: 8px;
                height: 8px;
            }

            .header-links {
                justify-content: flex-end;
                flex-wrap: nowrap;
                margin-left: auto;
            }

            .tabs {
                padding: 0 22px;
            }

            .tab {
                padding: 9px 8px;
                font-size: 12px;
            }

            .tab-icon {
                width: 44px;
                height: 30px;
                border-radius: 15px;
            }

            .tab-icon svg {
                width: 18px;
                height: 18px;
            }

            .quick-menu-panel {
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                width: 420px;
                border-radius: 22px 22px 0 0;
            }
        }

        /* ── 모바일 반응형 ── */
        @media (max-width: 640px) {
            /* #top-bar(margin-top:57px+height:7px)를 overflow:hidden으로 잘라냄 */
            .sheet-frame {
                top: -70px;
                height: calc(100% + 70px);
            }

            .calendar-frame-host,
            .local-frame-host {
                top: 0;
                height: 100%;
            }

            .header-top {
                padding: 10px 12px 8px;
                gap: 6px;
            }

            .logo-text {
                font-size: 35px;
                letter-spacing: 2px;
            }

            .logo-mascot {
                width: 30px;
                height: 30px;
            }

            .header-links { gap: 5px; }

            .header-link {
                padding: 5px 9px;
                font-size: 11px;
                gap: 4px;
            }

            .header-link img {
                width: 12px !important;
                height: 12px !important;
            }

            #auth-badge {
                font-size: 10px;
            }

            .auth-trigger {
                width: 32px;
                height: 32px;
            }

            .auth-menu {
                min-width: 142px;
            }

            .tabs { padding: 0 8px; }

            .tab {
                padding: 6px 4px;
                font-size: 10px;
                gap: 2px;
            }

            .tab-icon {
                width: 34px;
                height: 24px;
            }

            .tab-icon svg {
                width: 14px;
                height: 14px;
            }

            .site-footer {
                display: none;
            }

            .footer-line {
                font-size: 11px;
            }

            .footer-contact {
                gap: 6px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        /* ── 모바일 플로팅 버튼 ── */
        .mobile-fab {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            align-items: center;
            gap: 7px;
            padding: 11px 18px;
            background: var(--accent);
            color: #fff;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(139,195,74,0.45);
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            transition: opacity 0.15s;
        }

        .mobile-fab.show { display: flex; }
        .mobile-fab:hover { opacity: 0.85; }

        /* ── 퀵메뉴 ── */
        .quick-menu-btn {
            background: rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff;
            padding: 6px 13px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Noto Sans KR', sans-serif;
            transition: background 0.15s;
            line-height: 1;
        }

        .quick-menu-btn:hover { background: rgba(0,0,0,0.25); }

        .quick-menu-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 400;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .quick-menu-overlay.open { display: block; }

        .quick-menu-panel {
            display: none;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 500;
            background: #f2f2f2;
            overflow-y: auto;
            padding: 8px 16px 36px;
            border-radius: 22px 22px 0 0;
            box-shadow: 0 -4px 30px rgba(0,0,0,0.15);
            animation: slideUp 0.25s ease;
        }

        .quick-menu-panel.open { display: block; }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .qm-handle {
            width: 36px;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        .qm-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .qm-title {
            font-size: 19px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .qm-header-btns {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .qm-header-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 14px;
            border-radius: 20px;
            border: 1.5px solid var(--accent);
            background: #fff;
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Noto Sans KR', sans-serif;
            text-decoration: none;
            transition: background 0.15s;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .qm-header-btn:hover { background: var(--accent-light); }

        .qm-section { margin-bottom: 14px; }

        .qm-section-label {
            font-size: 12px;
            color: #999;
            font-weight: 600;
            margin-bottom: 8px;
            padding-left: 4px;
            letter-spacing: 0.3px;
        }

        .qm-section-card {
            background: #fff;
            border-radius: 18px;
            padding: 14px;
        }

        .qm-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .qm-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .qm-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 18px 10px;
            border-radius: 14px;
            border: 1.5px solid #efefef;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            text-decoration: none;
            font-family: 'Noto Sans KR', sans-serif;
            transition: border-color 0.15s, background 0.15s;
        }

        .qm-item:hover {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .qm-item svg { width: 28px; height: 28px; color: var(--accent); }
        .qm-item img { width: 28px; height: 28px; border-radius: 7px; }

        /* ── 로그인 모달 ── */
        .login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 700;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
        }

        .login-overlay.open { display: flex; }

        .login-modal {
            background: #fff;
            border-radius: 24px;
            padding: 40px 32px 32px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from { transform: scale(0.92); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }

        .login-modal-title {
            font-size: 42px;
            font-weight: 900;
            color: #1a1a1a;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
        }

        .login-modal-subtitle {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .login-google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: #f5f5f5;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            color: #333;
            font-family: 'Noto Sans KR', sans-serif;
            transition: background 0.15s;
            margin-bottom: 10px;
        }

        .login-google-btn:hover { background: #ebebeb; }

        .login-back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: #f5f5f5;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            color: #333;
            font-family: 'Noto Sans KR', sans-serif;
            transition: background 0.15s;
        }

        .login-back-btn:hover { background: #ebebeb; }

        /* ── 이용가이드 모달 ── */
        .guide-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 720;
            background: rgba(0,0,0,0.38);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .guide-overlay.open { display: flex; }

        .guide-modal {
            width: min(1120px, 96vw);
            height: min(760px, 90vh);
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 24px 70px rgba(0,0,0,0.25);
            animation: modalIn 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .guide-modal-head {
            height: 48px;
            padding: 0 12px 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            background: #fff;
            color: #333;
            font-size: 15px;
            font-weight: 800;
