<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구슬요모아보기</title>
    <link rel="icon" type="image/webp" href="logo-icon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://docs.google.com">
    <link rel="preconnect" href="https://sheets.googleapis.com">
    <link rel="preconnect" href="https://accounts.google.com">
    <link rel="preload" href="logo-icon.webp" as="image">
    <link rel="preload" href="loading-img.png" as="image">
    <link rel="preload" href="login-icon.png" as="image">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #8bc34a;
            --accent-light: #f1f8e9;
            --header-bg: #8bc34a;
            --header-text: #ffffff;
            --tab-active: #8bc34a;
            --tab-hover: rgba(139,195,74,0.1);
            --bg: #f7f7f9;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── 헤더 ── */
        .header {
            background: var(--header-bg);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 24px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            gap: 8px;
            position: relative;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
            text-align: center;
        }

        .header-links {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .header-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.3);
            background: transparent;
            -webkit-appearance: none;
            transition: all 0.15s;
            cursor: pointer;
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            white-space: nowrap;
        }

        .header-link:hover {
            color: #fff;
            border-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.1);
        }

        .header-link.edit-active {
            color: #fff;
            border-color: var(--accent);
            background: rgba(139,195,74,0.15);
        }

        #auth-badge {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            background: rgba(139,195,74,0.15);
            border: 1px solid rgba(139,195,74,0.4);
            color: var(--accent);
            white-space: nowrap;
            line-height: 1.3;
        }

        #auth-badge.show { display: flex; }

        #signout-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.35);
            font-size: 10px;
            cursor: pointer;
            padding: 0;
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
        }

        #signout-btn:hover { color: rgba(255,255,255,0.7); }

        /* ── 라이브 뱃지 ── */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.5px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .live-badge.is-live {
            color: #fff;
            border-color: rgba(255, 60, 60, 0.7);
            background: rgba(255, 60, 60, 0.18);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            flex-shrink: 0;
        }

        .live-badge.is-live .live-dot {
            background: #ff3c3c;
            animation: live-pulse 1.4s ease-in-out infinite;
        }

        @keyframes live-pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        /* ── 탭 ── */
        .tabs {
            display: flex;
            padding: 0 16px;
            gap: 2px;
            overflow-x: auto;
        }

        .tabs::-webkit-scrollbar { display: none; }

        .tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.45);
            border-bottom: 2px solid transparent;
            transition: all 0.15s, border-bottom-color 0.2s;
            white-space: nowrap;
            user-select: none;
            border-radius: 6px 6px 0 0;
            letter-spacing: 0.5px;
        }

        .tab:hover {
            color: rgba(255,255,255,0.85);
            background: var(--tab-hover);
        }

        .tab.active {
            color: #fff;
            border-bottom-color: var(--accent);
            background: rgba(139,195,74,0.1);
        }

        .tab-icon {
            width: 44px;
            height: 30px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.08);
            transition: background 0.2s;
        }

        .tab-icon svg {
            width: 18px;
            height: 18px;
        }

        .tab.active .tab-icon {
            background: rgba(255,255,255,0.22);
        }

        .tab:hover .tab-icon {
            background: rgba(255,255,255,0.14);
        }

        /* ── 콘텐츠 ── */
        .content {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #fff;
        }

        .sheet-frame {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .sheet-frame.active {
            display: block;
        }

        .sheet-frame.active.loaded {
            opacity: 1;
        }

        .desktop-only { display: none; }
        .mobile-only  { display: inline-flex; }

        /* ── 데스크탑 ── */
        @media (min-width: 641px) {
            .desktop-only { display: inline-flex; align-items: center; }
            .mobile-only  { display: none !important; }
            .header-top {
                flex-direction: row;
                justify-content: space-between;
                padding: 0 32px;
                height: 56px;
                gap: 0;
            }

            .logo-text {
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                font-size: 24px;
                letter-spacing: 4px;
            }

            .header-links {
                justify-content: flex-end;
                flex-wrap: nowrap;
                margin-left: auto;
            }

            .tabs {
                padding: 0 24px;
            }

            .tab {
                padding: 12px 20px;
                font-size: 13px;
            }

            .quick-menu-panel {
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                width: 420px;
                border-radius: 22px 22px 0 0;
            }
        }

        /* ── 모바일 반응형 ── */
        @media (max-width: 640px) {
            .header-top {
                padding: 10px 12px 8px;
                gap: 6px;
            }

            .logo-text {
                font-size: 18px;
                letter-spacing: 2px;
            }

            .header-links { gap: 5px; }

            .header-link {
                padding: 5px 9px;
                font-size: 11px;
                gap: 4px;
            }

            .header-link img {
                width: 12px !important;
                height: 12px !important;
            }

            .login-label { display: none; }

            #auth-badge {
                font-size: 10px;
                padding: 4px 8px;
            }

            .tabs { padding: 0 8px; }

            .tab {
                padding: 7px 12px;
                font-size: 10px;
                gap: 3px;
            }

            .tab-icon {
                width: 38px;
                height: 26px;
            }

            .tab-icon svg {
                width: 15px;
                height: 15px;
            }
        }

        /* ── 모바일 플로팅 버튼 ── */
        .mobile-fab {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            align-items: center;
            gap: 7px;
            padding: 11px 18px;
            background: var(--accent);
            color: #fff;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(139,195,74,0.45);
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            transition: opacity 0.15s;
        }

        .mobile-fab.show { display: flex; }
        .mobile-fab:hover { opacity: 0.85; }

        /* ── 퀵메뉴 ── */
        .header { position: relative; }

        .quick-menu-btn {
            background: rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff;
            padding: 6px 13px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Noto Sans KR', sans-serif;
            transition: background 0.15s;
            line-height: 1;
        }

        .quick-menu-btn:hover { background: rgba(0,0,0,0.25); }

        .quick-menu-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 400;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .quick-menu-overlay.open { display: block; }

        .quick-menu-panel {
            display: none;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 500;
            background: #f2f2f2;
            overflow-y: auto;
            padding: 8px 16px 36px;
            border-radius: 22px 22px 0 0;
            box-shadow: 0 -4px 30px rgba(0,0,0,0.15);
            animation: slideUp 0.25s ease;
        }

        .quick-menu-panel.open { display: block; }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .qm-handle {
            width: 36px;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        .qm-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .qm-title {
            font-size: 19px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .qm-header-btns {
            display: flex;
            gap: 8px;
        }

        .qm-header-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 14px;
            border-radius: 20px;
            border: 1.5px solid var(--accent);
            background: #fff;
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Noto Sans KR', sans-serif;
            text-decoration: none;
            transition: background 0.15s;
        }

        .qm-header-btn:hover { background: var(--accent-light); }

        .qm-section { margin-bottom: 14px; }

        .qm-section-label {
            font-size: 12px;
            color: #999;
            font-weight: 600;
            margin-bottom: 8px;
            padding-left: 4px;
            letter-spacing: 0.3px;
        }

        .qm-section-card {
            background: #fff;
            border-radius: 18px;
            padding: 14px;
        }

        .qm-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .qm-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .qm-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 18px 10px;
            border-radius: 14px;
            border: 1.5px solid #efefef;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            text-decoration: none;
            font-family: 'Noto Sans KR', sans-serif;
            transition: border-color 0.15s, background 0.15s;
        }

        .qm-item:hover {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .qm-item svg { width: 28px; height: 28px; color: var(--accent); }
        .qm-item img { width: 28px; height: 28px; border-radius: 7px; }

        /* ── 로그인 모달 ── */
        .login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 700;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
        }

        .login-overlay.open { display: flex; }

        .login-modal {
            background: #fff;
            border-radius: 24px;
            padding: 40px 32px 32px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from { transform: scale(0.92); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }

        .login-modal-title {
            font-size: 42px;
            font-weight: 900;
            color: #1a1a1a;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
        }

        .login-modal-subtitle {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .login-modal-desc {
            font-size: 14px;
            color: #888;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .login-google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: #f5f5f5;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            color: #333;
            font-family: 'Noto Sans KR', sans-serif;
            transition: background 0.15s;
            margin-bottom: 10px;
        }

        .login-google-btn:hover { background: #ebebeb; }

        .login-back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: #f5f5f5;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            color: #333;
            font-family: 'Noto Sans KR', sans-serif;
            transition: background 0.15s;
        }

        .login-back-btn:hover { background: #ebebeb; }

        /* ── 로딩 ── */
        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            background: #fff;
            z-index: 10;
        }

        .loading-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            animation: breathe 1.8s ease-in-out infinite;
        }

        .loading-text {
            font-size: 13px;
            color: #aaa;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50%       { transform: scale(1.06); }
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <span class="logo-text">BEADYO</span>
            <div class="header-links">
                <a class="header-link desktop-only" href="https://www.youtube.com/@beadyo" target="_blank"><img src="https://www.youtube.com/yts/img/favicon_144-vfliLAfaB.png" width="13" height="13" style="border-radius:3px"> 구튜브</a>
                <a class="header-link desktop-only" href="https://www.sooplive.co.kr/station/beadyo97" target="_blank"><img src="https://www.sooplive.com/favicon.ico" width="13" height="13" style="border-radius:3px"> 구슬요</a>
                <a class="header-link desktop-only" href="https://cafe.naver.com/beadyo" target="_blank"><img src="https://cafe.naver.com/favicon.ico" width="13" height="13" style="border-radius:3px"> 떼굴떼굴카페</a>
                <a class="live-badge" id="live-badge" href="https://www.sooplive.co.kr/station/beadyo97" target="_blank"><span class="live-dot"></span>LIVE</a>
                <span id="auth-badge">✏️ 편집 모드 <button id="signout-btn" onclick="signOut()">로그아웃</button></span>
                <button class="header-link desktop-only login-btn" onclick="openLoginModal()">로그인</button>
                <button class="quick-menu-btn mobile-only" id="quick-menu-toggle" onclick="toggleQuickMenu()">☰</button>
            </div>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab(0)">
                <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
                SCHEDULE
            </div>
            <div class="tab" onclick="switchTab(1)">
                <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
                LIVE SONG LIST
            </div>
            <div class="tab" onclick="switchTab(2)">
                <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
                SONGBOOK
            </div>
        </div>
    </div>

    <div class="login-overlay" id="login-overlay" onclick="handleLoginOverlayClick(event)">
        <div class="login-modal">
            <div class="login-modal-title">BEADYO</div>
            <div class="login-modal-subtitle">로그인</div>
            <button class="login-google-btn" onclick="signIn()">
                <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Google 계정으로 로그인
            </button>
            <button class="login-back-btn" onclick="closeLoginModal()">홈으로 돌아가기</button>
        </div>
    </div>

    <div class="quick-menu-overlay" id="quick-menu-overlay" onclick="closeQuickMenu()"></div>
    <div class="quick-menu-panel" id="quick-menu-panel">
        <div class="qm-handle"></div>
        <div class="qm-header">
            <span class="qm-title">QUICK MENU</span>
            <div class="qm-header-btns">
                <button class="qm-header-btn" onclick="viewDesktop()">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                    PC버전
                </button>
                <button class="qm-header-btn login-btn" onclick="openLoginModal(); closeQuickMenu()">
                    <img src="login-icon.png" width="13" height="13" style="border-radius:50%"> 로그인
                </button>
            </div>
        </div>

        <div class="qm-section">
            <div class="qm-section-label">탭 이동</div>
            <div class="qm-section-card">
                <div class="qm-grid">
                    <button class="qm-item" onclick="switchTab(0); closeQuickMenu()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        SCHEDULE
                    </button>
                    <button class="qm-item" onclick="switchTab(1); closeQuickMenu()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                        SONG LIST
                    </button>
                    <button class="qm-item" onclick="switchTab(2); closeQuickMenu()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                        SONGBOOK
                    </button>
                </div>
            </div>
        </div>

        <div class="qm-section">
            <div class="qm-section-label">바로가기</div>
            <div class="qm-section-card">
                <div class="qm-grid-3">
                    <a class="qm-item" href="https://www.youtube.com/@beadyo" target="_blank" onclick="closeQuickMenu()">
                        <img src="https://www.youtube.com/yts/img/favicon_144-vfliLAfaB.png">
                        구튜브
                    </a>
                    <a class="qm-item" href="https://www.sooplive.co.kr/station/beadyo97" target="_blank" onclick="closeQuickMenu()">
                        <img src="https://www.sooplive.com/favicon.ico">
                        구슬요
                    </a>
                    <a class="qm-item" href="https://cafe.naver.com/beadyo" target="_blank" onclick="closeQuickMenu()">
                        <img src="https://cafe.naver.com/favicon.ico">
                        떼굴떼굴카페
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="loading" id="loading">
            <img class="loading-img" src="loading-img.png" alt="">
            <span class="loading-text loading-dots">대기 중</span>
        </div>

        <iframe class="sheet-frame active" id="frame-0" onload="hideLoading()"></iframe>
        <iframe class="sheet-frame" id="frame-1"></iframe>
        <iframe class="sheet-frame" id="frame-2"></iframe>
    </div>

    <script>
        // ── Google OAuth Client ID ──
        // Google Cloud Console > API 및 서비스 > 사용자 인증 정보에서 발급
        // 발급 후 아래 값을 교체하세요
        const CLIENT_ID = '948358808520-02q5ea2leevvs5ck4ncjg5283nrob2o1.apps.googleusercontent.com';

        const SHEETS = [
            { id: '1vXzzx7UibAcUwM26Lp2InUnhNkITLd7-JkqB4g_FudM', gid: '2063088341', alwaysEdit: true },
            { id: '1bIhxhHDU_Ig5IuDrS4WvPtMVsiVWHnDvm6dU3E3Q8Mo', gid: '1545541300', alwaysEdit: true },
            { id: '1pJ61PqiKLJvqgKZXH_B1sLZrPwTI157t9sJ5tCAu_Jw', gid: '1451717792', alwaysEdit: true }
        ];

        const readOnlyUrl = s =>
            `https://docs.google.com/spreadsheets/d/${s.id}/htmlview?gid=${s.gid}&embedded=true`;
        const editUrl = s =>
            `https://docs.google.com/spreadsheets/d/${s.id}/edit?rm=minimal#gid=${s.gid}`;

        const loaded = new Set();
        let tokenClient = null;
        let accessToken = null;

        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        function getFrameUrl(index) {
            const sheet = SHEETS[index];
            return (sheet.alwaysEdit) ? editUrl(sheet) : readOnlyUrl(sheet);
        }

        function getSheetDirectUrl(index) {
            const sheet = SHEETS[index];
            return `https://docs.google.com/spreadsheets/d/${sheet.id}/edit#gid=${sheet.gid}`;
        }

        function hideLoading(index) {
            const el = document.getElementById('loading');
            if (el) el.style.display = 'none';
            const frame = document.getElementById(`frame-${index}`);
            if (frame) requestAnimationFrame(() => frame.classList.add('loaded'));
        }

        function updateMobileFab(index) {
            const fab = document.getElementById('mobile-fab');
            if (!isMobile) return;
            fab.classList.add('show');
            fab.href = getSheetDirectUrl(index);
        }

        function switchTab(index) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === index));
            document.querySelectorAll('.sheet-frame').forEach((f, i) => f.classList.toggle('active', i === index));

            updateMobileFab(index);

            if (!loaded.has(index)) {
                const frame = document.getElementById(`frame-${index}`);
                document.getElementById('loading').style.display = 'flex';
                frame.onload = () => hideLoading(index);
                frame.src = getFrameUrl(index);
                loaded.add(index);
            } else {
                hideLoading(index);
            }
        }

        // 첫 탭 초기 로드
        switchTab(0);

        // ── 라이브 상태 체크 ──
        async function checkLiveStatus() {
            try {
                const res = await fetch('live.json?t=' + Date.now());
                const data = await res.json();
                const badge = document.getElementById('live-badge');
                badge.classList.toggle('is-live', !!data.live);
            } catch (e) {}
        }

        checkLiveStatus();
        setInterval(checkLiveStatus, 5 * 60 * 1000);

        // ── 로그인 모달 ──
        function openLoginModal() {
            document.getElementById('login-overlay').classList.add('open');
        }

        function closeLoginModal() {
            document.getElementById('login-overlay').classList.remove('open');
        }

        function handleLoginOverlayClick(e) {
            if (e.target === document.getElementById('login-overlay')) closeLoginModal();
        }

        // ── 퀵메뉴 ──
        function toggleQuickMenu() {
            const panel = document.getElementById('quick-menu-panel');
            const overlay = document.getElementById('quick-menu-overlay');
            const headerH = document.querySelector('.header').offsetHeight;
            panel.style.top = headerH + 'px';
            panel.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        function closeQuickMenu() {
            document.getElementById('quick-menu-panel').classList.remove('open');
            document.getElementById('quick-menu-overlay').classList.remove('open');
        }

        function viewDesktop() {
            document.querySelector('meta[name=viewport]').content = 'width=1200';
            localStorage.setItem('desktopView', '1');
            closeQuickMenu();
        }

        if (localStorage.getItem('desktopView') === '1') {
            document.querySelector('meta[name=viewport]').content = 'width=1200';
        }

        // ── 구글 로그인 ──
        function signIn() {
            if (!tokenClient) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/drive.metadata.readonly',
                    callback: handleToken,
                });
            }
            tokenClient.requestAccessToken({ prompt: '' });
        }

        async function handleToken(resp) {
            if (resp.error) return;
            accessToken = resp.access_token;
            await applyEditMode();
        }

        async function checkCanEdit(sheetId) {
            try {
                const res = await fetch(
                    `https://www.googleapis.com/drive/v3/files/${sheetId}?fields=capabilities(canEdit)`,
                    { headers: { Authorization: `Bearer ${accessToken}` } }
                );
                const data = await res.json();
                return data.capabilities?.canEdit === true;
            } catch {
                return false;
            }
        }

        async function applyEditMode() {
            const results = await Promise.all(SHEETS.map(s => checkCanEdit(s.id)));
            const hasAnyEdit = results.some(Boolean);

            SHEETS.forEach((sheet, i) => {
                const frame = document.getElementById(`frame-${i}`);
                const url = (results[i] || sheet.alwaysEdit) ? editUrl(sheet) : readOnlyUrl(sheet);
                if (frame.src !== url) {
                    loaded.delete(i);
                    frame.src = url;
                }
            });

            if (hasAnyEdit) {
                document.querySelectorAll('.login-btn').forEach(b => b.style.display = 'none');
                document.getElementById('auth-badge').classList.add('show');
                closeQuickMenu();
                closeLoginModal();
            } else {
                // 로그인했지만 편집 권한 없음 → 그냥 조용히 무시
                accessToken = null;
            }
        }

        function signOut() {
            if (accessToken) {
                google.accounts.oauth2.revoke(accessToken, () => {});
                accessToken = null;
            }
            SHEETS.forEach((sheet, i) => {
                const frame = document.getElementById(`frame-${i}`);
                loaded.delete(i);
                frame.src = sheet.alwaysEdit ? editUrl(sheet) : readOnlyUrl(sheet);
            });
            document.getElementById('auth-badge').classList.remove('show');
            document.querySelectorAll('.login-btn').forEach(b => b.style.display = '');
        }
    </script>

    <a class="mobile-fab" id="mobile-fab" href="#" target="_blank">✏️ 검색·편집하기</a>
</body>
</html>
