<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구슬요모아보기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #ff7043;
            --accent-light: #fff3f0;
            --header-bg: #1a1a2e;
            --header-text: #ffffff;
            --tab-active: #ff7043;
            --tab-hover: rgba(255,255,255,0.08);
            --bg: #f7f7f9;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── 헤더 ── */
        .header {
            background: var(--header-bg);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            overflow: hidden;
        }

        .logo-text {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .logo-sub {
            font-size: 11px;
            color: rgba(255,255,255,0.45);
            font-weight: 400;
            margin-left: 4px;
        }

        .header-links {
            display: flex;
            gap: 6px;
        }

        .header-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.3);
            background: transparent;
            -webkit-appearance: none;
            transition: all 0.15s;
            cursor: pointer;
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            white-space: nowrap;
        }

        .header-link:hover {
            color: #fff;
            border-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.1);
        }

        .header-link.edit-active {
            color: #fff;
            border-color: var(--accent);
            background: rgba(255,112,67,0.15);
        }

        #auth-badge {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            background: rgba(255,112,67,0.15);
            border: 1px solid rgba(255,112,67,0.4);
            color: var(--accent);
            white-space: nowrap;
            line-height: 1.3;
        }

        #auth-badge.show { display: flex; }

        #signout-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.35);
            font-size: 10px;
            cursor: pointer;
            padding: 0;
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
        }

        #signout-btn:hover { color: rgba(255,255,255,0.7); }

        /* ── 탭 ── */
        .tabs {
            display: flex;
            padding: 0 16px;
            gap: 2px;
            overflow-x: auto;
        }

        .tabs::-webkit-scrollbar { display: none; }

        .tab {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
            white-space: nowrap;
            user-select: none;
            border-radius: 6px 6px 0 0;
        }

        .tab:hover {
            color: rgba(255,255,255,0.85);
            background: var(--tab-hover);
        }

        .tab.active {
            color: #fff;
            border-bottom-color: var(--accent);
            background: rgba(255,112,67,0.1);
        }

        .tab-icon { font-size: 15px; }

        /* ── 콘텐츠 ── */
        .content {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #fff;
        }

        .sheet-frame {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .sheet-frame.active { display: block; }

        /* ── 모바일 반응형 ── */
        @media (max-width: 640px) {
            .header-top {
                padding: 8px 12px;
            }

            .logo-icon {
                width: 28px;
                height: 28px;
                border-radius: 6px;
                overflow: hidden;
            }

            .logo-icon img {
                width: 28px !important;
                height: 28px !important;
            }

            .logo-text {
                font-size: 13px;
                white-space: nowrap;
            }

            .logo-sub { display: none; }

            .header-links { gap: 4px; }

            .header-link {
                padding: 5px 9px;
                font-size: 11px;
                gap: 4px;
            }

            .header-link img {
                width: 12px !important;
                height: 12px !important;
            }

            .login-label { display: none; }

            #auth-badge {
                font-size: 10px;
                padding: 4px 8px;
            }

            .tabs { padding: 0 8px; }

            .tab {
                padding: 10px 10px;
                font-size: 12px;
                gap: 5px;
            }
        }

        /* ── 모바일 플로팅 버튼 ── */
        .mobile-fab {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            align-items: center;
            gap: 7px;
            padding: 11px 18px;
            background: var(--accent);
            color: #fff;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(255,112,67,0.45);
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            transition: opacity 0.15s;
        }

        .mobile-fab.show { display: flex; }
        .mobile-fab:hover { opacity: 0.85; }

        /* ── 로딩 ── */
        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            background: #fff;
            z-index: 10;
        }

        .loading-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            animation: breathe 1.8s ease-in-out infinite;
        }

        .loading-text {
            font-size: 13px;
            color: #aaa;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50%       { transform: scale(1.06); }
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="logo">
                <div class="logo-icon"><img src="logo-icon.webp" width="32" height="32" style="border-radius:8px;display:block;object-fit:cover"></div>
                <span class="logo-text">구슬요모아보기<span class="logo-sub">BEADYO</span></span>
            </div>
            <div class="header-links">
                <a class="header-link" href="https://www.youtube.com/@beadyo" target="_blank"><img src="https://www.youtube.com/yts/img/favicon_144-vfliLAfaB.png" width="14" height="14" style="border-radius:3px;margin-top:2px"> 유튜브</a>
                <a class="header-link" href="https://chzzk.naver.com" target="_blank"><img src="https://www.sooplive.com/favicon.ico" width="14" height="14" style="border-radius:3px;margin-top:2px"> 방송국</a>
                <span id="auth-badge">✏️ 편집 모드 <button id="signout-btn" onclick="signOut()">로그아웃</button></span>
                <button class="header-link" id="login-btn" onclick="signIn()"><img src="login-icon.png" width="18" height="18" style="border-radius:50%;margin-top:2px"> <span class="login-label">편집자 로그인</span></button>
            </div>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab(0)">
                <span class="tab-icon">📅</span> SCHEDULE
            </div>
            <div class="tab" onclick="switchTab(1)">
                <span class="tab-icon">🎵</span> LIVE SONG LIST
            </div>
            <div class="tab" onclick="switchTab(2)">
                <span class="tab-icon">📖</span> 노래책
            </div>
        </div>
    </div>

    <div class="content">
        <div class="loading" id="loading">
            <img class="loading-img" src="loading-img.png" alt="">
            <span class="loading-text loading-dots">대기 중</span>
        </div>

        <iframe class="sheet-frame active" id="frame-0" onload="hideLoading()"></iframe>
        <iframe class="sheet-frame" id="frame-1"></iframe>
        <iframe class="sheet-frame" id="frame-2"></iframe>
    </div>

    <script>
        // ── Google OAuth Client ID ──
        // Google Cloud Console > API 및 서비스 > 사용자 인증 정보에서 발급
        // 발급 후 아래 값을 교체하세요
        const CLIENT_ID = '948358808520-02q5ea2leevvs5ck4ncjg5283nrob2o1.apps.googleusercontent.com';

        const SHEETS = [
            { id: '1vXzzx7UibAcUwM26Lp2InUnhNkITLd7-JkqB4g_FudM', gid: '2063088341', alwaysEdit: false },
            { id: '1bIhxhHDU_Ig5IuDrS4WvPtMVsiVWHnDvm6dU3E3Q8Mo', gid: '1545541300', alwaysEdit: true },
            { id: '1pJ61PqiKLJvqgKZXH_B1sLZrPwTI157t9sJ5tCAu_Jw', gid: '1451717792', alwaysEdit: true }
        ];

        const readOnlyUrl = s =>
            `https://docs.google.com/spreadsheets/d/${s.id}/htmlview?gid=${s.gid}&embedded=true`;
        const editUrl = s =>
            `https://docs.google.com/spreadsheets/d/${s.id}/edit?rm=minimal#gid=${s.gid}`;

        const loaded = new Set();
        let tokenClient = null;
        let accessToken = null;

        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        function getFrameUrl(index) {
            const sheet = SHEETS[index];
            return (sheet.alwaysEdit) ? editUrl(sheet) : readOnlyUrl(sheet);
        }

        function getSheetDirectUrl(index) {
            const sheet = SHEETS[index];
            return `https://docs.google.com/spreadsheets/d/${sheet.id}/edit#gid=${sheet.gid}`;
        }

        function hideLoading() {
            const el = document.getElementById('loading');
            if (el) el.style.display = 'none';
        }

        function updateMobileFab(index) {
            const fab = document.getElementById('mobile-fab');
            if (!isMobile) return;
            fab.classList.add('show');
            fab.href = getSheetDirectUrl(index);
        }

        function switchTab(index) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === index));
            document.querySelectorAll('.sheet-frame').forEach((f, i) => f.classList.toggle('active', i === index));

            updateMobileFab(index);

            if (!loaded.has(index)) {
                const frame = document.getElementById(`frame-${index}`);
                document.getElementById('loading').style.display = 'flex';
                frame.onload = hideLoading;
                frame.src = isMobile ? readOnlyUrl(SHEETS[index]) : getFrameUrl(index);
                loaded.add(index);
            }
        }

        // 첫 탭 초기 로드
        switchTab(0);

        // ── 구글 로그인 ──
        function signIn() {
            if (!tokenClient) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/drive.metadata.readonly',
                    callback: handleToken,
                });
            }
            tokenClient.requestAccessToken({ prompt: '' });
        }

        async function handleToken(resp) {
            if (resp.error) return;
            accessToken = resp.access_token;
            await applyEditMode();
        }

        async function checkCanEdit(sheetId) {
            try {
                const res = await fetch(
                    `https://www.googleapis.com/drive/v3/files/${sheetId}?fields=capabilities(canEdit)`,
                    { headers: { Authorization: `Bearer ${accessToken}` } }
                );
                const data = await res.json();
                return data.capabilities?.canEdit === true;
            } catch {
                return false;
            }
        }

        async function applyEditMode() {
            const results = await Promise.all(SHEETS.map(s => checkCanEdit(s.id)));
            const hasAnyEdit = results.some(Boolean);

            SHEETS.forEach((sheet, i) => {
                const frame = document.getElementById(`frame-${i}`);
                const url = (results[i] || sheet.alwaysEdit) ? editUrl(sheet) : readOnlyUrl(sheet);
                if (frame.src !== url) {
                    loaded.delete(i);
                    frame.src = url;
                }
            });

            if (hasAnyEdit) {
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('auth-badge').classList.add('show');
            } else {
                // 로그인했지만 편집 권한 없음 → 그냥 조용히 무시
                accessToken = null;
            }
        }

        function signOut() {
            if (accessToken) {
                google.accounts.oauth2.revoke(accessToken, () => {});
                accessToken = null;
            }
            SHEETS.forEach((sheet, i) => {
                const frame = document.getElementById(`frame-${i}`);
                loaded.delete(i);
                frame.src = sheet.alwaysEdit ? editUrl(sheet) : readOnlyUrl(sheet);
            });
            document.getElementById('auth-badge').classList.remove('show');
            document.getElementById('login-btn').style.display = '';
        }
    </script>

    <a class="mobile-fab" id="mobile-fab" href="#" target="_blank">✏️ 검색·편집하기</a>
</body>
</html>
