    <script>
        (() => {
            const key = 'beadyo:theme';
            const allowedOrigin = origin => ['https://beadyo.com', 'http://localhost:3000', 'http://127.0.0.1:3000'].includes(origin) ||
                origin === window.location.origin;
            const normalize = value => value === 'dark' ? 'dark' : 'light';
            function applyTheme(theme, persist = false) {
                const next = normalize(theme);
                document.documentElement.dataset.theme = next;
                document.documentElement.style.colorScheme = next === 'dark' ? 'dark' : 'light';
                if (persist) {
                    try { localStorage.setItem(key, next); } catch {}
                }
            }
            let stored = 'light';
            try { stored = localStorage.getItem(key) === 'dark' ? 'dark' : 'light'; } catch {}
            applyTheme(stored);
            window.addEventListener('message', event => {
                if (!allowedOrigin(event.origin)) return;
                if (event.data?.type === 'beadyo-theme-sync') applyTheme(event.data.theme, true);
            });
            window.addEventListener('storage', event => {
                if (event.key === key) applyTheme(event.newValue);
            });
        })();
    </script>
    <style>

<body>

    <div class="video-modal" id="videoModal" hidden>

                <iframe id="videoModalFrame" title="춤영상 재생" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"></iframe>
            </div>
            <div class="video-modal-foot">

            </div>
        </section>
    </div>

    <script src="dance-approved-data.js?v=status-20260630"></script>
    <script>
        const sourceLabels = {
            soop: 'SOOP 클립',
            clip: 'VOD 클립',
            catch: '캐치',
            youtube: 'Shorts',
        };

        const sourceColors = {
            soop: 'var(--soop)',
            clip: 'var(--clip)',
            catch: 'var(--catch)',
            youtube: 'var(--youtube)',
        };

        const SUPABASE_URL = 'https://qlmcwobfldgmhwhptkfz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_jMhCscf87Dtt38Wk_ASKrw_dRtQExSR';
        const DANCE_STATUS_TABLE = 'dance_video_statuses';
        const DANCE_STATUS_COLUMNS = 'video_id,status,title,source,song,url,thumbnail';
        const PLACEHOLDER_THUMBNAILS = new Set(['', 'banner.png', 'banner.jpg', 'loading-img.png', 'songbook-char.png']);

        function getYouTubeId(urlValue) {
            try {
                const url = new URL(urlValue);
                if (url.hostname.includes('youtube.com') || url.hostname.includes('youtu.be')) {
                    return url.pathname.includes('/shorts/')
                        ? url.pathname.split('/shorts/')[1]?.split('/')[0]
                        : url.searchParams.get('v') || url.pathname.split('/').filter(Boolean).pop();
                }
            } catch {
                return '';
            }
            return '';
        }

        function resolveThumbnail(video) {
            const current = video.thumbnail || '';

            const backfilled = window.danceThumbnailBackfill?.[video.id];
            if (backfilled) return backfilled;

            const mapped = window.danceThumbnailMap?.[video.url];
            if (mapped) return mapped;

            if (!PLACEHOLDER_THUMBNAILS.has(current)) return current;

            const youtubeId = getYouTubeId(video.url);
            if (youtubeId) return `https://img.youtube.com/vi/${encodeURIComponent(youtubeId)}/hqdefault.jpg`;

            return 'banner.jpg';
        }

        function shouldExcludeVideo(video) {
            return String(video.title || '').includes('반응');
        }

        function normalizeVideo(video) {
            const normalized = {
                status: 'review',
                tags: [],
                thumbnail: 'banner.jpg',
                ...video,
            };
            normalized.thumbnail = resolveThumbnail(normalized);
            return normalized;
        }

        function loadVideos() {
            return (window.danceVideos || []).map(normalizeVideo).filter(video => !shouldExcludeVideo(video));
        }

        const videos = loadVideos();

        let activeSource = 'all';

        let approvedVideos = videos.filter(video => video.status === 'approved');
        const grid = document.getElementById('videoGrid');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const resultMeta = document.getElementById('resultMeta');

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
            }[ch]));
        }

        function safeExternalUrl(value) {
            try {
                const url = new URL(String(value || '').trim());
                if (url.protocol === 'http:' || url.protocol === 'https:') return url.toString();
            } catch {}
            return '#';
        }

        function normalizeSharedStatus(value, fallback = 'review') {
            return ['review', 'approved', 'hidden'].includes(value) ? value : fallback;
        }

        function sharedRowToVideo(row, existing = {}) {
            return normalizeVideo({
                ...existing,
                id: row?.video_id || existing.id,
                status: normalizeSharedStatus(row?.status, existing.status || 'review'),
                title: row?.title || existing.title || '',
                source: row?.source || existing.source || 'soop',
                song: row?.song || existing.song || '',
                url: row?.url || existing.url || '',
                thumbnail: row?.thumbnail || existing.thumbnail || 'banner.jpg',
                tags: existing.tags || [],
            });
        }

        async function refreshApprovedVideosFromSharedStatus() {
            try {
                const url = `${SUPABASE_URL}/rest/v1/${DANCE_STATUS_TABLE}?select=${DANCE_STATUS_COLUMNS}`;
                const res = await fetch(url, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    },
                });
                if (!res.ok) return;
                const rows = await res.json();
                const byId = new Map(videos.map(video => [video.id, video]));
                (Array.isArray(rows) ? rows : []).forEach(row => {
                    if (!row?.video_id) return;
                    const existing = byId.get(row.video_id);
                    if (!existing && !row.url) return;
                    byId.set(row.video_id, sharedRowToVideo(row, existing));
                });
                approvedVideos = Array.from(byId.values())
                    .filter(video => video.status === 'approved' && !shouldExcludeVideo(video));
                renderGrid();
            } catch {}
        }

        function getVideoEmbedUrl(video) {
            try {
                const url = new URL(safeExternalUrl(video.url));
                const host = url.hostname.toLowerCase();
                if (host === 'youtube.com' || host.endsWith('.youtube.com') || host === 'youtu.be') {
                    const id = url.pathname.includes('/shorts/')
                        ? url.pathname.split('/shorts/')[1]?.split('/')[0]
                        : url.searchParams.get('v') || url.pathname.split('/').filter(Boolean).pop();
                    return /^[A-Za-z0-9_-]{11}$/.test(id || '') ? `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0` : 'about:blank';
                }
                if (host === 'sooplive.com' || host.endsWith('.sooplive.com')) {
                    const id = url.pathname.match(/\/player\/(\d+)/)?.[1];
                    return id ? `https://vod.sooplive.com/player/${encodeURIComponent(id)}/embed?autoPlay=true&showChat=false&mutePlay=false` : 'about:blank';
                }
                return 'about:blank';
            } catch {
                return 'about:blank';
            }
        }

        function resetVideoFrame() {
            document.getElementById('videoModalFrame').removeAttribute('style');
        }

        function openVideoModal(video) {
            const modal = document.getElementById('videoModal');
            const frame = document.getElementById('videoModalFrame');
            document.getElementById('videoModalTitle').textContent = video.title;
            modal.classList.remove('soop-crop');
            resetVideoFrame();
            frame.src = getVideoEmbedUrl(video);
            document.getElementById('videoModalOriginal').href = safeExternalUrl(video.url);
            modal.hidden = false;
        }

        function closeVideoModal() {
            const modal = document.getElementById('videoModal');
            document.getElementById('videoModalFrame').src = '';
            resetVideoFrame();
            modal.classList.remove('soop-crop');
            modal.hidden = true;
        }

        function filteredVideos() {
            const query = searchInput.value.trim().toLowerCase();
            return approvedVideos.filter(video => {
                if (activeSource !== 'all' && video.source !== activeSource) return false;
                if (!query) return true;
                const haystack = [video.title, video.song, sourceLabels[video.source], ...video.tags].join(' ').toLowerCase();
                return haystack.includes(query);
            });
        }

        function renderGrid() {
            const items = filteredVideos();
            resultMeta.textContent = `${items.length}개 표시 중`;
            emptyState.style.display = items.length ? 'none' : 'flex';
            grid.innerHTML = items.map(video => `
                <article class="video-card" data-id="${esc(video.id)}">
                    <div class="thumb">
                        <img src="${esc(video.thumbnail)}" alt="" width="320" height="180" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='banner.jpg';">
                        <span class="source-badge" style="color:${sourceColors[video.source]}">${esc(sourceLabels[video.source])}</span>
                        <span class="play-mark"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${esc(video.title)}</div>
                        <div class="card-line"><span>${esc(video.date)}</span><span>${esc(video.song)}</span></div>
                        <div class="tags">${video.tags.map(tag => `<span class="tag">${esc(tag)}</span>`).join('')}</div>
                        <div class="card-actions">
                            <a class="card-action primary" href="${esc(safeExternalUrl(video.url))}" target="_blank" rel="noopener noreferrer">원본 열기</a>
                            <button class="card-action" type="button" data-url="${esc(video.url)}">링크 복사</button>
                        </div>
                    </div>
                </article>
            `).join('');
            grid.querySelectorAll('.video-card').forEach(card => {
                card.addEventListener('click', () => {
                    const video = approvedVideos.find(item => item.id === card.dataset.id);
                    if (video) openVideoModal(video);
                });
            });
            grid.querySelectorAll('button[data-url]').forEach(button => {
                button.addEventListener('click', async event => {
                    event.stopPropagation();
                    try {
                        await navigator.clipboard.writeText(button.dataset.url);
                        button.textContent = '복사 완료';
                        setTimeout(() => { button.textContent = '링크 복사'; }, 1100);
                    } catch {
                        button.textContent = '복사 실패';
                        setTimeout(() => { button.textContent = '링크 복사'; }, 1100);
                    }
                });
            });
            grid.querySelectorAll('.card-action.primary').forEach(link => {
                link.addEventListener('click', event => event.stopPropagation());
            });
        }

        document.querySelectorAll('.source-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                activeSource = tab.dataset.source;
                document.querySelectorAll('.source-tab').forEach(btn => btn.classList.toggle('active', btn === tab));
                renderGrid();
            });
        });

        searchInput.addEventListener('input', renderGrid);
        document.querySelectorAll('[data-close-video]').forEach(element => {
            element.addEventListener('click', closeVideoModal);
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !document.getElementById('videoModal').hidden) {
                closeVideoModal();
            }
        });
        renderGrid();
        refreshApprovedVideosFromSharedStatus();
    </script>
</body>
</html>
