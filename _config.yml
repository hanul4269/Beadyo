# GitHub Pages(Jekyll) 빌드 설정
# 사이트 동작에 필요 없는 내부 파일(DB 권한 SQL, 작업 문서, 스크립트)을
# beadyo.com 주소로 공개하지 않도록 배포 대상에서 제외합니다.
# 저장소(GitHub) 자체에는 그대로 남습니다.
exclude:
  - "*.sql"
  - "*.py"
  - "*.sh"
  - AGENTS.md
  - EXPLORE.md
  - HOME.md
  - songbook_cover_backfill_guide.md
  # 게임 기록 작업용 원자료(페이지에서 쓰지 않음, 3MB+)
  - data/game-log-sources.json
  - data/game-log-reaudit.json
  # 춤영상 검토 페이지는 사이트에서 내림(2026-11-25). 파일과 DB 자료는 보관.
  # 다시 쓰려면 docs/dance-review-archive.md 참고
  - dance-archive.html
  - dance-data.js
  - dance-import-feed.js
  - dance-thumbnail-backfill.js
  - docs/
  - scripts/
  - tools/
  - supabase/
  - output/
  - tmp/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
