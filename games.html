            if (!bowl) return;
            const names = visibleGachaNames();
            $('gacha-count').textContent = `후보 ${gacha.count}명`;
            const statusCount = $('gacha-status-count');
            if (statusCount) statusCount.textContent = String(gacha.count);
            const capsuleColors = [
                'rgba(91,143,199,.72)',
                'rgba(127,184,63,.72)',
                'rgba(198,156,58,.72)',
                'rgba(205,112,142,.72)',
                'rgba(130,105,206,.72)',
                'rgba(73,177,154,.72)',
                'rgba(221,128,70,.72)',
                'rgba(190,93,183,.72)'
            ];
            const layout = makeGachaCapsuleLayout(names.length);
            bowl.innerHTML = names.map((name, i) => {
                const spot = layout[i];
                const direction = spot.direction;
                const mixX1 = direction * randomBetween(74, 154);
                const mixY1 = -randomBetween(54, 132);
                const mixX2 = direction * -randomBetween(88, 176);
                const mixY2 = randomBetween(46, 116);
                const mixX3 = direction * randomBetween(96, 190);
                const mixY3 = randomBetween(-82, 82);
                const mixRotate = randomBetween(220, 430);
                const delay = randomBetween(0, .22);
                const color = capsuleColors[i % capsuleColors.length];
                return `<div class="gacha-ball" title="${escapeHtml(name)}" style="left:${spot.left.toFixed(1)}%;top:${spot.top.toFixed(1)}%;--cap:${color};--rest-rotate:${spot.rotate.toFixed(1)}deg;--mix-x1:${mixX1.toFixed(1)}px;--mix-y1:${mixY1.toFixed(1)}px;--mix-x2:${mixX2.toFixed(1)}px;--mix-y2:${mixY2.toFixed(1)}px;--mix-x3:${mixX3.toFixed(1)}px;--mix-y3:${mixY3.toFixed(1)}px;--mix-rotate:${mixRotate.toFixed(1)}deg;--shake-delay:${delay.toFixed(2)}s">
                    <img src="${ASSETS[i % ASSETS.length]}" alt="">
                </div>`;
            }).join('');
        }

        function makeGachaBounceMotion(ball, bowl, index, total) {
            const leftMin = 8;
            const leftMax = 78;
            const topMin = 14;
            const topMax = 70;
            const bowlRect = bowl.getBoundingClientRect();
            const startLeft = Number.parseFloat(ball.style.left) || randomBetween(12, 76);
            const startTop = Number.parseFloat(ball.style.top) || randomBetween(52, 70);
            let left = startLeft;
            let top = startTop;
            let rotate = Number.parseFloat(ball.style.getPropertyValue('--rest-rotate')) || 0;
            let vx = (Math.random() < .5 ? -1 : 1) * randomBetween(22, 42);
            let vy = -randomBetween(28, 48);
            const frames = [];
            const steps = 38;
            const gravity = randomBetween(9, 13);

            for (let step = 0; step < steps; step++) {
                if (step > 0) {
                    left += vx * .16;
                    top += vy * .16;
                    vy += gravity * .16;
                    rotate += vx * .8 + vy * .28;

                    if (left < leftMin || left > leftMax) {
                        left = Math.max(leftMin, Math.min(leftMax, left));
                        vx *= -randomBetween(.68, .84);
                        rotate += vx * 1.6;
                    }
                    if (top < topMin) {
                        top = topMin;
                        vy = Math.abs(vy) * randomBetween(.62, .78);
                    }
                    if (top > topMax) {
                        top = topMax;
                        vy = -Math.abs(vy) * randomBetween(.48, .66);
                        vx *= randomBetween(.82, .94);
                    }
                }

                const offset = (step / (steps - 1)) * .78;
                const x = (left - startLeft) * bowlRect.width / 100;
                const y = (top - startTop) * bowlRect.height / 100;
                frames.push({
                    transform: `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) rotate(${rotate.toFixed(1)}deg)`,
                    offset,
                    easing: 'linear'
                });
            }

            let finalLeft;
            let finalTop;
            const settleStyle = Math.random();
            if (settleStyle < .48) {
                const spreadSlots = [randomBetween(leftMin, 28), randomBetween(30, 56), randomBetween(58, leftMax)];
                finalLeft = spreadSlots[index % spreadSlots.length] + randomBetween(-6, 6);
            } else if (settleStyle < .78) {
                finalLeft = Math.random() < .5 ? randomBetween(leftMin, 24) : randomBetween(62, leftMax);
            } else {
                finalLeft = randomBetween(18, 68);
            }
            if (total <= 4 && settleStyle < .58) {
                finalLeft = randomBetween(leftMin, leftMax);
            }
            const pileLiftChance = Math.random();
            const pileLift = pileLiftChance < .78
                ? randomBetween(0, 5)
                : randomBetween(5, total > 9 ? 11 : 8);
            finalTop = randomBetween(66, topMax) - pileLift;
            finalLeft = Math.max(leftMin, Math.min(leftMax, finalLeft + randomBetween(-4, 4)));
            finalTop = Math.max(58, Math.min(topMax, finalTop + randomBetween(-2.5, 2.5)));
            const finalRotate = rotate + randomBetween(-28, 28);
            const settleStartLeft = left;
            const settleStartTop = top;
            const settleStartRotate = rotate;
            const settlePoints = [
                { offset: .84, ease: 'linear', mix: .38, lift: -3 },
                { offset: .9, ease: 'linear', mix: .66, lift: 1.5 },
                { offset: .96, ease: 'linear', mix: .9, lift: -1 },
                { offset: 1, ease: 'linear', mix: 1, lift: 0 }
            ];
            settlePoints.forEach(point => {
                const settledLeft = settleStartLeft + (finalLeft - settleStartLeft) * point.mix;
                const settledTop = settleStartTop + (finalTop - settleStartTop) * point.mix + point.lift;
                const settledRotate = settleStartRotate + (finalRotate - settleStartRotate) * point.mix;
                const x = (settledLeft - startLeft) * bowlRect.width / 100;
                const y = (settledTop - startTop) * bowlRect.height / 100;
                frames.push({
                    transform: `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) rotate(${settledRotate.toFixed(1)}deg)`,
                    offset: point.offset,
                    easing: point.ease
                });
            });
            return {
                frames,
                finalLeft: `${finalLeft.toFixed(1)}%`,
                finalTop: `${finalTop.toFixed(1)}%`,
                finalRotate: `${finalRotate.toFixed(1)}deg`
            };
        }

        function animateGachaCapsules(bowl) {
            const balls = Array.from(bowl?.querySelectorAll('.gacha-ball') || []);
            if (!balls.length) return Promise.resolve();
            bowl.classList.add('shuffling');
            const animations = balls.map((ball, index) => {
                const motion = makeGachaBounceMotion(ball, bowl, index, balls.length);
                const animation = ball.animate(motion.frames, {
                    duration: randomBetween(1900, 2350),
                    delay: randomBetween(0, 130),
                    easing: 'linear',
                    fill: 'forwards'
                });
                return animation.finished
                    .catch(() => {})
                    .then(() => {
                        ball.style.left = motion.finalLeft;
                        ball.style.top = motion.finalTop;
                        ball.style.setProperty('--rest-rotate', motion.finalRotate);
                        ball.style.transform = '';
                        animation.cancel();
                    });
            });
            return Promise.all(animations).finally(() => {
                bowl.classList.remove('shuffling');
            });
        }

        async function pullGachaLever() {
            if (gacha.drawing) return;
            const names = visibleGachaNames();
            if (names.length < 2) return;
            closeGachaPrize();
            gacha.drawing = true;
            const lever = $('gacha-btn');
            const bowl = $('gacha-bowl');
            lever.disabled = true;
            lever.classList.remove('pulling');
            void lever.offsetWidth;
            lever.classList.add('pulling');
            await animateGachaCapsules(bowl);
            await new Promise(resolve => setTimeout(resolve, 520));
            drawGacha();
        }

        function drawGacha() {
            const names = visibleGachaNames();
            const winnerIndex = Math.floor(Math.random() * names.length);
            const winner = names[winnerIndex];
            const asset = ASSETS[winnerIndex % ASSETS.length];
            const dock = $('gacha-dock');
            const capsuleColors = [
                'rgba(91,143,199,.72)',
                'rgba(127,184,63,.72)',
                'rgba(198,156,58,.72)',
                'rgba(205,112,142,.72)',
                'rgba(130,105,206,.72)',
                'rgba(73,177,154,.72)',
                'rgba(221,128,70,.72)',
                'rgba(190,93,183,.72)'
            ];
            const color = capsuleColors[winnerIndex % capsuleColors.length];
            $('gacha-bowl')?.classList.remove('shuffling');
            dock.innerHTML = `<div class="gacha-ball pick" style="--cap:${color}"><img src="${asset}" alt=""></div>`;
            setTimeout(() => {
                $('gacha-result-img').src = asset;
                const resultBall = $('gacha-result-ball');
                if (resultBall) resultBall.style.setProperty('--cap', color);
                $('gacha-winner').textContent = winner;
                $('gacha-prize-modal').hidden = false;
                gacha.history.unshift(winner);
                gacha.history = gacha.history.slice(0, 8);
                $('gacha-history').innerHTML = gacha.history.map(name => `<span class="chip">${escapeHtml(name)}</span>`).join('');
                const statusLast = $('gacha-status-last');
                if (statusLast) statusLast.textContent = winner;
                gacha.drawing = false;
                $('gacha-btn').disabled = false;
                $('gacha-btn').classList.remove('pulling');
            }, 1980);
        }

        function closeGachaPrize() {
            const modal = $('gacha-prize-modal');
            if (modal) modal.hidden = true;
        }

        function clearGachaResults() {
            gacha.history = [];
            $('gacha-winner').textContent = '대기 중';
            $('gacha-result-img').src = ASSETS[3];
            $('gacha-history').innerHTML = '';
            $('gacha-prize-modal').hidden = true;
            const statusLast = $('gacha-status-last');
            if (statusLast) statusLast.textContent = '-';
            $('gacha-dock').innerHTML = '<span class="winner-label">나오는곳</span>';
            $('gacha-bowl')?.classList.remove('shuffling');
        }

        function resetGacha() {
            clearGachaResults();
            renderGacha();
        }

        function openSettings(mode) {
            settingsMode = mode;
            $('settings-title').textContent = mode === 'gacha' ? '뽑기 후보 설정' : (mode === 'ladder' ? '사다리 설정' : '룰렛 설정');
            $('name-input').value = (mode === 'gacha' ? visibleGachaNames() : (mode === 'ladder' ? visibleNames() : visibleRouletteNames())).join('\n');
            $('prize-field').style.display = mode === 'ladder' ? '' : 'none';
            $('prize-input').value = visiblePrizes().join('\n');
            $('settings-modal').classList.add('open');
        }

        function applySettings() {
            const names = cleanLines($('name-input').value);
            if (settingsMode === 'ladder') {
                const prizes = cleanPrizeLines($('prize-input').value);
                if (names.length >= 2) {
                    ladder.names = names;
                    ladder.count = Math.max(2, Math.min(8, ladder.names.length));
                } else {
                    ensureListSize(ladder.names, defaultLadderNames);
                }
                const nextCount = ladder.count;
                ladder.prizes = Array.from({ length: nextCount }, (_, i) => prizes[i] ?? ladder.prizes[i] ?? '');
                resetLadder();
            } else {
                if (settingsMode === 'gacha') {
                    if (names.length >= 2) gacha.names = names;
                    gacha.count = Math.max(2, Math.min(16, gacha.names.length));
                    clearGachaResults();
                    updateGacha();
                } else {
                    if (names.length >= 2) roulette.names = names;
                    roulette.count = Math.max(2, Math.min(12, roulette.names.length));
                    clearRouletteResults();
                    updateRoulette();
                }
            }
            closeModal();
        }

        function modalBackdropClick(event) {
            if (event.target.classList.contains('modal-backdrop')) closeModal();
        }

        function closeModal() {
            document.querySelectorAll('.modal-backdrop.open').forEach(modal => modal.classList.remove('open'));
        }

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeModal();
            if (event.key === 'Enter' && document.querySelector('#ladder-panel.active') && !document.querySelector('.modal-backdrop.open')) revealLadder();
        });

        resetLadder();
        updateRoulette();
        updateGacha();
        window.addEventListener('resize', () => {
            drawLadder();
            drawRoulette();
            renderGacha();
        });
    </script>
</body>
</html>
