    <script>
        const ASSETS = Array.from({ length: 19 }, (_, i) => `game-assets/gobookticon/gobook-${String(i + 1).padStart(2, '0')}.png`);
        const colors = ['#7fb83f', '#5b8fc7', '#c69c3a', '#54a99f', '#9a7bc2', '#8ea65d', '#6f776b', '#9aa26f'];
        const rouletteColors = ['#a9d96b', '#8cc7ee', '#f4ce73', '#8fdbc9', '#c9a7e8', '#f2a58f', '#b9dc86', '#95d0a8'];
        const LIMITS = { ladder: 12, roulette: 40, gacha: 300 };
        const defaultRouletteNames = ['구슬요', '엘시', '따린', '냐냐'];
        const defaultGachaNames = ['구슬요', '엘시', '따린', '냐냐', '키마', '마냥', '난초', '유나기', '시몽'];
        const defaultLadderNames = Array(LIMITS.ladder).fill('');
        const defaultPrizes = Array(LIMITS.ladder).fill('');
        const ladder = { count: 4, names: [...defaultLadderNames], prizes: [...defaultPrizes], rungs: [], mapping: [], paths: [], running: false, rungsVisible: false };
        const roulette = { count: 4, names: [...defaultRouletteNames], rotation: 0, history: [], spinning: false };
        const gacha = { count: 9, names: [...defaultGachaNames], history: [], drawing: false };
        let settingsMode = 'ladder';

        function $(id) {
            return document.getElementById(id);
        }

        function cleanLines(value, max = LIMITS.gacha) {
            return String(value || '').split(/\n+/).map(v => v.trim()).filter(Boolean).slice(0, max);
        }

        function cleanPrizeLines(value, max = LIMITS.ladder) {
            return String(value || '').split(/\n/).map(v => v.trim()).slice(0, max);
        }

        function clampCount(value, mode) {
            return Math.max(2, Math.min(LIMITS[mode], value));
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function shuffle(list) {
            const next = [...list];
            for (let i = next.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [next[i], next[j]] = [next[j], next[i]];
            }
            return next;
        }

        function switchMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
            document.querySelectorAll('.game-panel').forEach(panel => panel.classList.toggle('active', panel.id === `${mode}-panel`));
            if (mode === 'pinball') loadPinballFrame();
            requestAnimationFrame(() => {
                if (mode === 'ladder') drawLadder();
                if (mode === 'roulette') drawRoulette();
                if (mode === 'gacha') renderGacha();
            });
        }

        function loadPinballFrame() {
            const frame = document.querySelector('#pinball-panel iframe[data-src]');
            if (!frame) return;
            frame.src = frame.dataset.src;
            frame.removeAttribute('data-src');
        }

        function visibleNames() {
            ensureListSize(ladder.names, defaultLadderNames);
            return ladder.names.slice(0, ladder.count);
        }

        function visiblePrizes() {
            ensureListSize(ladder.prizes, defaultPrizes);
            return ladder.prizes.slice(0, ladder.count);
        }

        function ensureListSize(list, fallback) {
            for (let i = list.length; i < ladder.count; i++) {
                list[i] = fallback[i % fallback.length] ?? `${i + 1}`;
            }
        }

        function ensureCandidateListSize(list, count, fallback = []) {
            for (let i = list.length; i < count; i++) {
                list[i] = fallback[i] ?? '';
            }
        }

        function updateLadderSlots() {
            $('ladder-count').textContent = `참가자 ${ladder.count}명`;
            const board = $('ladder-board');
            board.style.setProperty('--cols', ladder.count);
            const density = ladder.count > 10
                ? { min: '54px', gap: '8px', pad: '14px', avatar: '44px', font: '12px', height: '40px', cardPad: '6px' }
                : ladder.count > 8
                    ? { min: '64px', gap: '10px', pad: '18px', avatar: '52px', font: '14px', height: '42px', cardPad: '7px' }
                    : { min: '92px', gap: '22px', pad: '46px', avatar: '78px', font: '18px', height: '48px', cardPad: '12px' };
            board.style.setProperty('--slot-min', density.min);
            board.style.setProperty('--slot-gap', density.gap);
            board.style.setProperty('--slot-pad', density.pad);
            board.style.setProperty('--avatar-size', density.avatar);
            board.style.setProperty('--slot-font', density.font);
            board.style.setProperty('--slot-card-height', density.height);
            board.style.setProperty('--slot-card-pad', density.cardPad);
            const names = visibleNames();
            const prizes = visiblePrizes();
            $('ladder-top').innerHTML = names.map((name, i) => `
                <div class="slot">
                    <img class="avatar ladder-start" src="${ASSETS[i % ASSETS.length]}" alt="" title="출발" onclick="runLadder(${i})">
                    <div class="slot-card" contenteditable="true" data-kind="name" data-index="${i}" data-placeholder="참가자" onclick="event.stopPropagation()">${escapeHtml(name)}</div>
                    <div class="arrow" onclick="event.stopPropagation()" aria-hidden="true"></div>
                </div>
            `).join('');
            $('ladder-bottom').innerHTML = prizes.map((prize, i) => `
                <div class="slot">
                    <div class="slot-card" contenteditable="true" data-kind="prize" data-index="${i}" data-placeholder="결과">${escapeHtml(prize)}</div>
                </div>
            `).join('');
            bindEditableSlots();
        }

        function bindEditableSlots() {
            document.querySelectorAll('.slot-card[contenteditable="true"]').forEach(card => {
                card.addEventListener('input', handleSlotEdit);
                card.addEventListener('blur', handleSlotBlur);
                card.addEventListener('keydown', handleSlotKeydown);
            });
        }

        function handleSlotEdit(event) {
            const target = event.currentTarget;
            const index = Number(target.dataset.index);
            const value = target.textContent.trim();
            if (target.dataset.kind === 'name') ladder.names[index] = value;
            if (target.dataset.kind === 'prize') ladder.prizes[index] = value;
        }

        function handleSlotBlur(event) {
            const target = event.currentTarget;
            const index = Number(target.dataset.index);
            const isName = target.dataset.kind === 'name';
            const value = target.textContent.trim();
            target.textContent = value;
            if (isName) ladder.names[index] = value;
            else ladder.prizes[index] = value;
            drawLadder();
        }

        function handleSlotKeydown(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                event.currentTarget.blur();
            }
        }

        function clearLadderResults() {
            $('result-list').innerHTML = '';
            $('results-modal').classList.remove('open');
            const token = $('ladder-token');
            token.hidden = true;
            token.style.left = '';
            token.style.top = '';
        }

        function changeCount(delta) {
            if (ladder.running) return;
            ladder.count = clampCount(ladder.count + delta, 'ladder');
            clearLadderResults();
            resetLadder();
        }

        function makeRungs() {
            const rows = Math.max(12, ladder.count * 3);
            const laneCount = ladder.count - 1;
            const rungs = [];
            const laneCounts = Array(laneCount).fill(0);
            const laneIndexes = Array.from({ length: laneCount }, (_, index) => index);
            const rowIndexes = Array.from({ length: rows }, (_, index) => index)
                .sort(() => Math.random() - .5);

            for (const row of rowIndexes) {
                const used = new Set();
                const rowLanes = [...laneIndexes]
                    .sort(() => Math.random() - .5)
                    .sort((a, b) => laneCounts[a] - laneCounts[b]);
                const leastUsed = Math.min(...laneCounts);

                for (const col of rowLanes) {
                    if (used.has(col) || used.has(col + 1)) continue;
                    if (!canPlaceRung(rungs, row, col)) continue;
                    const chance = laneCounts[col] <= leastUsed ? .48 : .34;
                    if (Math.random() < chance) {
                        rungs.push({ row, col });
                        laneCounts[col] += 1;
                        used.add(col);
                        used.add(col + 1);
                    }
                }
            }

            const minimumPerLane = ladder.count <= 4 ? 2 : 1;
            for (let col = 0; col < laneCount; col++) {
                while (laneCounts[col] < minimumPerLane && addMissingLaneRung(rungs, laneCounts, rows, col)) {
                    // Keep adding until every adjacent pair has enough visual crossings.
                }
            }

            if (!rungs.length) {
                rungs.push({ row: Math.floor(rows / 2), col: 0 });
            }
            rungs.sort((a, b) => a.row - b.row || a.col - b.col);
            return { rows, rungs };
        }

        function addMissingLaneRung(rungs, laneCounts, rows, col) {
            const rowIndexes = Array.from({ length: rows }, (_, index) => index)
                .sort(() => Math.random() - .5);
            for (const row of rowIndexes) {
                if (!canPlaceRung(rungs, row, col)) continue;
                rungs.push({ row, col });
                laneCounts[col] += 1;
                return true;
            }
            return false;
        }

        function canPlaceRung(rungs, row, col) {
            return !rungs.some(rung => {
                const sameRowTouches = rung.row === row && Math.abs(rung.col - col) <= 1;
                const sameLaneStacked = rung.col === col && Math.abs(rung.row - row) <= 1;
                return sameRowTouches || sameLaneStacked;
            });
        }

        function computeLadder(rows, rungs) {
            const byRow = new Map();
            rungs.forEach(r => {
                if (!byRow.has(r.row)) byRow.set(r.row, []);
                byRow.get(r.row).push(r.col);
            });
            ladder.mapping = [];
            ladder.paths = [];
            for (let start = 0; start < ladder.count; start++) {
                let col = start;
                const path = [{ row: -1, col }];
                for (let row = 0; row < rows; row++) {
                    const rowRungs = byRow.get(row) || [];
                    path.push({ row, col });
                    if (rowRungs.includes(col)) {
                        col += 1;
                        path.push({ row, col });
                    } else if (rowRungs.includes(col - 1)) {
                        col -= 1;
                        path.push({ row, col });
                    }
                }
                path.push({ row: rows, col });
                ladder.mapping[start] = col;
                ladder.paths[start] = path;
            }
        }

        function resetLadder({ reveal = false } = {}) {
            clearLadderResults();
            const made = makeRungs();
            ladder.rows = made.rows;
            ladder.rungs = made.rungs;
            ladder.rungsVisible = reveal;
            computeLadder(ladder.rows, ladder.rungs);
            updateLadderSlots();
            drawLadder();
        }

        function shuffleLadder() {
            if (ladder.running) return;
            resetLadder({ reveal: true });
        }

        function revealLadder() {
            if (ladder.running) return;
            if (!validateLadderNames()) return;
            if (!validateLadderPrizes()) return;
            ladder.rungsVisible = true;
            clearLadderResults();
            drawLadder();
        }

        function fitCanvas(canvas, wrap) {
            canvas.style.height = '';
            const wrapRect = wrap.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const width = Math.max(320, canvasRect.width);
            const height = Math.max(220, wrapRect.height);
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            canvas.style.height = `${height}px`;
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            return { ctx, width, height };
        }

        function ladderMetrics(width, height) {
            const canvasRect = $('ladder-canvas').getBoundingClientRect();
            const slots = Array.from(document.querySelectorAll('#ladder-top .slot'));
            const xs = slots.slice(0, ladder.count).map(slot => {
                const rect = slot.getBoundingClientRect();
                return rect.left + rect.width / 2 - canvasRect.left;
            });
            const top = 24;
            const bottom = height - 24;
            const left = xs[0] ?? 28;
            const right = xs[xs.length - 1] ?? (width - 28);
            const gapX = ladder.count > 1 ? (right - left) / (ladder.count - 1) : 0;
            const gapY = ladder.rows > 0 ? (bottom - top) / ladder.rows : 0;
            return { top, bottom, left, right, gapX, gapY, xs };
        }

        function ladderX(metrics, col) {
            return metrics.xs[col] ?? (metrics.left + col * metrics.gapX);
        }

        function drawLadder(path = null) {
            const canvas = $('ladder-canvas');
            const wrap = $('ladder-wrap');
            const { ctx, width, height } = fitCanvas(canvas, wrap);
            const m = ladderMetrics(width, height);
            ctx.clearRect(0, 0, width, height);
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#6f776b';
            ctx.lineWidth = 4.5;

            for (let col = 0; col < ladder.count; col++) {
                const x = ladderX(m, col);
                ctx.beginPath();
                ctx.moveTo(x, m.top);
                ctx.lineTo(x, m.bottom);
                ctx.stroke();
            }

            if (ladder.rungsVisible || path) {
                ladder.rungs.forEach(r => {
                    const y = m.top + (r.row + .5) * m.gapY;
                    const x1 = ladderX(m, r.col);
                    const x2 = ladderX(m, r.col + 1);
                    ctx.beginPath();
                    ctx.moveTo(x1, y);
                    ctx.lineTo(x2, y);
                    ctx.stroke();
                });
            }

            if (!path) return;
            ctx.strokeStyle = '#7fb83f';
            ctx.lineWidth = 8;
            ctx.beginPath();
            pathToPoints(path, width, height).forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();
        }

        function pathToPoints(path, width, height) {
            const m = ladderMetrics(width, height);
            return path.map(p => {
                let y = m.top;
                if (p.row >= ladder.rows) y = m.bottom;
                else if (p.row >= 0) y = m.top + (p.row + .5) * m.gapY;
                return { x: ladderX(m, p.col), y };
            });
        }

        let toastTimer = null;
        function showGameToast(message) {
            const toast = $('game-toast');
            if (!toast) return;
            toast.innerHTML = `<img class="game-toast-sticker" src="${ASSETS[0]}" alt=""><span>${escapeHtml(message)}</span>`;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function validateLadderPrizes() {
            const prizes = visiblePrizes();
            const blankIndex = prizes.findIndex(prize => !String(prize || '').trim());
            if (blankIndex === -1) return true;
            showGameToast('하단 결과칸을 모두 입력해주세요');
            const blankCard = document.querySelector(`#ladder-bottom .slot-card[data-index="${blankIndex}"]`);
            if (blankCard) {
                blankCard.focus();
                requestAnimationFrame(() => blankCard.scrollIntoView({ block: 'nearest', inline: 'center' }));
            }
            return false;
        }

        function validateLadderNames() {
            const names = visibleNames();
            const blankIndex = names.findIndex(name => !String(name || '').trim());
            if (blankIndex === -1) return true;
            showGameToast('참가자 이름을 모두 입력해주세요');
            const blankCard = document.querySelector(`#ladder-top .slot-card[data-index="${blankIndex}"]`);
            if (blankCard) {
                blankCard.focus();
                requestAnimationFrame(() => blankCard.scrollIntoView({ block: 'nearest', inline: 'center' }));
            }
            return false;
        }

        async function runLadder(index = 0) {
            if (ladder.running || !ladder.paths[index]) return;
            if (!validateLadderNames()) return;
            if (!validateLadderPrizes()) return;
            if (!ladder.rungsVisible) ladder.rungsVisible = true;
            ladder.running = true;
            const path = ladder.paths[index];
            drawLadder(path);
            const token = $('ladder-token');
            token.src = ASSETS[index % ASSETS.length];
            token.hidden = false;
            const wrapRect = $('ladder-wrap').getBoundingClientRect();
            const canvasRect = $('ladder-canvas').getBoundingClientRect();
            const points = pathToPoints(path, canvasRect.width, canvasRect.height)
                .map(p => ({
                    x: canvasRect.left - wrapRect.left + p.x,
                    y: canvasRect.top - wrapRect.top + p.y,
            }));
            await moveLadderToken(token, points);
            ladder.running = false;
        }

        function moveLadderToken(token, points) {
            if (!points.length) return Promise.resolve();
            token.style.left = `${points[0].x}px`;
            token.style.top = `${points[0].y}px`;
            if (points.length === 1) {
                return new Promise(resolve => setTimeout(resolve, 120));
            }

            const segments = [];
            let total = 0;
            for (let i = 1; i < points.length; i++) {
                const from = points[i - 1];
                const to = points[i];
                const length = Math.hypot(to.x - from.x, to.y - from.y);
                if (length < 1) continue;
                total += length;
                segments.push({ from, to, length, end: total });
            }
            if (!segments.length) return Promise.resolve();

            const duration = Math.max(900, Math.min(5200, total * .78));
            const start = performance.now();

            return new Promise(resolve => {
                function step(now) {
                    const t = Math.min(1, (now - start) / duration);
                    const eased = t < .08
                        ? t * (1 / .08) * t * (1 / .08) * .08
                        : t > .92
                            ? 1 - Math.pow((1 - t) * (1 / .08), 2) * .08
                            : t;
                    const target = total * eased;
                    const segment = segments.find(s => target <= s.end) || segments[segments.length - 1];
                    const startLength = segment.end - segment.length;
                    const local = segment.length ? (target - startLength) / segment.length : 1;
                    token.style.left = `${segment.from.x + (segment.to.x - segment.from.x) * local}px`;
                    token.style.top = `${segment.from.y + (segment.to.y - segment.from.y) * local}px`;
                    if (t < 1) requestAnimationFrame(step);
                    else resolve();
                }
                requestAnimationFrame(step);
            });
        }

        function showLadderResults() {
            if (!validateLadderNames()) return;
            if (!validateLadderPrizes()) return;
            const names = visibleNames();
            const prizes = visiblePrizes();
            $('result-list').innerHTML = names.map((name, i) => {
                const prize = prizes[ladder.mapping[i]] || '';
                return `<div class="result-item"><span>${escapeHtml(name)}</span><em>→</em><b>${escapeHtml(prize)}</b></div>`;
            }).join('');
            $('results-modal').classList.add('open');
        }

        function updateRoulette() {
            $('roulette-count').textContent = `후보 ${roulette.count}명`;
            drawRoulette();
        }

        function clearRouletteResults() {
            roulette.rotation = 0;
            roulette.history = [];
            $('roulette-canvas').style.transitionDuration = '0s';
            $('roulette-canvas').style.transform = 'rotate(0deg)';
            requestAnimationFrame(() => { $('roulette-canvas').style.transitionDuration = ''; });
            $('winner-name').textContent = '대기 중';
            $('winner-img').src = ASSETS[2];
            $('history').innerHTML = '';
            $('wheel-center-img').src = ASSETS[1];
        }

        function visibleRouletteNames() {
            ensureCandidateListSize(roulette.names, roulette.count, defaultRouletteNames);
            return roulette.names.slice(0, roulette.count);
        }

        function drawRoulette() {
            const canvas = $('roulette-canvas');
            const ctx = canvas.getContext('2d');
            const names = visibleRouletteNames();
            const size = canvas.width;
            const center = size / 2;
            const radius = size * .45;
            const slice = Math.PI * 2 / names.length;
            ctx.clearRect(0, 0, size, size);

            names.forEach((name, i) => {
                const start = -Math.PI / 2 + i * slice;
                const end = start + slice;
                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, start, end);
                ctx.closePath();
                ctx.fillStyle = rouletteColors[i % rouletteColors.length];
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,.9)';
                ctx.lineWidth = 6;
                ctx.stroke();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(start + slice / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff';
                const labelFont = names.length > 30 ? 13 : names.length > 20 ? 16 : names.length > 12 ? 20 : names.length > 8 ? 26 : 32;
                ctx.font = `${names.length > 8 ? 800 : 900} ${labelFont}px Pretendard, sans-serif`;
                ctx.shadowColor = 'rgba(46,65,34,.2)';
                ctx.shadowBlur = 2;
                const maxLabelLength = names.length > 30 ? 4 : names.length > 20 ? 5 : names.length > 12 ? 6 : 8;
                const label = name.length > maxLabelLength ? name.slice(0, maxLabelLength - 1) + '…' : name;
                ctx.fillText(label, radius - (names.length > 24 ? 18 : 30), 0);
                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(center, center, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(127,184,63,.26)';
            ctx.lineWidth = 12;
            ctx.stroke();
        }

        function normalizeDegrees(deg) {
            return ((deg % 360) + 360) % 360;
        }

        function spinRoulette() {
            if (roulette.spinning) return;
            const names = visibleRouletteNames();
            if (names.length < 2) return;
            roulette.spinning = true;
            $('spin-btn').disabled = true;
            document.querySelector('.wheel-center').disabled = true;
            const winnerIndex = Math.floor(Math.random() * names.length);
            const sliceDeg = 360 / names.length;
            const target = winnerIndex * sliceDeg + sliceDeg / 2;
            const turns = 5 + Math.floor(Math.random() * 3);
            const nearEdge = Math.random() < .42;
            const maxJitter = sliceDeg * (nearEdge ? .43 : .28);
            const minJitter = nearEdge ? sliceDeg * .26 : 0;
            const jitterDirection = Math.random() < .5 ? -1 : 1;
            const jitter = jitterDirection * (minJitter + Math.random() * (maxJitter - minJitter));
            const targetRotation = normalizeDegrees(360 - target + jitter);
            const currentRotation = normalizeDegrees(roulette.rotation);
            const delta = normalizeDegrees(targetRotation - currentRotation);
            roulette.rotation += turns * 360 + delta;
            $('roulette-canvas').style.transform = `rotate(${roulette.rotation}deg)`;
            $('wheel-center-img').src = ASSETS[(winnerIndex + 2) % ASSETS.length];
            setTimeout(() => {
                const winner = names[winnerIndex];
                $('winner-name').textContent = winner;
                $('winner-img').src = ASSETS[winnerIndex % ASSETS.length];
                roulette.history.unshift(winner);
                roulette.history = roulette.history.slice(0, 8);
                $('history').innerHTML = roulette.history.map(name => `<span class="chip">${escapeHtml(name)}</span>`).join('');
                roulette.spinning = false;
                $('spin-btn').disabled = false;
                document.querySelector('.wheel-center').disabled = false;
            }, 4100);
        }

        function resetRoulette() {
            clearRouletteResults();
            document.querySelector('.wheel-center').disabled = false;
            drawRoulette();
        }

        function visibleGachaNames() {
            ensureCandidateListSize(gacha.names, gacha.count, defaultGachaNames);
            return gacha.names.slice(0, gacha.count);
        }

        function updateGacha() {
            $('gacha-count').textContent = `후보 ${gacha.count}명`;
            const statusCount = $('gacha-status-count');
            if (statusCount) statusCount.textContent = String(gacha.count);
            renderGacha();
        }

        function randomBetween(min, max) {
            return min + Math.random() * (max - min);
        }

        function gachaCapsuleMetrics(count) {
            if (count > 42)  return { ball: 96, img: 54 };
            if (count > 36)  return { ball: 106, img: 58 };
            if (count > 28)  return { ball: 112, img: 62 };
            if (count > 20)  return { ball: 124, img: 68 };
            return { ball: 136, img: 74 };
        }

        function gachaVisualCapsuleCount(candidateCount) {
            if (candidateCount <= 0) return 0;
            const scaled = Math.ceil(33 + Math.min(3, Math.sqrt(candidateCount)));
            return Math.min(36, Math.max(34, scaled));
        }

        function gachaLayoutBounds(count) {
            return count > 36
                ? { leftMin: 3, leftMax: 74, topMin: 10, topMax: 72 }
                : count > 28
                    ? { leftMin: 3, leftMax: 74, topMin: 9, topMax: 70 }
                    : { leftMin: 5, leftMax: 72, topMin: 10, topMax: 68 };
        }

        function makeGachaCapsuleLayout(count) {
            const placed = [];
            const bounds = gachaLayoutBounds(count);
            const aspect = 1.72;
            const cols = Math.max(2, Math.ceil(Math.sqrt(count * aspect)));
            const rows = Math.max(1, Math.ceil(count / cols));
            const cellW = (bounds.leftMax - bounds.leftMin) / cols;
            const cellH = (bounds.topMax - bounds.topMin) / rows;
            for (let i = 0; i < count; i++) {
                const row = Math.floor(i / cols);
                const col = i % cols;
                let left = 50;
                let top = 60;
                if (count <= 28) {
                    const compactPile = count <= 4;
                    const layer = Math.floor(i / 4);
                    for (let attempt = 0; attempt < 24; attempt++) {
                        const lowerPile = Math.random() < (compactPile ? .92 : .72);
                        const layerTop = lowerPile
                            ? randomBetween(compactPile ? 52 : 54, bounds.topMax) - layer * randomBetween(4, 7)
                            : randomBetween(compactPile ? 42 : 30, 56) - layer * randomBetween(2, 4);
                        left = randomBetween(bounds.leftMin, bounds.leftMax);
                        top = Math.max(bounds.topMin, Math.min(bounds.topMax, layerTop + randomBetween(-4, 4)));
                        const tooClose = placed.some(item => {
                            const dx = item.left - left;
                            const dy = item.top - top;
                            return Math.hypot(dx, dy) < 12;
                        });
                        if (!tooClose || attempt > 16) break;
                    }
                } else {
                    const rowBias = rows <= 1 ? 0 : row / (rows - 1);
                    const lowerWeight = Math.pow(rowBias, .62);
                    left = bounds.leftMin + (col + .5) * cellW + randomBetween(-cellW * .34, cellW * .34);
                    top = bounds.topMin + (row + .5) * cellH + randomBetween(-cellH * .36, cellH * .36);
                    top += lowerWeight * Math.min(7, cellH * 1.15);
                    left = Math.max(bounds.leftMin, Math.min(bounds.leftMax, left));
                    top = Math.max(bounds.topMin, Math.min(bounds.topMax, top));
                }
                placed.push({
                    left,
                    top,
                    rotate: randomBetween(-24, 24),
                    direction: Math.random() < .5 ? -1 : 1,
                });
            }
            return placed.sort((a, b) => a.top - b.top);
        }

        function renderGacha() {
            const bowl = $('gacha-bowl');
            if (!bowl) return;
            const names = visibleGachaNames();
            const visualCount = gachaVisualCapsuleCount(names.length);
            $('gacha-count').textContent = `후보 ${gacha.count}명`;
            const statusCount = $('gacha-status-count');
            if (statusCount) statusCount.textContent = String(gacha.count);
            const metrics = gachaCapsuleMetrics(visualCount);
            bowl.style.setProperty('--gacha-ball-size', `${metrics.ball}px`);
            bowl.style.setProperty('--gacha-img-size', `${metrics.img}px`);
            const capsuleColors = [
                'rgba(91,143,199,.72)',
                'rgba(127,184,63,.72)',
                'rgba(198,156,58,.72)',
                'rgba(205,112,142,.72)',
                'rgba(130,105,206,.72)',
                'rgba(73,177,154,.72)',
                'rgba(221,128,70,.72)',
                'rgba(190,93,183,.72)'
            ];
            const layout = makeGachaCapsuleLayout(visualCount);
            const capsules = Array.from({ length: visualCount }, (_, i) => names[i % names.length] || `캡슐 ${i + 1}`);
            bowl.innerHTML = capsules.map((name, i) => {
                const spot = layout[i];
                const direction = spot.direction;
                const mixX1 = direction * randomBetween(74, 154);
                const mixY1 = -randomBetween(54, 132);
                const mixX2 = direction * -randomBetween(88, 176);
                const mixY2 = randomBetween(46, 116);
                const mixX3 = direction * randomBetween(96, 190);
                const mixY3 = randomBetween(-82, 82);
                const mixRotate = randomBetween(220, 430);
                const delay = randomBetween(0, .22);
                const color = capsuleColors[i % capsuleColors.length];
                return `<div class="gacha-ball" title="${escapeHtml(name)}" style="left:${spot.left.toFixed(1)}%;top:${spot.top.toFixed(1)}%;--cap:${color};--rest-rotate:${spot.rotate.toFixed(1)}deg;--mix-x1:${mixX1.toFixed(1)}px;--mix-y1:${mixY1.toFixed(1)}px;--mix-x2:${mixX2.toFixed(1)}px;--mix-y2:${mixY2.toFixed(1)}px;--mix-x3:${mixX3.toFixed(1)}px;--mix-y3:${mixY3.toFixed(1)}px;--mix-rotate:${mixRotate.toFixed(1)}deg;--shake-delay:${delay.toFixed(2)}s">
                    <img src="${ASSETS[i % ASSETS.length]}" alt="">
                </div>`;
            }).join('');
        }

        function makeGachaPhysicsState(ball, bowl, index, total) {
            const bounds = gachaLayoutBounds(total);
            const leftMin = bounds.leftMin;
            const leftMax = bounds.leftMax;
            const topMin = bounds.topMin;
            const topMax = bounds.topMax;
            const bowlRect = bowl.getBoundingClientRect();
            const ballRect = ball.getBoundingClientRect();
            const ballPctX = ballRect.width / bowlRect.width * 100;
            const ballPctY = ballRect.height / bowlRect.height * 100;
            const edgePadX = total > 36 ? 1.2 : 1.65;
            const edgePadY = 2;
            const wallLeftMin = Math.max(leftMin, edgePadX);
            const wallLeftMax = Math.min(leftMax, 100 - ballPctX - edgePadX);
            const wallTopMin = Math.max(topMin, edgePadY);
            const baseFloorTop = Math.min(topMax + (total > 28 ? 6.5 : 4.8), 100 - ballPctY - edgePadY);
            const stackRoll = Math.random();
            const stackLift = stackRoll < .64
                ? randomBetween(0, 1.1)
                : stackRoll < .9
                    ? randomBetween(1.2, 4.4)
                    : randomBetween(4.5, 7.6);
            const floorTop = baseFloorTop - stackLift;
            const startLeft = Math.max(wallLeftMin, Math.min(wallLeftMax, Number.parseFloat(ball.style.left) || randomBetween(12, 76)));
            const startTop = Math.max(wallTopMin, Math.min(baseFloorTop, Number.parseFloat(ball.style.top) || randomBetween(52, 70)));
            const density = total > 36 ? .98 : 1.28;
            let vx = randomBetween(-216, 216) * density;
            let vy = randomBetween(-216, 120) * density;
            if (Math.abs(vx) < 68 * density) vx += (vx < 0 ? -1 : 1) * randomBetween(68, 104) * density;
            if (Math.abs(vy) < 54 * density) vy += (vy < 0 ? -1 : 1) * randomBetween(54, 88) * density;
            return {
                ball,
                bowlRect,
                density,
                floorTop,
                index,
                left: startLeft,
                phase: randomBetween(0, Math.PI * 2),
                rotate: Number.parseFloat(ball.style.getPropertyValue('--rest-rotate')) || 0,
                spin: randomBetween(-520, 520) * density,
                top: startTop,
                vx,
                vy,
                wallLeftMax,
                wallLeftMin,
                wallTopMin
            };
        }

        function stepGachaCapsule(state, elapsed, dt) {
            const t = elapsed / 1000;
            const mix = elapsed < 2100 ? 1 : Math.max(0, 1 - (elapsed - 2100) / 780);
            const settle = 1 - mix;
            const centerX = 43 + Math.sin(t * 1.72 + state.phase) * 9.2 * mix;
            const centerY = 47 + Math.cos(t * 1.36 + state.phase * .8) * 8.8 * mix;
            const dx = state.left - centerX;
            const dy = state.top - centerY;
            const swirl = mix * (120 + state.density * 70);
            const pulse = Math.sin(t * (10.5 + (state.index % 5) * .8) + state.phase);
            const lift = Math.cos(t * (9.2 + (state.index % 4) * .9) + state.phase * .7);
            const wallRush = Math.sin(t * (7.8 + (state.index % 6) * .55) + state.phase * 1.3);
            state.vx += ((-dy * 1.34) + pulse * 110 + wallRush * 66) * swirl * dt / 58;
            state.vy += ((dx * .9) + lift * 98 - 54 * mix) * swirl * dt / 62;
            state.vy += (124 + settle * 42 + mix * 18) * state.density * dt;
            const drag = Math.max(.64, .988 - settle * .18);
            state.vx *= drag;
            state.vy *= drag;
            state.spin *= mix > 0 ? .982 : Math.max(.42, .84 - settle * .32);
            state.left += state.vx * dt;
            state.top += state.vy * dt;
            state.rotate += state.spin * dt + state.vx * .16;

            if (state.left < state.wallLeftMin || state.left > state.wallLeftMax) {
                state.left = Math.max(state.wallLeftMin, Math.min(state.wallLeftMax, state.left));
                state.vx *= -(mix > 0 ? .94 : .46);
                state.vy += Math.sin(t * 12 + state.phase) * 28 * state.density * mix;
                state.spin += state.vx * 2.15;
            }
            if (state.top < state.wallTopMin) {
                state.top = state.wallTopMin;
                state.vy = Math.abs(state.vy) * (mix > 0 ? .9 : .34);
                state.vx += Math.sin(t * 13 + state.phase) * 30 * state.density;
                state.spin += state.vy * 1.35;
            }
            if (state.top > state.floorTop) {
                state.top = state.floorTop;
                if (mix > .08) {
                    state.vy = -Math.abs(state.vy) * (mix > .24 ? .78 : .34);
                    state.vx += Math.cos(t * 10 + state.phase) * 34 * state.density;
                } else {
                    state.vy = 0;
                    state.vx *= .38;
                    state.spin *= .3;
                }
            }

            state.ball.style.left = `${state.left.toFixed(2)}%`;
            state.ball.style.top = `${state.top.toFixed(2)}%`;
            state.ball.style.setProperty('--rest-rotate', `${state.rotate.toFixed(1)}deg`);
        }

        function animateGachaCapsules(bowl) {
            const balls = Array.from(bowl?.querySelectorAll('.gacha-ball') || []);
            if (!balls.length) return Promise.resolve();
            bowl.classList.add('shuffling');
            const states = balls.map((ball, index) => makeGachaPhysicsState(ball, bowl, index, balls.length));
            return new Promise(resolve => {
                const duration = randomBetween(2850, 3300);
                let startedAt = 0;
                let lastAt = 0;
                function tick(now) {
                    if (!startedAt) {
                        startedAt = now;
                        lastAt = now;
                    }
                    const elapsed = now - startedAt;
                    const dt = Math.min(0.026, (now - lastAt) / 1000 || 0.016);
                    lastAt = now;
                    states.forEach(state => stepGachaCapsule(state, elapsed, dt));
                    if (elapsed < duration) {
                        requestAnimationFrame(tick);
                    } else {
                        bowl.classList.remove('shuffling');
                        resolve();
                    }
                }
                requestAnimationFrame(tick);
            });
        }

        async function pullGachaLever() {
            if (gacha.drawing) return;
            const names = visibleGachaNames();
            if (names.length < 2) return;
            closeGachaPrize();
            renderGacha();
            gacha.drawing = true;
            const lever = $('gacha-btn');
            const bowl = $('gacha-bowl');
            lever.disabled = true;
            lever.classList.remove('pulling');
            void lever.offsetWidth;
            lever.classList.add('pulling');
            await animateGachaCapsules(bowl);
            await new Promise(resolve => setTimeout(resolve, 180));
            drawGacha();
        }

        function drawGacha() {
            const names = visibleGachaNames();
            const winnerIndex = Math.floor(Math.random() * names.length);
            const winner = names[winnerIndex];
            const asset = ASSETS[winnerIndex % ASSETS.length];
            const dock = $('gacha-dock');
            const machine = document.querySelector('.gacha-machine');
            const capsuleColors = [
                'rgba(91,143,199,.72)',
                'rgba(127,184,63,.72)',
                'rgba(198,156,58,.72)',
                'rgba(205,112,142,.72)',
                'rgba(130,105,206,.72)',
                'rgba(73,177,154,.72)',
                'rgba(221,128,70,.72)',
                'rgba(190,93,183,.72)'
            ];
            const color = capsuleColors[winnerIndex % capsuleColors.length];
            $('gacha-bowl')?.classList.remove('shuffling');
            machine?.classList.remove('dispensing');
            void machine?.offsetWidth;
            machine?.classList.add('dispensing');
            dock.innerHTML = `<div class="gacha-ball pick" style="--cap:${color}"><img src="${asset}" alt=""></div>`;
            setTimeout(() => {
                $('gacha-result-img').src = asset;
                const resultBall = $('gacha-result-ball');
                if (resultBall) resultBall.style.setProperty('--cap', color);
                $('gacha-winner').textContent = winner;
                $('gacha-prize-modal').hidden = false;
                gacha.history.unshift(winner);
                gacha.history = gacha.history.slice(0, 8);
                $('gacha-history').innerHTML = gacha.history.map(name => `<span class="chip">${escapeHtml(name)}</span>`).join('');
                const statusLast = $('gacha-status-last');
                if (statusLast) statusLast.textContent = winner;
                gacha.drawing = false;
                $('gacha-btn').disabled = false;
                $('gacha-btn').classList.remove('pulling');
                machine?.classList.remove('dispensing');
            }, 1900);
        }

        function closeGachaPrize() {
            const modal = $('gacha-prize-modal');
            if (modal) modal.hidden = true;
        }

        function clearGachaResults() {
            gacha.history = [];
            $('gacha-winner').textContent = '대기 중';
            $('gacha-result-img').src = ASSETS[3];
            $('gacha-history').innerHTML = '';
            $('gacha-prize-modal').hidden = true;
            const statusLast = $('gacha-status-last');
            if (statusLast) statusLast.textContent = '-';
            document.querySelector('.gacha-machine')?.classList.remove('dispensing');
            $('gacha-dock').innerHTML = '<span class="winner-label">나오는곳</span>';
            $('gacha-bowl')?.classList.remove('shuffling');
        }

        function resetGacha() {
            clearGachaResults();
            renderGacha();
        }

        function openSettings(mode) {
            settingsMode = mode;
            $('settings-title').textContent = mode === 'gacha' ? '뽑기 후보 설정' : (mode === 'ladder' ? '사다리 설정' : '룰렛 설정');
            const nameLabel = document.querySelector('label[for="name-input"]');
            if (nameLabel) {
                nameLabel.textContent = mode === 'ladder'
                    ? `참가자 / 후보 (최대 ${LIMITS.ladder}명)`
                    : `참가자 / 후보 (최대 ${LIMITS[mode]}명)`;
            }
            const prizeLabel = document.querySelector('label[for="prize-input"]');
            if (prizeLabel) prizeLabel.textContent = `사다리 결과 (최대 ${LIMITS.ladder}개)`;
            $('name-input').value = (mode === 'gacha' ? visibleGachaNames() : (mode === 'ladder' ? visibleNames() : visibleRouletteNames())).join('\n');
            $('prize-field').style.display = mode === 'ladder' ? '' : 'none';
            $('prize-input').value = visiblePrizes().join('\n');
            $('settings-modal').classList.add('open');
        }

        function applySettings() {
            const names = cleanLines($('name-input').value, LIMITS[settingsMode]);
            if (settingsMode === 'ladder') {
                const prizes = cleanPrizeLines($('prize-input').value, LIMITS.ladder);
                if (names.length >= 2) {
                    ladder.names = names;
                    ladder.count = clampCount(ladder.names.length, 'ladder');
                } else {
                    ensureListSize(ladder.names, defaultLadderNames);
                }
                const nextCount = ladder.count;
                ladder.prizes = Array.from({ length: nextCount }, (_, i) => prizes[i] ?? ladder.prizes[i] ?? '');
                resetLadder();
            } else {
                if (settingsMode === 'gacha') {
                    if (names.length >= 2) gacha.names = names;
                    gacha.count = clampCount(gacha.names.length, 'gacha');
                    clearGachaResults();
                    updateGacha();
                } else {
                    if (names.length >= 2) roulette.names = names;
                    roulette.count = clampCount(roulette.names.length, 'roulette');
                    clearRouletteResults();
                    updateRoulette();
                }
            }
            closeModal();
        }

        function modalBackdropClick(event) {
            if (event.target.classList.contains('modal-backdrop')) closeModal();
        }

        function closeModal() {
            document.querySelectorAll('.modal-backdrop.open').forEach(modal => modal.classList.remove('open'));
        }

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeModal();
            if (event.key === 'Enter' && document.querySelector('#ladder-panel.active') && !document.querySelector('.modal-backdrop.open')) revealLadder();
        });

        resetLadder();
        updateRoulette();
        updateGacha();
        window.addEventListener('resize', () => {
            drawLadder();
            drawRoulette();
            renderGacha();
        });
    </script>
