<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEADYO Games</title>
    <link rel="icon" href="logo-icon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet"></noscript>
    <style>
        * { box-sizing: border-box; }

        :root {
            --accent: #7fb83f;
            --accent-dark: #4f7f25;
            --accent-soft: #eef7e4;
            --ink: #2b2f29;
            --muted: #74796f;
            --line: rgba(42, 47, 41, .1);
            --bg: #f5f6f2;
            --stage: #fff;
            --rail: #6f776b;
            --rail-soft: #8b947f;
            --highlight: #c69c3a;
            --highlight-soft: #fff8e6;
            --blue: #5b8fc7;
            --gold: #c69c3a;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(180deg, rgba(238,247,228,.76) 0%, rgba(244,245,241,0) 220px),
                var(--bg);
            color: var(--ink);
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            min-height: 100vh;
            padding: 22px 28px 34px;
        }

        .top {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 16px;
            align-items: center;
            margin-bottom: 14px;
        }

        .eyebrow {
            color: var(--accent-dark);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: .08em;
        }

        h1 {
            margin: 1px 0 6px;
            font-size: 34px;
            line-height: 1.1;
            letter-spacing: 0;
        }

        .mode-tabs {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255,255,255,.8);
            box-shadow: 0 1px 3px rgba(42,47,41,.04);
        }

        .mode-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 38px;
            padding: 0 16px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #687061;
            font-weight: 900;
            white-space: nowrap;
        }

        .mode-btn.active {
            color: #fff;
            background: var(--accent);
            box-shadow: 0 5px 14px rgba(127,184,63,.28);
        }

        .mode-btn svg,
        .action-btn svg,
        .icon-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
        }

        .game-panel {
            display: none;
        }

        .game-panel.active {
            display: block;
        }

        .play-stage {
            position: relative;
            min-height: calc(100vh - 142px);
            padding: 28px 32px 26px;
            border-color: rgba(127,184,63,.2);
            border-radius: 12px;
            background:
                linear-gradient(180deg, #ffffff 0%, #fbfcf8 100%);
            box-shadow: 0 10px 28px rgba(42,47,41,.06);
            overflow: hidden;
        }

        .stage-toolbar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .counter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 4px;
            border: 1px solid rgba(127,184,63,.22);
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 4px 12px rgba(42,47,41,.05);
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--accent-dark);
            box-shadow: none;
        }

        .icon-btn:hover {
            background: var(--accent-soft);
        }

        .count-num {
            min-width: 96px;
            text-align: center;
            color: var(--ink);
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
        }

        .toolbar-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 0 18px;
            border: 1px solid rgba(127,184,63,.22);
            border-radius: 8px;
            background: #fff;
            color: #4d5549;
            font-weight: 900;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(42,47,41,.05);
        }

        .action-btn.reset {
            border-color: rgba(34,39,32,.12);
            background: #f7f8f4;
            color: #687061;
            box-shadow: 0 4px 12px rgba(42,47,41,.04);
        }

        .action-btn.reset:hover {
            border-color: rgba(127,184,63,.34);
            background: var(--accent-soft);
            color: var(--accent-dark);
        }

        .action-btn.green {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
            box-shadow: 0 8px 20px rgba(127,184,63,.22);
        }

        .ladder-board {
            --cols: 4;
            position: relative;
            display: grid;
            grid-template-rows: auto minmax(420px, 1fr) auto;
            gap: 12px;
            min-height: calc(100vh - 248px);
        }

        .slot-row {
            display: grid;
            grid-template-columns: repeat(var(--cols), minmax(92px, 1fr));
            gap: 22px;
            align-items: end;
            padding: 0 46px;
        }

        .slot {
            display: grid;
            justify-items: center;
            gap: 8px;
            min-width: 0;
        }

        .top .slot {
            cursor: pointer;
        }

        .avatar {
            width: 78px;
            height: 78px;
            padding: 8px;
            border: 1px solid rgba(127,184,63,.24);
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 24%, rgba(255,255,255,.98) 0 18%, transparent 19%),
                linear-gradient(150deg, #ffffff 0%, #eef7e4 100%);
            object-fit: contain;
            box-shadow: 0 7px 16px rgba(42,47,41,.11);
            filter: drop-shadow(0 4px 7px rgba(42,47,41,.12));
        }

        .slot-card {
            display: grid;
            place-items: center;
            width: min(132px, 100%);
            min-height: 48px;
            padding: 0 12px;
            border: 1px solid rgba(34,39,32,.1);
            border-radius: 8px;
            background: #fff;
            color: #5b5f58;
            font-size: 18px;
            font-weight: 900;
            box-shadow: 0 4px 12px rgba(42,47,41,.06);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .slot-card[contenteditable="true"] {
            cursor: text;
            outline: none;
        }

        .slot-card[contenteditable="true"]:focus {
            border-color: rgba(127,184,63,.62);
            box-shadow: 0 0 0 3px rgba(127,184,63,.14), 0 4px 12px rgba(42,47,41,.06);
            background: #fff;
        }

        .slot-card[contenteditable="true"]:empty::before {
            content: attr(data-placeholder);
            color: #a1a79b;
        }

        .arrow {
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 9px solid var(--rail);
        }

        .ladder-canvas-wrap {
            position: relative;
            min-height: 420px;
            padding: 0 46px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ladder-token {
            position: absolute;
            width: 70px;
            height: 70px;
            padding: 7px;
            border: 1px solid rgba(127,184,63,.26);
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 24%, rgba(255,255,255,.98) 0 18%, transparent 19%),
                linear-gradient(150deg, #ffffff 0%, #eef7e4 100%);
            object-fit: contain;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: drop-shadow(0 8px 12px rgba(42,47,41,.22));
            transition: none;
            z-index: 4;
        }

        .bottom .slot-card {
            min-height: 48px;
            color: var(--accent-dark);
        }

        .roulette-stage {
            display: grid;
            grid-template-columns: minmax(360px, 1fr) 320px;
            gap: 24px;
            align-items: center;
            min-height: calc(100vh - 250px);
            padding: 12px 8px 0;
        }

        .wheel-area {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 560px;
        }

        .wheel-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 17px solid transparent;
            border-right: 17px solid transparent;
            border-top: 31px solid var(--highlight);
            z-index: 4;
            filter: drop-shadow(0 4px 4px rgba(42,47,41,.2));
        }

        #roulette-canvas {
            width: min(560px, 90vw);
            height: min(560px, 90vw);
            max-width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #fff;
            box-shadow: inset 0 0 0 12px rgba(255,255,255,.75), 0 18px 40px rgba(42,47,41,.14);
            transition: transform 4s cubic-bezier(.12,.68,.11,1);
        }

        .wheel-center {
            position: absolute;
            left: 50%;
            top: 50%;
            display: grid;
            place-items: center;
            width: 92px;
            height: 92px;
            border: 7px solid var(--accent-soft);
            border-radius: 50%;
            background: #fff;
            transform: translate(-50%, -50%);
            z-index: 3;
            box-shadow: 0 9px 20px rgba(42,47,41,.16);
        }

        .wheel-center img {
            width: 68px;
            height: 68px;
            object-fit: contain;
        }

        .winner-box {
            display: grid;
            justify-items: center;
            align-content: center;
            min-height: 360px;
            padding: 22px;
            border: 1px solid rgba(127,184,63,.2);
            border-radius: 12px;
            background: linear-gradient(180deg, #fff 0%, #fbfcf8 100%);
        }

        .winner-box img {
            width: 122px;
            height: 122px;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(42,47,41,.14));
        }

        .winner-label {
            margin-top: 14px;
            color: var(--accent-dark);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: .06em;
        }

        .winner-name {
            margin-top: 4px;
            max-width: 100%;
            color: var(--ink);
            font-size: 34px;
            font-weight: 900;
            line-height: 1.2;
            text-align: center;
            word-break: break-word;
        }

        .history {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
        }

        .chip {
            max-width: 100%;
            padding: 6px 10px;
            border-radius: 999px;
            background: #fff;
            color: var(--accent-dark);
            border: 1px solid rgba(127,184,63,.22);
            font-size: 12px;
            font-weight: 900;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .gacha-stage {
            position: relative;
            display: grid;
            grid-template-columns: 270px minmax(520px, 1fr);
            gap: 24px;
            align-items: stretch;
            min-height: calc(100vh - 250px);
            padding: 12px 8px 0;
        }

        .gacha-info {
            display: grid;
            align-content: start;
            gap: 14px;
        }

        .gacha-info-card {
            position: relative;
            overflow: hidden;
            padding: 18px 18px 20px;
            border: 1px solid rgba(127,184,63,.2);
            border-radius: 12px;
            background:
                linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(238,247,228,.82) 100%);
            box-shadow: inset 0 0 0 5px rgba(255,255,255,.45), 0 12px 24px rgba(42,47,41,.07);
        }

        .gacha-info-card::before,
        .gacha-info-card::after {
            content: "";
            position: absolute;
            width: 72px;
            height: 72px;
            border: 10px solid rgba(127,184,63,.12);
            border-radius: 50%;
            pointer-events: none;
        }

        .gacha-info-card::before { right: -28px; top: -24px; }
        .gacha-info-card::after { left: -34px; bottom: -34px; }

        .gacha-info-title {
            position: relative;
            margin: 0 0 12px;
            color: var(--accent-dark);
            font-size: 18px;
            font-weight: 900;
            text-align: center;
        }

        .gacha-info-list {
            position: relative;
            display: grid;
            gap: 9px;
            margin: 0;
            padding: 0;
            list-style: none;
            color: #4d5548;
            font-size: 13px;
            font-weight: 800;
            line-height: 1.45;
        }

        .gacha-info-list li {
            display: grid;
            grid-template-columns: 22px 1fr;
            gap: 8px;
            align-items: start;
        }

        .gacha-info-list b {
            display: grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 11px;
        }

        .gacha-status {
            position: relative;
            display: grid;
            gap: 8px;
            margin-top: 4px;
            padding: 14px;
            border-radius: 8px;
            background: rgba(42,47,41,.07);
        }

        .gacha-status-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: #566050;
            font-size: 13px;
            font-weight: 800;
        }

        .gacha-status-row strong {
            color: var(--highlight);
            font-size: 18px;
            line-height: 1;
        }

        .gacha-machine {
            position: relative;
            display: grid;
            grid-template-rows: auto auto minmax(360px, 1fr) 170px;
            gap: 12px;
            min-height: 620px;
            padding: 28px 34px 24px;
            border: 1px solid rgba(127,184,63,.22);
            border-radius: 18px;
            background:
                radial-gradient(circle at 15% 20%, rgba(255,255,255,.72) 0 7%, transparent 8%),
                radial-gradient(circle at 84% 18%, rgba(255,255,255,.58) 0 6%, transparent 7%),
                linear-gradient(180deg, #dfeecf 0%, #a9cb77 16%, #7fb83f 17%, #6da531 100%);
            box-shadow:
                inset 0 0 0 7px rgba(255,255,255,.28),
                inset 0 -26px 38px rgba(42,47,41,.12),
                0 18px 38px rgba(42,47,41,.13);
        }

        .gacha-machine::before {
            content: "";
            position: absolute;
            left: 36px;
            right: 36px;
            top: 18px;
            height: 56px;
            border-radius: 18px;
            background: linear-gradient(180deg, #95c85c 0%, #6fa937 100%);
            box-shadow: inset 0 4px 0 rgba(255,255,255,.26), 0 8px 16px rgba(42,47,41,.14);
            pointer-events: none;
        }

        .gacha-machine::after {
            content: "";
            position: absolute;
            left: 12%;
            right: 12%;
            bottom: 10px;
            height: 14px;
            border-radius: 999px;
            background: rgba(42,47,41,.18);
            filter: blur(5px);
            pointer-events: none;
        }

        .gacha-lights {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            gap: clamp(10px, 2vw, 22px);
            height: 40px;
            align-items: center;
            pointer-events: none;
        }

        .gacha-lights span {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255,255,255,.9);
            box-shadow: 0 0 14px rgba(255,255,255,.8), inset 0 -2px 0 rgba(127,184,63,.18);
        }

        .gacha-copy {
            position: relative;
            z-index: 1;
            max-width: 680px;
            justify-self: center;
            margin: 0;
            color: rgba(255,255,255,.9);
            font-size: 15px;
            font-weight: 900;
            line-height: 1.45;
            text-align: center;
            text-shadow: 0 2px 5px rgba(42,47,41,.2);
        }

        .gacha-bowl {
            position: relative;
            width: min(720px, 100%);
            aspect-ratio: 1.45 / .78;
            min-height: 390px;
            justify-self: center;
            align-self: stretch;
            border: 9px solid rgba(91,126,49,.78);
            outline: 5px solid rgba(255,255,255,.28);
            border-radius: 14px;
            background:
                linear-gradient(125deg, rgba(255,255,255,.9) 0 12%, transparent 12% 19%, rgba(255,255,255,.42) 19% 28%, transparent 28%),
                linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(238,247,228,.52) 100%);
            box-shadow:
                inset 0 0 0 7px rgba(255,255,255,.48),
                inset 0 -34px 44px rgba(42,47,41,.13),
                0 10px 22px rgba(42,47,41,.14);
            overflow: hidden;
        }

        .gacha-bowl::before {
            content: "";
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(255,255,255,.62);
            border-radius: 8px;
            box-shadow: inset 0 0 16px rgba(255,255,255,.42);
            z-index: 2;
            pointer-events: none;
        }

        .gacha-bowl::after {
            content: "";
            position: absolute;
            left: 12%;
            right: 12%;
            bottom: 22px;
            height: 38px;
            border-radius: 50%;
            background: rgba(42,47,41,.1);
            filter: blur(3px);
            z-index: 0;
        }

        .gacha-ball {
            position: absolute;
            display: grid;
            place-items: center;
            width: 106px;
            height: 106px;
            border: 1px solid rgba(255,255,255,.58);
            border-radius: 50%;
            background:
                radial-gradient(circle at 31% 22%, rgba(255,255,255,.95) 0 13%, transparent 14%),
                linear-gradient(180deg, var(--cap, rgba(127,184,63,.72)) 0 48%, rgba(255,255,255,.84) 49% 100%);
            box-shadow: 0 12px 18px rgba(42,47,41,.16);
            overflow: hidden;
            opacity: .93;
            z-index: 1;
        }

        .gacha-ball::before {
            content: "";
            position: absolute;
            inset: 0 0 50%;
            background: linear-gradient(135deg, rgba(255,255,255,.36), transparent 55%);
        }

        .gacha-ball::after {
            content: "";
            position: absolute;
            left: 6px;
            right: 6px;
            top: 47%;
            height: 5px;
            border-radius: 999px;
            background: rgba(255,255,255,.74);
            box-shadow: 0 1px 0 rgba(42,47,41,.08);
        }

        .gacha-ball img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 4px 5px rgba(42,47,41,.14));
            opacity: .72;
        }

        .gacha-ball.pick {
            left: 50%;
            top: 50%;
            z-index: 4;
            transform: translate3d(-50%, -50%, 0) scale(1);
            transform-origin: 50% 50%;
            backface-visibility: hidden;
            will-change: transform, opacity;
            animation: gacha-roll-out 1.95s linear both;
        }

        @keyframes gacha-roll-out {
            0% { transform: translate3d(-46%, -318%, 0) scale(.72) rotate(-420deg); opacity: 0; }
            6% { transform: translate3d(-43%, -298%, 0) scale(.76) rotate(-372deg); opacity: 1; }
            12% { transform: translate3d(-38%, -276%, 0) scale(.8) rotate(-324deg); }
            18% { transform: translate3d(-31%, -250%, 0) scale(.84) rotate(-270deg); }
            24% { transform: translate3d(-23%, -224%, 0) scale(.88) rotate(-216deg); }
            30% { transform: translate3d(-14%, -198%, 0) scale(.92) rotate(-160deg); }
            36% { transform: translate3d(-6%, -172%, 0) scale(.95) rotate(-104deg); }
            42% { transform: translate3d(1%, -146%, 0) scale(.98) rotate(-48deg); }
            48% { transform: translate3d(7%, -121%, 0) scale(1) rotate(12deg); }
            54% { transform: translate3d(10%, -98%, 0) scale(1.01) rotate(72deg); }
            60% { transform: translate3d(8%, -79%, 0) scale(1.01) rotate(132deg); }
            66% { transform: translate3d(2%, -65%, 0) scale(1) rotate(192deg); }
            72% { transform: translate3d(-8%, -56%, 0) scale(1) rotate(252deg); }
            78% { transform: translate3d(-21%, -50%, 0) scale(1) rotate(312deg); }
            84% { transform: translate3d(-35%, -47%, 0) scale(1) rotate(372deg); }
            90% { transform: translate3d(-49%, -49%, 0) scale(1) rotate(432deg); }
            95% { transform: translate3d(-55%, -56%, 0) scale(.99) rotate(486deg); }
            100% { transform: translate3d(-50%, -50%, 0) scale(1) rotate(520deg); opacity: 1; }
        }

        .gacha-dock {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 142px;
            width: min(420px, 72%);
            justify-self: center;
            border: 0;
            border-radius: 18px 18px 10px 10px;
            background:
                radial-gradient(circle at 50% -20%, rgba(255,255,255,.92) 0 36%, transparent 37%),
                linear-gradient(180deg, #cdeaa8 0%, #83b948 100%);
            box-shadow: inset 0 5px 0 rgba(255,255,255,.25), 0 10px 18px rgba(42,47,41,.18);
        }

        .gacha-dock::before {
            content: "";
            position: absolute;
            top: -20px;
            left: 50%;
            width: 92px;
            height: 30px;
            border: 1px solid rgba(255,255,255,.38);
            border-bottom: 0;
            border-radius: 10px 10px 0 0;
            background: linear-gradient(180deg, #e8f6d8 0%, #b8dc8e 100%);
            transform: translateX(-50%);
        }

        .gacha-dock::after {
            content: "";
            position: absolute;
            left: 50%;
            top: -34px;
            width: 42px;
            height: 34px;
            border-left: 1px solid rgba(255,255,255,.34);
            border-right: 1px solid rgba(255,255,255,.34);
            background: rgba(238,247,228,.72);
            transform: translateX(-50%);
        }

        .gacha-lever {
            position: absolute;
            right: max(28px, calc(50% - 452px));
            bottom: 54px;
            z-index: 5;
            display: grid;
            justify-items: center;
            gap: 8px;
            width: 112px;
            border: 0;
            background: transparent;
            color: var(--accent-dark);
            font-weight: 900;
        }

        .lever-arm {
            position: relative;
            width: 88px;
            height: 88px;
            border-radius: 999px;
            background:
                radial-gradient(circle at 34% 26%, rgba(255,255,255,.72) 0 12%, transparent 13%),
                conic-gradient(from 40deg, #f4d85d, #dca62b, #fff0a3, #c98b1f, #f4d85d);
            transform-origin: 50% 50%;
            transition: transform .18s ease;
            box-shadow: inset 0 4px 0 rgba(255,255,255,.32), 0 7px 15px rgba(42,47,41,.2);
        }

        .lever-arm::before {
            content: "뽑기";
            position: absolute;
            left: 50%;
            top: 50%;
            display: grid;
            place-items: center;
            width: 54px;
            height: 54px;
            border: 3px solid rgba(255,255,255,.46);
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 24%, rgba(255,255,255,.86) 0 14%, transparent 15%),
                linear-gradient(150deg, #f7e97c 0%, #d59a23 100%);
            transform: translate(-50%, -50%);
            box-shadow: inset 0 -4px 0 rgba(42,47,41,.08);
            color: #6c4b13;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0;
        }

        .lever-base {
            width: 62px;
            height: 34px;
            border: 0;
            border-radius: 999px;
            background: rgba(42,47,41,.18);
            box-shadow: inset 0 2px 5px rgba(42,47,41,.14);
        }

        .gacha-lever.pulling .lever-arm {
            animation: lever-pull .9s ease both;
        }

        .gacha-lever:disabled {
            cursor: not-allowed;
            opacity: .62;
        }

        @keyframes lever-pull {
            0% { transform: rotate(0deg); }
            45% { transform: rotate(190deg); }
            70% { transform: rotate(165deg); }
            100% { transform: rotate(360deg); }
        }

        .gacha-prize-modal {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            padding: 28px;
            border-radius: 12px;
            background: rgba(20, 22, 19, .68);
            backdrop-filter: blur(2px);
        }

        .gacha-prize-modal[hidden] {
            display: none !important;
        }

        .gacha-prize-card {
            display: grid;
            justify-items: center;
            width: min(360px, 92vw);
            padding: 26px 28px 24px;
            border-radius: 50%;
            aspect-ratio: 1;
            background:
                repeating-conic-gradient(from 0deg, rgba(255,255,255,.4) 0 10deg, rgba(238,247,228,.72) 10deg 20deg),
                radial-gradient(circle, #fff 0%, #eef7e4 68%, #d9efbf 100%);
            box-shadow: 0 20px 55px rgba(0,0,0,.28), inset 0 0 0 8px rgba(255,255,255,.58);
            animation: gacha-prize-pop .34s cubic-bezier(.18,.82,.24,1.18) both;
        }

        @keyframes gacha-prize-pop {
            0% { transform: scale(.72); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .gacha-prize-card .gacha-ball {
            position: relative;
            left: auto;
            top: auto;
            width: 148px;
            height: 148px;
            margin: 6px 0 10px;
            transform: none;
        }

        .gacha-prize-card .gacha-ball img {
            width: 82px;
            height: 82px;
            opacity: .82;
        }

        .gacha-prize-title {
            margin-top: 2px;
            color: var(--accent-dark);
            font-size: 26px;
            font-weight: 900;
            text-align: center;
        }

        .gacha-prize-name {
            max-width: 78%;
            margin-top: 6px;
            color: var(--ink);
            font-size: 30px;
            font-weight: 900;
            line-height: 1.15;
            text-align: center;
            word-break: break-word;
        }

        .gacha-confirm {
            margin-top: 16px;
            min-width: 86px;
            min-height: 42px;
            border: 0;
            border-radius: 8px;
            background: #fff;
            color: var(--accent-dark);
            font-weight: 900;
            box-shadow: 0 8px 18px rgba(42,47,41,.14);
        }

        .pinball-stage {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 220px;
            gap: 0;
            align-items: stretch;
            min-height: calc(100vh - 250px);
            padding: 0;
            border: 1px solid rgba(127,184,63,.24);
            border-radius: 14px;
            background:
                radial-gradient(circle at 58% 48%, rgba(127,184,63,.14) 0 16%, transparent 40%),
                linear-gradient(180deg, #10140e 0%, #070907 100%);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 16px 36px rgba(42,47,41,.14);
            overflow: hidden;
        }

        .pinball-stage::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: radial-gradient(circle at 50% 46%, black 0 48%, transparent 76%);
            pointer-events: none;
        }

        .pinball-stage::after {
            content: "";
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 80px rgba(0,0,0,.72);
            pointer-events: none;
        }

        .pinball-machine {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 520px;
            padding: 20px;
            background: transparent;
            overflow: visible;
            z-index: 1;
        }

        .pinball-machine::before {
            content: "";
            position: absolute;
            left: 16px;
            top: 16px;
            width: 180px;
            height: 112px;
            border: 1px solid rgba(127,184,63,.42);
            border-radius: 8px;
            background:
                linear-gradient(180deg, rgba(127,184,63,.18), rgba(255,255,255,.04)),
                #272d25;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 10px 24px rgba(0,0,0,.26);
            opacity: .95;
        }

        .pinball-machine::after {
            content: "MAP";
            position: absolute;
            left: 26px;
            top: 24px;
            color: rgba(238,247,228,.82);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .08em;
            pointer-events: none;
        }

        .pinball-canvas-wrap {
            position: relative;
            width: min(720px, 100%);
            aspect-ratio: 1.25 / .82;
            min-height: 430px;
            border: 1px solid rgba(127,184,63,.26);
            border-radius: 10px;
            background:
                radial-gradient(circle at 50% 45%, rgba(127,184,63,.1), transparent 52%),
                #111611;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.045), 0 18px 34px rgba(0,0,0,.28);
            overflow: hidden;
            z-index: 2;
        }

        .pinball-canvas-wrap::before {
            content: "";
            position: absolute;
            left: 18px;
            right: 18px;
            top: 16px;
            height: 1px;
            border-radius: 999px;
            background: rgba(255,255,255,.28);
            box-shadow: 0 24px 0 rgba(255,255,255,.08);
            z-index: 1;
            pointer-events: none;
        }

        #pinball-canvas {
            width: 100%;
            height: 100%;
        }

        .pinball-deco {
            position: absolute;
            z-index: 3;
            display: grid;
            place-items: center;
            width: 68px;
            height: 68px;
            border: 1px solid rgba(127,184,63,.36);
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 24%, rgba(255,255,255,.96) 0 18%, transparent 19%),
                linear-gradient(150deg, #ffffff 0%, #eef7e4 100%);
            box-shadow: 0 0 22px rgba(127,184,63,.22), 0 12px 22px rgba(0,0,0,.28);
            pointer-events: none;
        }

        .pinball-deco img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .pinball-deco.one {
            left: 42px;
            bottom: 36px;
            transform: rotate(-8deg);
        }

        .pinball-deco.two {
            right: 250px;
            top: 42px;
            width: 58px;
            height: 58px;
            opacity: .92;
            transform: rotate(9deg);
        }

        .pinball-deco.two img {
            width: 42px;
            height: 42px;
        }

        .pinball-deco.three {
            left: 224px;
            top: 42px;
            width: 48px;
            height: 48px;
            opacity: .72;
            transform: rotate(-16deg);
        }

        .pinball-deco.three img {
            width: 35px;
            height: 35px;
        }

        .pinball-entry-panel {
            position: absolute;
            left: 18px;
            bottom: 18px;
            z-index: 5;
            display: grid;
            gap: 6px;
            width: 250px;
            padding: 10px;
            border: 1px solid rgba(127,184,63,.34);
            border-radius: 8px;
            background: rgba(238,247,228,.82);
            box-shadow: 0 12px 24px rgba(0,0,0,.22);
        }

        .pinball-entry-panel label {
            color: #4f7f25;
            font-size: 12px;
            font-weight: 900;
        }

        .pinball-entry-panel textarea {
            min-height: 76px;
            padding: 8px;
            border: 1px solid rgba(42,47,41,.16);
            border-radius: 6px;
            background: rgba(255,255,255,.92);
            color: var(--ink);
            font-size: 13px;
            line-height: 1.42;
            resize: none;
        }

        .pinball-mini-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .pinball-mini-actions button,
        .pinball-rank-control button {
            min-height: 30px;
            border: 1px solid rgba(127,184,63,.28);
            border-radius: 6px;
            background: #fff;
            color: #4f7f25;
            font-size: 12px;
            font-weight: 900;
        }

        .pinball-rank-control {
            display: grid;
            gap: 7px;
            width: 100%;
            margin-top: 4px;
            padding: 9px;
            border: 1px solid rgba(127,184,63,.22);
            border-radius: 8px;
            background: rgba(255,255,255,.06);
        }

        .pinball-rank-control span {
            color: #eef7e4;
            font-size: 13px;
            font-weight: 900;
        }

        .pinball-rank-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .pinball-rank-list {
            display: grid;
            gap: 4px;
            width: 100%;
            margin-top: 8px;
            color: rgba(238,247,228,.92);
            font-size: 12px;
            font-weight: 800;
        }

        .pinball-rank-list div {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 6px;
            align-items: center;
            min-width: 0;
        }

        .pinball-rank-list b {
            color: var(--accent);
        }

        .pinball-rank-list span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .marble-roulette-frame {
            position: relative;
            min-height: calc(100vh - 205px);
            border: 1px solid rgba(127,184,63,.24);
            border-radius: 14px;
            background: #070907;
            box-shadow: 0 16px 36px rgba(42,47,41,.14);
            overflow: hidden;
        }

        .marble-roulette-frame iframe {
            display: block;
            width: 100%;
            height: calc(100vh - 205px);
            min-height: 620px;
            border: 0;
            background: #070907;
        }

        .pinball-result {
            position: relative;
            z-index: 2;
            display: grid;
            justify-items: start;
            align-content: start;
            gap: 8px;
            min-height: auto;
            padding: 22px 18px;
            border-left: 1px solid rgba(127,184,63,.18);
            background: linear-gradient(180deg, rgba(10,13,9,.74) 0%, rgba(10,13,9,.46) 100%);
        }

        .pinball-marble {
            display: grid;
            place-items: center;
            width: 76px;
            height: 76px;
            margin-bottom: 6px;
            border: 1px solid rgba(127,184,63,.24);
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 24%, rgba(255,255,255,.98) 0 18%, transparent 19%),
                linear-gradient(150deg, #ffffff 0%, #eef7e4 100%);
            box-shadow: 0 10px 20px rgba(0,0,0,.3);
        }

        .pinball-marble img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }

        .pinball-result .winner-label {
            margin-top: 2px;
            color: var(--accent);
        }

        .pinball-result .winner-name {
            color: #fff;
            font-size: 30px;
            text-align: left;
        }

        .pinball-result .history {
            justify-content: flex-start;
        }

        .pinball-result .chip {
            background: rgba(255,255,255,.08);
            color: #eef7e4;
            border-color: rgba(127,184,63,.28);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(30, 34, 29, .34);
            backdrop-filter: blur(6px);
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal {
            width: min(720px, 100%);
            max-height: min(760px, calc(100vh - 36px));
            overflow-y: auto;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 24px 70px rgba(30,34,29,.28);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
        }

        .modal-title {
            font-size: 19px;
            font-weight: 900;
        }

        .modal-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 18px 20px 20px;
        }

        .field {
            min-width: 0;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: #4b5347;
            font-size: 13px;
            font-weight: 900;
        }

        textarea {
            width: 100%;
            min-height: 230px;
            resize: vertical;
            padding: 12px;
            border: 1px solid rgba(42,47,41,.13);
            border-radius: 10px;
            outline: none;
            color: var(--ink);
            background: #fff;
            line-height: 1.55;
        }

        textarea:focus {
            border-color: rgba(127,184,63,.62);
            box-shadow: 0 0 0 3px rgba(127,184,63,.14);
        }

        .modal-foot {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 0 20px 20px;
        }

        .result-list {
            display: grid;
            gap: 8px;
            padding: 18px 20px 20px;
        }

        .result-item {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            align-items: center;
            min-height: 42px;
            padding: 9px 12px;
            border-radius: 12px;
            background: var(--accent-soft);
            color: #4d5549;
            font-weight: 900;
        }

        .result-item span,
        .result-item b {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .result-item b {
            color: var(--accent-dark);
            text-align: right;
        }

        @media (max-width: 980px) {
            .page { padding: 16px 12px 24px; }
            .top,
            .stage-toolbar,
            .roulette-stage,
            .gacha-stage,
            .pinball-stage {
                grid-template-columns: 1fr;
            }

            .stage-toolbar {
                justify-items: center;
            }

            .toolbar-actions {
                justify-content: center;
                flex-wrap: wrap;
            }

            .play-stage {
                min-height: calc(100vh - 150px);
                padding: 20px 14px;
                border-radius: 20px;
            }

            .slot-row,
            .ladder-canvas-wrap {
                padding-left: 12px;
                padding-right: 12px;
                gap: 12px;
            }

            .avatar {
                width: 58px;
                height: 58px;
            }

            .slot-card {
                min-height: 42px;
                font-size: 14px;
            }

            .gacha-machine,
            .wheel-area,
            .pinball-machine {
                min-height: 430px;
            }

            .gacha-machine {
                min-height: 560px;
                padding: 26px 18px 20px;
            }

            .gacha-info {
                grid-template-columns: 1fr 1fr;
            }

            .gacha-bowl {
                min-height: 330px;
            }

            .gacha-copy {
                font-size: 13px;
            }

            .pinball-machine {
                padding: 20px 14px 18px;
            }

            .pinball-canvas-wrap {
                min-height: 380px;
            }

            .pinball-deco.one {
                left: 22px;
                bottom: 28px;
            }

            .pinball-deco.two {
                right: 24px;
                top: 52px;
            }

            .pinball-deco.three {
                display: none;
            }

            .gacha-lever {
                right: 16px;
                bottom: 42px;
                width: 94px;
            }

            .lever-arm {
                width: 76px;
                height: 76px;
            }

            .modal-body {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            h1 { font-size: 28px; }

            .mode-tabs,
            .toolbar-actions {
                width: 100%;
            }

            .mode-btn,
            .action-btn {
                flex: 1;
            }

            .counter {
                gap: 18px;
            }

            .slot-row {
                grid-template-columns: repeat(var(--cols), minmax(62px, 1fr));
                gap: 8px;
            }

            .avatar {
                width: 46px;
                height: 46px;
            }

            .slot-card {
                width: 100%;
                padding: 0 6px;
                font-size: 12px;
            }

            .gacha-ball {
                width: 76px;
                height: 76px;
            }

            .gacha-ball img {
                width: 42px;
                height: 42px;
            }

            .gacha-machine {
                min-height: 520px;
                padding: 22px 12px 16px;
                grid-template-rows: auto auto minmax(300px, 1fr) 142px;
            }

            .gacha-info {
                grid-template-columns: 1fr;
            }

            .gacha-bowl {
                min-height: 300px;
                aspect-ratio: 1 / .92;
            }

            .pinball-canvas-wrap {
                min-height: 330px;
            }

            .pinball-deco {
                width: 48px;
                height: 48px;
            }

            .pinball-deco img {
                width: 34px;
                height: 34px;
            }

            .gacha-lever {
                right: 12px;
                bottom: 36px;
                width: 82px;
                margin: 0;
            }

            .lever-arm {
                width: 68px;
                height: 68px;
            }

            .lever-arm::before {
                width: 44px;
                height: 44px;
                font-size: 10px;
            }

            .gacha-dock {
                width: 68%;
                min-height: 118px;
            }

            .gacha-prize-card {
                width: min(310px, 92vw);
            }

            .gacha-prize-card .gacha-ball {
                width: 122px;
                height: 122px;
            }

            .gacha-prize-name {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="top">
            <div>
                <div class="eyebrow">BEADYO PLAY</div>
                <h1>GAME</h1>
            </div>
            <nav class="mode-tabs" aria-label="게임 선택">
                <button class="mode-btn active" type="button" data-mode="ladder" onclick="switchMode('ladder')">
                    <svg viewBox="0 0 24 24"><path d="M7 3v18M17 3v18M7 8h10M7 14h10"/></svg>
                    사다리
                </button>
                <button class="mode-btn" type="button" data-mode="roulette" onclick="switchMode('roulette')">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M6 6l12 12M18 6 6 18"/></svg>
                    룰렛
                </button>
                <button class="mode-btn" type="button" data-mode="gacha" onclick="switchMode('gacha')">
                    <svg viewBox="0 0 24 24"><path d="M7 8a5 5 0 0 1 10 0"/><rect x="5" y="8" width="14" height="12" rx="3"/><path d="M8 14h8M12 11v6"/></svg>
                    뽑기
                </button>
                <button class="mode-btn" type="button" data-mode="pinball" onclick="switchMode('pinball')">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M6 9h12M7 9l2 12M17 9l-2 12M9 15h6M8 21h8"/></svg>
                    핀볼
                </button>
            </nav>
        </header>

        <section class="game-panel active" id="ladder-panel">
            <div class="play-stage">
                <div class="stage-toolbar">
                    <div></div>
                    <div class="counter" aria-label="참가자 수">
                        <button class="icon-btn" type="button" onclick="changeCount(-1)" aria-label="참가자 줄이기">
                            <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <span class="count-num" id="ladder-count">참가자 4명</span>
                        <button class="icon-btn" type="button" onclick="changeCount(1)" aria-label="참가자 늘리기">
                            <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                    <div class="toolbar-actions">
                        <button class="action-btn green" type="button" onclick="runLadder(0)">
                            <svg viewBox="0 0 24 24"><path d="m5 3 14 9-14 9V3z"/></svg>
                            START
                        </button>
                        <button class="action-btn" type="button" onclick="showLadderResults()">
                            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
                            결과보기
                        </button>
                        <button class="action-btn reset" type="button" onclick="resetLadder()">
                            초기화
                        </button>
                    </div>
                </div>

                <div class="ladder-board" id="ladder-board">
                    <div class="slot-row top" id="ladder-top"></div>
                    <div class="ladder-canvas-wrap" id="ladder-wrap">
                        <canvas id="ladder-canvas"></canvas>
                        <img class="ladder-token" id="ladder-token" src="game-assets/gobookticon/gobook-01.png" alt="" hidden>
                    </div>
                    <div class="slot-row bottom" id="ladder-bottom"></div>
                </div>
            </div>
        </section>

        <section class="game-panel" id="roulette-panel">
            <div class="play-stage">
                <div class="stage-toolbar">
                    <div></div>
                    <div class="counter" aria-label="후보 수">
                        <button class="icon-btn" type="button" onclick="changeRouletteCount(-1)" aria-label="후보 줄이기">

    <script>
        const ASSETS = Array.from({ length: 19 }, (_, i) => `game-assets/gobookticon/gobook-${String(i + 1).padStart(2, '0')}.png`);
        const colors = ['#7fb83f', '#5b8fc7', '#c69c3a', '#54a99f', '#9a7bc2', '#8ea65d', '#6f776b', '#9aa26f'];
        const defaultNames = ['구북이', '떼구르르', '비즈', '요정', '방울', '반짝', '하모니', '마블'];
        const defaultPrizes = ['당첨', '한 번 더', '꽝', '선물', '추천곡', '다시뽑기', '행운', '축하'];
        const ladder = { count: 4, names: [...defaultNames], prizes: [...defaultPrizes], rungs: [], mapping: [], paths: [], running: false };
        const roulette = { count: 4, names: [...defaultNames], rotation: 0, history: [], spinning: false };
        const gacha = { count: 8, names: [...defaultNames], history: [], drawing: false };
        const pinball = {
            count: 6,
            names: [...defaultNames],
            history: [],
            running: false,
            racers: [],
            ranking: [],
            selectedRank: 1,
            winnerIndex: null,
        };
        let settingsMode = 'ladder';

        function $(id) {
            return document.getElementById(id);
        }

        function cleanLines(value) {
            return String(value || '').split(/\n+/).map(v => v.trim()).filter(Boolean).slice(0, 16);
        }

        function cleanTokens(value) {
            return String(value || '')
                .split(/[,\n]+/)
                .map(v => v.trim())
                .filter(Boolean)
                .slice(0, 48);
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function shuffle(list) {
            const next = [...list];
            for (let i = next.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [next[i], next[j]] = [next[j], next[i]];
            }
            return next;
        }

        function switchMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
            document.querySelectorAll('.game-panel').forEach(panel => panel.classList.toggle('active', panel.id === `${mode}-panel`));
            requestAnimationFrame(() => {
                if (mode === 'ladder') drawLadder();
                if (mode === 'roulette') drawRoulette();
                if (mode === 'gacha') renderGacha();
            });
        }

        function visibleNames() {
            ensureListSize(ladder.names, defaultNames);
            return ladder.names.slice(0, ladder.count);
        }

        function visiblePrizes() {
            ensureListSize(ladder.prizes, defaultPrizes);
            return ladder.prizes.slice(0, ladder.count);
        }

        function ensureListSize(list, fallback) {
            for (let i = list.length; i < ladder.count; i++) {
                list[i] = fallback[i % fallback.length] || `${i + 1}`;
            }
        }

        function updateLadderSlots() {
            $('ladder-count').textContent = `참가자 ${ladder.count}명`;
            $('ladder-board').style.setProperty('--cols', ladder.count);
            const names = visibleNames();
            const prizes = visiblePrizes();
            $('ladder-top').innerHTML = names.map((name, i) => `
                <div class="slot" onclick="runLadder(${i})" title="출발">
                    <img class="avatar" src="${ASSETS[i % ASSETS.length]}" alt="">
                    <div class="slot-card" contenteditable="true" data-kind="name" data-index="${i}" data-placeholder="참가자" onclick="event.stopPropagation()">${escapeHtml(name)}</div>
                    <div class="arrow"></div>
                </div>
            `).join('');
            $('ladder-bottom').innerHTML = prizes.map((prize, i) => `
                <div class="slot">
                    <div class="slot-card" contenteditable="true" data-kind="prize" data-index="${i}" data-placeholder="결과">${escapeHtml(prize)}</div>
                </div>
            `).join('');
            bindEditableSlots();
        }

        function bindEditableSlots() {
            document.querySelectorAll('.slot-card[contenteditable="true"]').forEach(card => {
                card.addEventListener('input', handleSlotEdit);
                card.addEventListener('blur', handleSlotBlur);
                card.addEventListener('keydown', handleSlotKeydown);
            });
        }

        function handleSlotEdit(event) {
            const target = event.currentTarget;
            const index = Number(target.dataset.index);
            const value = target.textContent.trim();
            if (target.dataset.kind === 'name') ladder.names[index] = value || defaultNames[index % defaultNames.length];
            if (target.dataset.kind === 'prize') ladder.prizes[index] = value || defaultPrizes[index % defaultPrizes.length];
        }

        function handleSlotBlur(event) {
            const target = event.currentTarget;
            const index = Number(target.dataset.index);
            const fallback = target.dataset.kind === 'name' ? defaultNames[index % defaultNames.length] : defaultPrizes[index % defaultPrizes.length];
            const value = target.textContent.trim() || fallback;
            target.textContent = value;
            if (target.dataset.kind === 'name') ladder.names[index] = value;
            if (target.dataset.kind === 'prize') ladder.prizes[index] = value;
            drawLadder();
        }

        function handleSlotKeydown(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                event.currentTarget.blur();
            }
        }

        function changeCount(delta) {
            if (ladder.running) return;
            ladder.count = Math.max(2, Math.min(8, ladder.count + delta));
            resetLadder();
        }

        function makeRungs() {
            const rows = Math.max(11, ladder.count * 3);
            const rungs = [];
            for (let row = 0; row < rows; row++) {
                const used = new Set();
                for (let col = 0; col < ladder.count - 1; col++) {
                    if (used.has(col) || used.has(col - 1)) continue;
                    if (Math.random() < .46) {
                        rungs.push({ row, col });
                        used.add(col);
                        used.add(col + 1);
                    }
                }
            }
            if (!rungs.length) rungs.push({ row: Math.floor(rows / 2), col: 0 });
            return { rows, rungs };
        }

        function computeLadder(rows, rungs) {
            const byRow = new Map();
            rungs.forEach(r => {
                if (!byRow.has(r.row)) byRow.set(r.row, []);
                byRow.get(r.row).push(r.col);
            });
            ladder.mapping = [];
            ladder.paths = [];
            for (let start = 0; start < ladder.count; start++) {
                let col = start;
                const path = [{ row: -1, col }];
                for (let row = 0; row < rows; row++) {
                    const rowRungs = byRow.get(row) || [];
                    if (rowRungs.includes(col)) col += 1;
                    else if (rowRungs.includes(col - 1)) col -= 1;
                    path.push({ row, col });
                }
                ladder.mapping[start] = col;
                ladder.paths[start] = path;
            }
        }

        function resetLadder() {
            const made = makeRungs();
            ladder.rows = made.rows;
            ladder.rungs = made.rungs;
            computeLadder(ladder.rows, ladder.rungs);
            updateLadderSlots();
            $('ladder-token').hidden = true;
            drawLadder();
        }

        function fitCanvas(canvas, wrap) {
            const wrapRect = wrap.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const width = Math.max(320, canvasRect.width);
            const height = Math.max(360, wrapRect.height);
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            canvas.style.height = `${height}px`;
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            return { ctx, width, height };
        }

        function ladderMetrics(width, height) {
            const canvasRect = $('ladder-canvas').getBoundingClientRect();
            const slots = Array.from(document.querySelectorAll('#ladder-top .slot'));
            const xs = slots.slice(0, ladder.count).map(slot => {
                const rect = slot.getBoundingClientRect();
                return rect.left + rect.width / 2 - canvasRect.left;
            });
            const top = 24;
            const bottom = height - 24;
            const left = xs[0] ?? 28;
            const right = xs[xs.length - 1] ?? (width - 28);
            const gapX = ladder.count > 1 ? (right - left) / (ladder.count - 1) : 0;
            const gapY = ladder.rows > 0 ? (bottom - top) / ladder.rows : 0;
            return { top, bottom, left, right, gapX, gapY, xs };
        }

        function ladderX(metrics, col) {
            return metrics.xs[col] ?? (metrics.left + col * metrics.gapX);
        }

        function drawLadder(path = null) {
            const canvas = $('ladder-canvas');
            const wrap = $('ladder-wrap');
            const { ctx, width, height } = fitCanvas(canvas, wrap);
            const m = ladderMetrics(width, height);
            ctx.clearRect(0, 0, width, height);
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#6f776b';
            ctx.lineWidth = 4.5;

            for (let col = 0; col < ladder.count; col++) {
                const x = ladderX(m, col);
                ctx.beginPath();
                ctx.moveTo(x, m.top);
                ctx.lineTo(x, m.bottom);
                ctx.stroke();
            }

            ladder.rungs.forEach(r => {
                const y = m.top + (r.row + .5) * m.gapY;
                const x1 = ladderX(m, r.col);
                const x2 = ladderX(m, r.col + 1);
                ctx.beginPath();
                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
                ctx.stroke();
            });

            if (!path) return;
            ctx.strokeStyle = '#7fb83f';
            ctx.lineWidth = 8;
            ctx.beginPath();
            pathToPoints(path, width, height).forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();
        }

        function pathToPoints(path, width, height) {
            const m = ladderMetrics(width, height);
            const points = [];
            path.forEach((p, i) => {
                if (i === 0) points.push({ x: ladderX(m, p.col), y: m.top });
                const prev = path[i - 1];
                const y = i === path.length - 1 ? m.bottom : m.top + (p.row + .5) * m.gapY;
                if (prev) {
                    points.push({ x: ladderX(m, prev.col), y });
                    if (prev.col !== p.col) points.push({ x: ladderX(m, p.col), y });
                }
            });
            return points;
        }

        async function runLadder(index = 0) {
            if (ladder.running || !ladder.paths[index]) return;
            ladder.running = true;
            const path = ladder.paths[index];
            drawLadder(path);
            const token = $('ladder-token');
            token.src = ASSETS[index % ASSETS.length];
            token.hidden = false;
            const wrapRect = $('ladder-wrap').getBoundingClientRect();
            const canvasRect = $('ladder-canvas').getBoundingClientRect();
            const points = pathToPoints(path, canvasRect.width, canvasRect.height)
                .map(p => ({
                    x: canvasRect.left - wrapRect.left + p.x,
                    y: canvasRect.top - wrapRect.top + p.y,
                }));
            await moveLadderToken(token, points);
            ladder.running = false;
            showLadderResults();
        }

        function moveLadderToken(token, points) {
            if (!points.length) return Promise.resolve();
            token.style.left = `${points[0].x}px`;
            token.style.top = `${points[0].y}px`;
            if (points.length === 1) {
                return new Promise(resolve => setTimeout(resolve, 120));
            }

            const segments = [];
            let total = 0;
            for (let i = 1; i < points.length; i++) {
                const from = points[i - 1];
                const to = points[i];
                const length = Math.hypot(to.x - from.x, to.y - from.y);
                if (length < 1) continue;
                total += length;
                segments.push({ from, to, length, end: total });
            }
            if (!segments.length) return Promise.resolve();

            const duration = Math.max(900, Math.min(5200, total * .78));
            const start = performance.now();

            return new Promise(resolve => {
                function step(now) {
                    const t = Math.min(1, (now - start) / duration);
                    const eased = t < .08
                        ? t * (1 / .08) * t * (1 / .08) * .08
                        : t > .92
                            ? 1 - Math.pow((1 - t) * (1 / .08), 2) * .08
                            : t;
                    const target = total * eased;
                    const segment = segments.find(s => target <= s.end) || segments[segments.length - 1];
                    const startLength = segment.end - segment.length;
                    const local = segment.length ? (target - startLength) / segment.length : 1;
                    token.style.left = `${segment.from.x + (segment.to.x - segment.from.x) * local}px`;
                    token.style.top = `${segment.from.y + (segment.to.y - segment.from.y) * local}px`;
                    if (t < 1) requestAnimationFrame(step);
                    else resolve();
                }
                requestAnimationFrame(step);
            });
        }

        function showLadderResults() {
            const names = visibleNames();
            const prizes = visiblePrizes();
            $('result-list').innerHTML = names.map((name, i) => {
                const prize = prizes[ladder.mapping[i]] || '';
                return `<div class="result-item"><span>${escapeHtml(name)}</span><em>→</em><b>${escapeHtml(prize)}</b></div>`;
            }).join('');
            $('results-modal').classList.add('open');
        }

        function updateRoulette() {
            $('roulette-count').textContent = `후보 ${roulette.count}명`;
            drawRoulette();
        }

        function changeRouletteCount(delta) {
            if (roulette.spinning) return;
            roulette.count = Math.max(2, Math.min(12, roulette.count + delta));
            updateRoulette();
        }

        function visibleRouletteNames() {
            return roulette.names.slice(0, roulette.count);
        }

        function drawRoulette() {
            const canvas = $('roulette-canvas');
            const ctx = canvas.getContext('2d');
            const names = visibleRouletteNames();
            const size = canvas.width;
            const center = size / 2;
            const radius = size * .45;
            const slice = Math.PI * 2 / names.length;
            ctx.clearRect(0, 0, size, size);

            names.forEach((name, i) => {
                const start = -Math.PI / 2 + i * slice;
                const end = start + slice;
                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, start, end);
                ctx.closePath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,.78)';
                ctx.lineWidth = 6;
                ctx.stroke();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(start + slice / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff';
                ctx.font = names.length > 8 ? '800 26px Noto Sans KR, sans-serif' : '900 32px Noto Sans KR, sans-serif';
                ctx.shadowColor = 'rgba(0,0,0,.22)';
                ctx.shadowBlur = 3;
                const label = name.length > 8 ? name.slice(0, 7) + '…' : name;
                ctx.fillText(label, radius - 30, 0);
                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(center, center, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(42,47,41,.16)';
            ctx.lineWidth = 12;
            ctx.stroke();
        }

        function spinRoulette() {
            if (roulette.spinning) return;
            const names = visibleRouletteNames();
            if (names.length < 2) return;
            roulette.spinning = true;
            $('spin-btn').disabled = true;
            const winnerIndex = Math.floor(Math.random() * names.length);
            const sliceDeg = 360 / names.length;
            const target = winnerIndex * sliceDeg + sliceDeg / 2;
            const turns = 5 + Math.floor(Math.random() * 3);
            roulette.rotation += turns * 360 + (360 - target) + (Math.random() - .5) * Math.min(10, sliceDeg * .45);
            $('roulette-canvas').style.transform = `rotate(${roulette.rotation}deg)`;
            $('wheel-center-img').src = ASSETS[(winnerIndex + 2) % ASSETS.length];
            setTimeout(() => {
                const winner = names[winnerIndex];

        function parsePinballEntries(value) {
            const entries = [];
            cleanTokens(value).forEach(token => {
                const match = token.match(/^(.*?)\s*\*\s*(\d+)$/);
                const name = (match ? match[1] : token).trim();
                const amount = match ? Math.max(1, Math.min(20, Number(match[2]) || 1)) : 1;
                if (!name) return;
                for (let i = 0; i < amount; i++) entries.push(name);
            });
            return entries.slice(0, 36);
        }

        function pinballInputValue() {
            const input = $('pinball-entry-input');
            return input ? input.value : pinball.names.join(', ');
        }

        function visiblePinballNames() {
            const entries = parsePinballEntries(pinballInputValue());
            if (entries.length >= 2) {
                pinball.names = entries;
            }
            for (let i = pinball.names.length; i < 2; i++) {
                pinball.names[i] = defaultNames[i % defaultNames.length];
            }
            return pinball.names.slice(0, 36);
        }

        function uniquePinballNames(names = visiblePinballNames()) {
            return [...new Set(names)].slice(0, 12);
        }

        function updatePinballRankLabel() {
            const total = visiblePinballNames().length;
            pinball.selectedRank = Math.max(1, Math.min(total, pinball.selectedRank));
            const label = pinball.selectedRank === total ? '마지막' : `${pinball.selectedRank}번째`;
            $('pinball-rank-label').textContent = `당첨 순위: ${label}`;
        }

        function syncPinballWinnerFromRank() {
            if (pinball.running || !pinball.ranking.length) return;
            const names = visiblePinballNames();
            const unique = uniquePinballNames(names);
            const winner = pinball.ranking[pinball.selectedRank - 1] || pinball.ranking[0];
            const winnerIndex = names.indexOf(winner);
            pinball.winnerIndex = Math.max(0, unique.indexOf(winner));
            $('pinball-winner').textContent = winner;
            $('pinball-result-img').src = ASSETS[Math.max(0, winnerIndex) % ASSETS.length];
            $('pinball-history').innerHTML = pinball.history.map(name => `<span class="chip">${escapeHtml(name)}</span>`).join('');
            drawPinball();
        }

        function updatePinball() {
            const names = visiblePinballNames();
            pinball.count = names.length;
            $('pinball-count').textContent = `구슬 ${pinball.count}개`;
            updatePinballRankLabel();
            drawPinball();
        }

        function changePinballCount(delta) {
            if (pinball.running) return;
            const unique = uniquePinballNames();
            const next = Math.max(2, Math.min(12, unique.length + delta));
            pinball.names = defaultNames.slice(0, next);
            if ($('pinball-entry-input')) $('pinball-entry-input').value = pinball.names.join(', ');
            pinball.ranking = [];
