<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEADYO Games</title>
    <link rel="icon" href="logo-icon.webp">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"></noscript>
    <style>
        * { box-sizing: border-box; }

        :root {
            --accent: #7fb83f;
            --accent-dark: #4f7f25;
            --accent-soft: #eef7e4;
            --ink: #2b2f29;
            --muted: #74796f;
            --line: rgba(42, 47, 41, .1);
            --bg: #d8e0d2;
            --stage: #edf2e8;
            --rail: #6f776b;
            --rail-soft: #8b947f;
            --highlight: #c69c3a;
            --highlight-soft: #fff8e6;
            --blue: #5b8fc7;
            --gold: #c69c3a;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 18% 0%, rgba(127,184,63,.2) 0 260px, transparent 261px),
                linear-gradient(180deg, rgba(211,225,203,.96) 0%, rgba(216,224,210,0) 260px),
                var(--bg);
            color: var(--ink);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            min-height: 100vh;
            padding: 22px 28px 12px;
        }

        .top {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 16px;
            align-items: center;
            margin-bottom: 14px;
        }

        .eyebrow {
            color: var(--accent-dark);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: .08em;
        }

        h1 {
            margin: 1px 0 6px;
            font-size: 34px;
            line-height: 1.1;
            letter-spacing: 0;
        }

        .mode-tabs {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255,255,255,.8);
            box-shadow: 0 1px 3px rgba(42,47,41,.04);
        }

        .mode-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 38px;
            padding: 0 16px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #687061;
            font-weight: 900;
            white-space: nowrap;
        }

        .mode-btn.active {
            color: #fff;
            background: var(--accent);
            box-shadow: 0 5px 14px rgba(127,184,63,.28);
        }

        .mode-btn svg,
        .action-btn svg,
        .icon-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
        }

        .game-panel {
            display: none;
        }

        .game-panel.active {
            display: block;
        }

        .play-stage {
            position: relative;
            min-height: calc(100vh - 142px);
            padding: 28px 32px 26px;
            border-color: rgba(127,184,63,.2);
            border-radius: 12px;
            background:
                linear-gradient(180deg, rgba(255,255,255,.62) 0%, var(--stage) 100%);
            box-shadow: 0 10px 28px rgba(42,47,41,.06);
            overflow: hidden;
        }

        .stage-toolbar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        #gacha-panel .play-stage {
            padding-top: 18px;
            padding-bottom: 8px;
        }

        #gacha-panel .stage-toolbar {
            margin-bottom: 12px;
        }

        .counter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 4px;
            border: 1px solid rgba(127,184,63,.22);
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 4px 12px rgba(42,47,41,.05);
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--accent-dark);
            box-shadow: none;
        }

        .icon-btn:hover {
            background: var(--accent-soft);
        }

        .count-num {
            min-width: 96px;
            text-align: center;
            color: var(--ink);
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
        }

        .toolbar-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 0 18px;
            border: 1px solid rgba(127,184,63,.22);
            border-radius: 8px;
            background: #fff;
            color: #4d5549;
            font-weight: 900;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(42,47,41,.05);
        }

        .action-btn.reset {
            border-color: rgba(34,39,32,.12);
            background: #f7f8f4;
            color: #687061;
            box-shadow: 0 4px 12px rgba(42,47,41,.04);
        }

        .action-btn.reset:hover {
            border-color: rgba(127,184,63,.34);
            background: var(--accent-soft);
            color: var(--accent-dark);
        }

        .action-btn.green {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
            box-shadow: 0 8px 20px rgba(127,184,63,.22);
        }

        .ladder-board {
            --cols: 4;
            --slot-min: 92px;
            --slot-gap: 22px;
            --slot-pad: 46px;
            --avatar-size: 78px;
            --slot-font: 18px;
            --slot-card-height: 48px;
            --slot-card-pad: 12px;
            position: relative;
            display: grid;
            grid-template-rows: auto minmax(420px, 1fr) auto;
            gap: 12px;
            min-height: calc(100vh - 248px);
        }

        #ladder-panel .play-stage {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            height: calc(100vh - 134px);
            min-height: 0;
        }

        #ladder-panel .stage-toolbar {
            margin-bottom: 14px;
        }

        #ladder-panel .ladder-board {
            grid-template-rows: auto minmax(240px, 1fr) auto;
            height: 100%;
            min-height: 0;
            gap: 10px;
        }

        .slot-row {
            display: grid;
            grid-template-columns: repeat(var(--cols), minmax(var(--slot-min), 1fr));
            gap: var(--slot-gap);
            align-items: end;
            padding: 0 var(--slot-pad);
        }

        .slot {
            display: grid;
            justify-items: center;
            gap: 8px;
            min-width: 0;
        }

        .avatar {
            width: var(--avatar-size);
            height: var(--avatar-size);
            padding: 8px;
            border: 1px solid rgba(127,184,63,.24);
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 24%, rgba(255,255,255,.98) 0 18%, transparent 19%),
                linear-gradient(150deg, #ffffff 0%, #eef7e4 100%);
            object-fit: contain;
            box-shadow: 0 7px 16px rgba(42,47,41,.11);
            filter: drop-shadow(0 4px 7px rgba(42,47,41,.12));
        }

        .ladder-start {
            cursor: pointer;
            transition: transform .16s ease, box-shadow .16s ease;
        }

        .ladder-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 20px rgba(42,47,41,.13), 0 0 0 3px rgba(127,184,63,.14);
        }

        .slot-card {
            display: block;
            box-sizing: border-box;
            width: min(132px, 100%);
            height: var(--slot-card-height);
            padding: 0 var(--slot-card-pad);
            border: 1px solid rgba(34,39,32,.1);
            border-radius: 8px;
            background: #fff;
            color: #5b5f58;
            font-size: var(--slot-font);
            font-weight: 900;
            line-height: calc(var(--slot-card-height) - 2px);
            text-align: center;
            box-shadow: 0 4px 12px rgba(42,47,41,.06);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .slot-card[contenteditable="true"] {
            cursor: text;
            outline: none;
        }

        .slot-card[contenteditable="true"]:focus {
            border-color: rgba(127,184,63,.62);
            box-shadow: 0 0 0 3px rgba(127,184,63,.14), 0 4px 12px rgba(42,47,41,.06);
            background: #fff;
        }

        .slot-card[contenteditable="true"]:empty::before {
            content: attr(data-placeholder);
            color: #a1a79b;
        }

        .arrow {
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 9px solid var(--rail);
        }

        .ladder-canvas-wrap {
            position: relative;
            min-height: 420px;
            padding: 0 46px;
        }

        #ladder-panel .ladder-canvas-wrap {
            min-height: 240px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ladder-token {
            position: absolute;
            width: 70px;
            height: 70px;
            padding: 7px;
            border: 1px solid rgba(127,184,63,.26);
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 24%, rgba(255,255,255,.98) 0 18%, transparent 19%),
                linear-gradient(150deg, #ffffff 0%, #eef7e4 100%);
            object-fit: contain;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: drop-shadow(0 8px 12px rgba(42,47,41,.22));
            transition: none;
            z-index: 4;
        }

        .bottom .slot-card {
            color: var(--accent-dark);
        }

        .roulette-stage {
            display: grid;
            grid-template-columns: minmax(360px, 1fr) 320px;
            gap: 24px;
            align-items: center;
            min-height: calc(100vh - 250px);
            padding: 12px 8px 0;
        }

        .wheel-area {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 560px;
        }

        .wheel-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 17px solid transparent;
            border-right: 17px solid transparent;
            border-top: 31px solid var(--highlight);
            z-index: 4;
            filter: drop-shadow(0 4px 4px rgba(42,47,41,.2));
        }

        #roulette-canvas {
            width: min(560px, 90vw);
            height: min(560px, 90vw);
            max-width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #fffdf7;
            box-shadow: inset 0 0 0 12px rgba(255,255,255,.86), 0 18px 40px rgba(127,184,63,.16);
            transition: transform 4s cubic-bezier(.12,.68,.11,1);
        }

        .wheel-center {
            position: absolute;
            left: 50%;
            top: 50%;
            display: grid;
            place-items: center;
            width: 92px;
            height: 92px;
            padding: 0;
            border: 7px solid rgba(255,255,255,.88);
            border-radius: 50%;
            background:
                radial-gradient(circle at 34% 24%, rgba(255,255,255,.96) 0 18%, transparent 19%),
                linear-gradient(145deg, #ffffff 0%, #eef8e4 100%);
            transform: translate(-50%, -50%);
            z-index: 3;
            box-shadow: 0 9px 20px rgba(42,47,41,.14), 0 0 0 1px rgba(127,184,63,.2);
            cursor: pointer;
            transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
        }

        .wheel-center:hover {
            border-color: rgba(127,184,63,.46);
            box-shadow: 0 12px 24px rgba(42,47,41,.18), 0 0 0 4px rgba(127,184,63,.12);
        }

        .wheel-center:disabled {
            cursor: default;
            opacity: .72;
        }

        .wheel-center img {
            width: 76px;
            height: 76px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255,255,255,.72);
            object-fit: cover;
            clip-path: circle(50%);
            filter: drop-shadow(0 5px 8px rgba(42,47,41,.12));
        }

        .winner-box {
            display: grid;
            justify-items: center;
            align-content: center;
            min-height: 360px;
            padding: 22px;
            border: 1px solid rgba(127,184,63,.2);
            border-radius: 12px;
            background: linear-gradient(180deg, #fff 0%, #fbfcf8 100%);
        }

        .winner-box img {
            width: 122px;
            height: 122px;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(42,47,41,.14));
        }

        .winner-label {
            margin-top: 14px;
            color: var(--accent-dark);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: .06em;
        }

        .winner-name {
            margin-top: 4px;
            max-width: 100%;
            color: var(--ink);
            font-size: 34px;
            font-weight: 900;
            line-height: 1.2;
            text-align: center;
            word-break: break-word;
        }

        .history {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
        }

        .chip {
            max-width: 100%;
            padding: 6px 10px;
            border-radius: 999px;
            background: #fff;
            color: var(--accent-dark);
            border: 1px solid rgba(127,184,63,.22);
            font-size: 12px;
            font-weight: 900;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .gacha-stage {
            position: relative;
            display: block;
            max-width: 100%;
            margin: 0 auto;
            min-height: calc(100vh - 270px);
            padding: 0 8px;
        }

        .gacha-info {
            position: absolute;
            left: max(0px, calc(50% - 770px));
            top: 0;
            z-index: 3;
            display: grid;
            align-content: start;
            gap: 14px;
            width: clamp(220px, 16vw, 270px);
        }

        .gacha-info-card {
            position: relative;
            overflow: hidden;
            padding: 18px 18px 20px;
            border: 1px solid rgba(127,184,63,.2);
            border-radius: 12px;
            background:
                linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(238,247,228,.82) 100%);
            box-shadow: inset 0 0 0 5px rgba(255,255,255,.45), 0 12px 24px rgba(42,47,41,.07);
        }

        .gacha-info-card::before,
        .gacha-info-card::after {
            content: "";
            position: absolute;
            width: 72px;
            height: 72px;
            border: 10px solid rgba(127,184,63,.12);
            border-radius: 50%;
            pointer-events: none;
        }

        .gacha-info-card::before { right: -28px; top: -24px; }
        .gacha-info-card::after { left: -34px; bottom: -34px; }

        .gacha-info-title {
            position: relative;
            margin: 0 0 12px;
            color: var(--accent-dark);
            font-size: 18px;
            font-weight: 900;
            text-align: center;
        }

        .gacha-info-list {
            position: relative;
            display: grid;
            gap: 9px;
            margin: 0;
            padding: 0;
            list-style: none;
            color: #4d5548;
            font-size: 13px;
            font-weight: 800;
            line-height: 1.45;
        }

        .gacha-info-list li {
            display: grid;
            grid-template-columns: 22px 1fr;
            gap: 8px;
            align-items: start;
        }

        .gacha-info-list b {
            display: grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 11px;
        }

        .gacha-status {
            position: relative;
            display: grid;
            gap: 8px;
            margin-top: 4px;
            padding: 14px;
            border-radius: 8px;
            background: rgba(42,47,41,.07);
        }

        .gacha-status-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: #566050;
            font-size: 13px;
            font-weight: 800;
        }

        .gacha-status-row strong {
            color: var(--highlight);
            font-size: 18px;
            line-height: 1;
        }

        .gacha-machine {
            position: relative;
            display: grid;
            grid-template-rows: auto auto 170px;
            gap: 12px;
            width: min(clamp(720px, 44vw, 860px), calc(100% - 310px));
            max-width: 860px;
            margin: 0 auto;
            min-height: 0;
            padding: 0 30px 10px;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
        }

        .gacha-machine::before {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 8px;
            width: min(640px, 92%);
            height: 168px;
            border: 1px solid rgba(127,184,63,.24);
            border-radius: 18px;
            background:
                radial-gradient(circle at 50% -12%, rgba(255,255,255,.84) 0 16%, transparent 17%),
                linear-gradient(180deg, rgba(248,252,243,.96) 0%, rgba(220,239,196,.92) 46%, rgba(171,207,126,.92) 100%);
            box-shadow:
                inset 0 8px 16px rgba(255,255,255,.42),
                inset 0 -14px 18px rgba(79,127,37,.12),
                0 16px 26px rgba(42,47,41,.13),
                0 26px 28px rgba(42,47,41,.08);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .gacha-machine::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 140px;
            z-index: 0;
            width: 104px;
            height: 78px;
            border: 1px solid rgba(127,184,63,.22);
            border-radius: 18px 18px 8px 8px;
            background:
                linear-gradient(90deg, rgba(255,255,255,.5) 0 22%, transparent 23% 77%, rgba(255,255,255,.38) 78%),
                linear-gradient(180deg, rgba(238,247,228,.92) 0%, rgba(185,218,145,.9) 100%);
            box-shadow:
                inset 0 5px 0 rgba(255,255,255,.28),
                0 8px 14px rgba(42,47,41,.1);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .gacha-machine.dispensing::after {
            animation: gacha-chute-glow 1.65s ease both;
        }

        @keyframes gacha-chute-glow {
            0%, 100% {
                box-shadow:
                    inset 0 5px 0 rgba(255,255,255,.28),
                    0 8px 14px rgba(42,47,41,.1);
            }
            24%, 72% {
                box-shadow:
                    inset 0 5px 0 rgba(255,255,255,.38),
                    0 0 18px rgba(217,182,75,.34),
                    0 10px 18px rgba(42,47,41,.12);
            }
        }

        .gacha-lights {
            position: relative;
            z-index: 1;
            display: none;
            justify-content: center;
            gap: clamp(10px, 2vw, 22px);
            height: 0;
            align-items: center;
            pointer-events: none;
        }

        .gacha-lights span {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255,255,255,.9);
            box-shadow: 0 0 14px rgba(255,255,255,.8), inset 0 -2px 0 rgba(127,184,63,.18);
        }

        .gacha-copy {
            position: relative;
            z-index: 1;
            max-width: 680px;
            justify-self: center;
            margin: 0 0 -4px;
            color: var(--accent-dark);
            font-size: 16px;
            font-weight: 900;
            line-height: 1.45;
            text-align: center;
            text-shadow: none;
        }

        .gacha-bowl {
            position: relative;
            z-index: 1;
            width: clamp(460px, 28vw, 560px);
            aspect-ratio: 1 / 1;
            min-height: 0;
            justify-self: center;
            align-self: center;
            height: auto;
            border: 9px solid rgba(91,126,49,.78);
            outline: 5px solid rgba(255,255,255,.28);
            border-radius: 50%;
            background:
                radial-gradient(circle at 52% 78%, rgba(110,159,61,.22) 0 42%, transparent 43%),
                radial-gradient(circle at 23% 18%, rgba(255,255,255,.95) 0 13%, transparent 14%),
                radial-gradient(circle at 84% 17%, rgba(255,255,255,.55) 0 11%, transparent 12%),
                linear-gradient(128deg, rgba(255,255,255,.88) 0 12%, transparent 12% 20%, rgba(255,255,255,.38) 20% 30%, transparent 30%),
                linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(238,247,228,.52) 100%);
            box-shadow:
                inset 0 0 0 7px rgba(255,255,255,.48),
                inset 0 -34px 44px rgba(42,47,41,.14),
                inset 0 22px 38px rgba(255,255,255,.28),
                0 14px 28px rgba(42,47,41,.16);
            overflow: hidden;
        }

        .gacha-bowl::before {
            content: "";
            position: absolute;
            inset: 13px;
            border: 1px solid rgba(255,255,255,.62);
            border-radius: 50%;
            box-shadow: inset 0 0 22px rgba(255,255,255,.48);
            z-index: 2;
            pointer-events: none;
        }

        .gacha-bowl::after {
            content: "";
            position: absolute;
            left: 18%;
            right: 18%;
            bottom: 34px;
            height: 42px;
            border-radius: 50%;
            background: rgba(42,47,41,.1);
            filter: blur(3px);
            z-index: 0;
        }

        .gacha-ball {
            position: absolute;
            display: grid;
            place-items: center;
            width: var(--gacha-ball-size, 106px);
            height: var(--gacha-ball-size, 106px);
            --rest-rotate: 0deg;
            --mix-x1: 80px;
            --mix-y1: -70px;
            --mix-x2: -110px;
            --mix-y2: 90px;
            --mix-x3: 130px;
            --mix-y3: 40px;
            --mix-rotate: 180deg;
            border: 1px solid rgba(255,255,255,.58);
            border-radius: 50%;
            background:
                radial-gradient(circle at 31% 22%, rgba(255,255,255,.95) 0 13%, transparent 14%),
                linear-gradient(180deg, var(--cap, rgba(127,184,63,.72)) 0 48%, rgba(255,255,255,.84) 49% 100%);
            box-shadow: 0 12px 18px rgba(42,47,41,.16);
            overflow: hidden;
            opacity: .93;
            z-index: 1;
            transform: rotate(var(--rest-rotate));
            transform-origin: 50% 50%;
        }

        .gacha-bowl.shuffling .gacha-ball {
            will-change: transform;
        }

        .gacha-ball::before {
            content: "";
            position: absolute;
            inset: 0 0 50%;
            background: linear-gradient(135deg, rgba(255,255,255,.36), transparent 55%);
        }

        .gacha-ball::after {
            content: "";
            position: absolute;
            left: max(3px, calc(var(--gacha-ball-size, 106px) * .057));
            right: max(3px, calc(var(--gacha-ball-size, 106px) * .057));
            top: 47%;
            height: max(3px, calc(var(--gacha-ball-size, 106px) * .047));
            border-radius: 999px;
            background: rgba(255,255,255,.74);
            box-shadow: 0 1px 0 rgba(42,47,41,.08);
        }

        .gacha-ball img {
            width: var(--gacha-img-size, 58px);
            height: var(--gacha-img-size, 58px);
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 4px 5px rgba(42,47,41,.14));
            opacity: .72;
        }

        .gacha-ball.pick {
            left: 50%;
            top: 50%;
            z-index: 4;
            transform: translate3d(-50%, -50%, 0) scale(1);
            transform-origin: 50% 50%;
            backface-visibility: hidden;
            will-change: transform, opacity;
            animation:
                gacha-roll-out 1.82s cubic-bezier(.18, .82, .22, 1) both,
                gacha-roll-fade .22s ease-out both;
        }

        @keyframes gacha-roll-out {
            0% {
                transform: translate3d(-50%, -438%, 0) scale(.74) rotate(-520deg);
            }
            100% {
                transform: translate3d(-50%, -50%, 0) scale(1) rotate(360deg);
            }
        }

        @keyframes gacha-roll-fade {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .gacha-dock {
            position: relative;
            z-index: 2;
            display: grid;
            place-items: center;
            width: 148px;
            height: 148px;
            min-height: 0;
            justify-self: center;
            align-self: center;
            border: 8px solid #5f8e34;
            border-radius: 50%;
            background:
                radial-gradient(circle at 48% 42%, rgba(255,255,255,.62) 0 32%, rgba(202,228,171,.44) 33% 58%, transparent 59%),
                conic-gradient(from -35deg, #4f7f25 0 24deg, #d9b64b 25deg 43deg, #4f7f25 44deg 68deg, #d9b64b 69deg 86deg, #4f7f25 87deg 360deg),
                radial-gradient(circle, #e8f6d8 0 47%, #7fb83f 48% 56%, #4f7f25 57% 100%);
            box-shadow:
                inset 0 8px 14px rgba(255,255,255,.2),
                inset 0 -10px 15px rgba(56,91,29,.18),
                0 8px 16px rgba(42,47,41,.16);
        }

        .gacha-machine.dispensing .gacha-dock {
            animation: gacha-dock-ready 1.65s ease both;
        }

        @keyframes gacha-dock-ready {
            0%, 100% { filter: none; }
            30%, 78% { filter: drop-shadow(0 0 12px rgba(217,182,75,.26)); }
        }

        .gacha-dock::before {
            content: "";
            position: absolute;
            inset: 18px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.22);
            background:
                linear-gradient(165deg, rgba(255,255,255,.58) 0 24%, transparent 25%),
                radial-gradient(circle at 58% 42%, rgba(255,255,255,.28), rgba(238,247,228,.32) 58%, rgba(79,127,37,.24) 100%);
            box-shadow: inset 0 0 12px rgba(56,91,29,.18);
            pointer-events: none;
        }

        .gacha-dock::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 18px;
            width: 58px;
            height: 8px;
            border-radius: 999px;
            background: rgba(255,255,255,.38);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .gacha-dock .winner-label {
            position: relative;
            z-index: 1;
            margin: 0;
            color: #fff8e6;
            font-size: 12px;
            letter-spacing: 0;
            text-shadow: 0 2px 4px rgba(56,91,29,.36);
        }

        .gacha-lever {
            position: absolute;
            left: calc(50% - clamp(250px, 17vw, 310px));
            right: auto;
            bottom: 26px;
            z-index: 3;
            display: grid;
            justify-items: center;
            gap: 6px;
            width: 148px;
            border: 0;
            background: transparent;
            color: var(--accent-dark);
            font-weight: 900;
        }

        .lever-arm {
            position: relative;
            width: 126px;
            height: 126px;
            border-radius: 999px;
            background:
                radial-gradient(circle at 35% 24%, rgba(255,255,255,.86) 0 15%, transparent 16%),
                radial-gradient(circle at 50% 50%, #fff8e6 0 39%, #d9b64b 40% 56%, transparent 57%),
                conic-gradient(from -18deg, #4f7f25 0 50deg, #eef7e4 51deg 80deg, #4f7f25 81deg 180deg, #eef7e4 181deg 214deg, #4f7f25 215deg 360deg);
            transform-origin: 50% 50%;
            transition: transform .18s ease;
            box-shadow:
                inset 0 5px 0 rgba(255,255,255,.32),
                inset 0 -6px 12px rgba(56,91,29,.2),
                0 8px 16px rgba(42,47,41,.22);
        }

        .lever-arm::before {
            content: "PUSH";
            position: absolute;
            left: 50%;
            top: 50%;
            display: grid;
            place-items: center;
            width: 82px;
            height: 82px;
            border: 6px solid rgba(127,184,63,.86);
            border-radius: 50%;
            background:
                radial-gradient(circle at 31% 24%, rgba(255,255,255,.84) 0 16%, transparent 17%),
                linear-gradient(150deg, #fff8e6 0%, #d9b64b 100%);
            transform: translate(-50%, -50%);
            box-shadow: inset 0 -5px 0 rgba(42,47,41,.1);
            color: #4f7f25;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0;
            text-shadow: 0 1px 0 rgba(255,255,255,.42);
        }

        .lever-arm::after {
            content: "GACHA";
            position: absolute;
            left: 50%;
            top: 7px;
            color: rgba(255,248,230,.9);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: .05em;
            transform: translateX(-50%);
        }

        .lever-base {
            display: none;
        }

        .gacha-lever.pulling .lever-arm {
            animation: lever-pull .9s ease both;
        }

        .gacha-lever:disabled {
            cursor: not-allowed;
            opacity: .62;
        }

        @keyframes lever-pull {
            0% { transform: rotate(0deg); }
            45% { transform: rotate(190deg); }
            70% { transform: rotate(165deg); }
            100% { transform: rotate(360deg); }
        }

        .gacha-prize-modal {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            padding: 28px;
            border-radius: 12px;
            background: rgba(20, 22, 19, .68);
            backdrop-filter: blur(2px);
        }

        .gacha-prize-modal[hidden] {
            display: none !important;
        }

        .gacha-prize-card {
            display: grid;
            justify-items: center;
            width: min(360px, 92vw);
            padding: 26px 28px 24px;
            border-radius: 50%;
            aspect-ratio: 1;
            background:
                repeating-conic-gradient(from 0deg, rgba(255,255,255,.4) 0 10deg, rgba(238,247,228,.72) 10deg 20deg),
                radial-gradient(circle, #fff 0%, #eef7e4 68%, #d9efbf 100%);
            box-shadow: 0 20px 55px rgba(0,0,0,.28), inset 0 0 0 8px rgba(255,255,255,.58);
            animation: gacha-prize-pop .34s cubic-bezier(.18,.82,.24,1.18) both;
        }

        @keyframes gacha-prize-pop {
            0% { transform: scale(.72); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .gacha-prize-card .gacha-ball {
            position: relative;
            left: auto;
            top: auto;
            width: 148px;
            height: 148px;
            margin: 6px 0 10px;
            transform: none;
        }

        .gacha-prize-card .gacha-ball img {
            width: 82px;
            height: 82px;
            opacity: .82;
        }

        .gacha-prize-title {
            margin-top: 2px;
            color: var(--accent-dark);
            font-size: 26px;
            font-weight: 900;
            text-align: center;
        }

        .gacha-prize-name {
            max-width: 78%;
            margin-top: 6px;
            color: var(--ink);
            font-size: 30px;
            font-weight: 900;
            line-height: 1.15;
            text-align: center;
            word-break: break-word;
        }

        .gacha-confirm {
            margin-top: 16px;
            min-width: 86px;
            min-height: 42px;
            border: 0;
            border-radius: 8px;
            background: #fff;
            color: var(--accent-dark);
            font-weight: 900;
            box-shadow: 0 8px 18px rgba(42,47,41,.14);
        }

        .marble-roulette-frame {
            position: relative;
            min-height: calc(100vh - 205px);
            border: 1px solid rgba(127,184,63,.24);
            border-radius: 14px;
            background: #070907;
            box-shadow: 0 16px 36px rgba(42,47,41,.14);
            overflow: hidden;
        }

        .marble-roulette-frame iframe {
            display: block;
            width: 100%;
            height: calc(100vh - 205px);
            min-height: 620px;
            border: 0;
            background: #070907;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(30, 34, 29, .34);
            backdrop-filter: blur(6px);
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal {
            width: min(720px, 100%);
            max-height: min(760px, calc(100vh - 36px));
            overflow-y: auto;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 24px 70px rgba(30,34,29,.28);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
        }

        .modal-title {
            font-size: 19px;
            font-weight: 900;
        }

        .modal-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 18px 20px 20px;
        }

        .field {
            min-width: 0;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: #4b5347;
            font-size: 13px;
            font-weight: 900;
        }

        textarea {
            width: 100%;
            min-height: 230px;
            resize: vertical;
            padding: 12px;
            border: 1px solid rgba(42,47,41,.13);
            border-radius: 10px;
            outline: none;
            color: var(--ink);
            background: #fff;
            line-height: 1.55;
        }

        textarea:focus {
            border-color: rgba(127,184,63,.62);
            box-shadow: 0 0 0 3px rgba(127,184,63,.14);
        }

        .modal-foot {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 0 20px 20px;
        }

        .result-list {
            display: grid;
            gap: 8px;
            padding: 10px 20px 20px;
        }

        .result-mascot {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px 2px;
            color: var(--accent-dark);
            font-size: 13px;
            font-weight: 900;
        }

        .result-mascot img {
            width: 48px;
            height: 42px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(42,47,41,.12));
        }

        .result-item {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            align-items: center;
            min-height: 42px;
            padding: 9px 12px;
            border-radius: 12px;
            background: var(--accent-soft);
            color: #4d5549;
            font-weight: 900;
        }

        .result-item span,
        .result-item b {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .result-item b {
            color: var(--accent-dark);
            text-align: right;
        }

        .game-toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            z-index: 80;
            max-width: min(420px, calc(100vw - 32px));
            padding: 12px 18px;
            border-radius: 999px;
            background: rgba(42,47,41,.92);
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            line-height: 1.35;
            text-align: center;
            box-shadow: 0 14px 32px rgba(42,47,41,.2);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 16px);
            transition: opacity .18s ease, transform .18s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .game-toast-sticker {
            width: 30px;
            height: 26px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .game-toast span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 980px) {
            .page { padding: 16px 12px 20px; }
            .top,
            .stage-toolbar,
            .roulette-stage {
                grid-template-columns: 1fr;
            }

            .stage-toolbar {
                justify-items: center;
            }

            .toolbar-actions {
                justify-content: center;
                flex-wrap: wrap;
            }

            .play-stage {
                min-height: calc(100vh - 150px);
                padding: 20px 14px;
                border-radius: 20px;
            }

            #ladder-panel .play-stage {
                height: calc(100vh - 116px);
                min-height: 0;
            }

            #ladder-panel .ladder-board {
                grid-template-rows: auto minmax(200px, 1fr) auto;
            }

            #ladder-panel .ladder-canvas-wrap {
                min-height: 200px;
            }

            .slot-row,
            .ladder-canvas-wrap {
                padding-left: 12px;
                padding-right: 12px;
                gap: 12px;
            }

            .avatar {
                width: 58px;
                height: 58px;
            }

            .slot-card {
                --slot-card-height: 42px;
                font-size: 14px;
            }

            .gacha-machine,
            .wheel-area {
                min-height: 430px;
            }

            .gacha-machine {
                min-height: 0;
                padding: 14px 12px 12px;
                grid-template-rows: auto auto 140px;
                width: min(620px, 100%);
            }

            .gacha-info {
                position: relative;
                left: auto;
                top: auto;
                width: 100%;
                max-width: 620px;
                margin: 0 auto 16px;
                grid-template-columns: 1fr 1fr;
            }

            .gacha-bowl {
                width: min(400px, 82vw);
            }

            .gacha-copy {
                font-size: 13px;
            }

            .gacha-lever {
                left: calc(50% - 220px);
                right: auto;
                bottom: 20px;
                width: 122px;
            }

            .lever-arm {
                width: 104px;
                height: 104px;
            }

            .lever-arm::before {
                width: 68px;
                height: 68px;
                font-size: 18px;
            }

            .gacha-dock {
                width: 126px;
                height: 126px;
            }

            .modal-body {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            h1 { font-size: 28px; }

            .mode-tabs,
            .toolbar-actions {
                width: 100%;
            }

            .mode-btn,
            .action-btn {
                flex: 1;
            }

            .counter {
                gap: 18px;
            }

            .slot-row {
                grid-template-columns: repeat(var(--cols), minmax(62px, 1fr));
                gap: 8px;
            }

            .avatar {
                width: 46px;
                height: 46px;
            }

            .slot-card {
                width: 100%;
                padding: 0 6px;
                font-size: 12px;
            }

            .gacha-ball {
                width: 62px;
                height: 62px;
            }

            .gacha-ball img {
                width: 34px;
                height: 34px;
            }

            .gacha-machine {
                min-height: 0;
                padding: 14px 10px 12px;
                grid-template-rows: auto auto 116px;
            }

            .gacha-info {
                grid-template-columns: 1fr;
            }

            .gacha-bowl {
                width: min(310px, 82vw);
                aspect-ratio: 1 / 1;
            }

            .gacha-lever {
                left: calc(50% - 142px);
                right: auto;
                bottom: 20px;
                width: 98px;
                margin: 0;
            }

            .lever-arm {
                width: 86px;
                height: 86px;
            }

            .lever-arm::before {
                width: 56px;
                height: 56px;
                border-width: 5px;
                font-size: 15px;
            }

            .gacha-dock {
                width: 98px;
                height: 98px;
            }

            .gacha-prize-card {
                width: min(310px, 92vw);
            }

            .gacha-prize-card .gacha-ball {
                width: 122px;
                height: 122px;
            }

            .gacha-prize-name {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="top">
            <div>
                <div class="eyebrow">BEADYO PLAY</div>
                <h1>GAME</h1>
            </div>
            <nav class="mode-tabs" aria-label="게임 선택">
                <button class="mode-btn active" type="button" data-mode="ladder" onclick="switchMode('ladder')">
                    <svg viewBox="0 0 24 24"><path d="M7 3v18M17 3v18M7 8h10M7 14h10"/></svg>
                    사다리
                </button>
                <button class="mode-btn" type="button" data-mode="roulette" onclick="switchMode('roulette')">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M6 6l12 12M18 6 6 18"/></svg>
                    룰렛
                </button>
                <button class="mode-btn" type="button" data-mode="gacha" onclick="switchMode('gacha')">
                    <svg viewBox="0 0 24 24"><path d="M7 8a5 5 0 0 1 10 0"/><rect x="5" y="8" width="14" height="12" rx="3"/><path d="M8 14h8M12 11v6"/></svg>
                    뽑기
                </button>
                <button class="mode-btn" type="button" data-mode="pinball" onclick="switchMode('pinball')">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M6 9h12M7 9l2 12M17 9l-2 12M9 15h6M8 21h8"/></svg>
                    핀볼
                </button>
            </nav>
        </header>

        <section class="game-panel active" id="ladder-panel">
            <div class="play-stage">
                <div class="stage-toolbar">
                    <div></div>
                    <div class="counter" aria-label="참가자 수">
                        <button class="icon-btn" type="button" onclick="changeCount(-1)" aria-label="참가자 줄이기">
                            <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <span class="count-num" id="ladder-count">참가자 4명</span>
                        <button class="icon-btn" type="button" onclick="changeCount(1)" aria-label="참가자 늘리기">
                            <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                    <div class="toolbar-actions">
                        <button class="action-btn green" type="button" onclick="revealLadder()">
                            <svg viewBox="0 0 24 24"><path d="m5 3 14 9-14 9V3z"/></svg>
                            START
                        </button>
                        <button class="action-btn" type="button" onclick="showLadderResults()">
                            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
                            결과보기
                        </button>
                        <button class="action-btn reset" type="button" onclick="shuffleLadder()">
                            사다리 섞기
                        </button>
                    </div>
                </div>

                <div class="ladder-board" id="ladder-board">
                    <div class="slot-row top" id="ladder-top"></div>
                    <div class="ladder-canvas-wrap" id="ladder-wrap">
                        <canvas id="ladder-canvas"></canvas>
                        <img class="ladder-token" id="ladder-token" src="game-assets/gobookticon/gobook-01.png" alt="" hidden>
                    </div>
                    <div class="slot-row bottom" id="ladder-bottom"></div>
                </div>
            </div>
        </section>

        <section class="game-panel" id="roulette-panel">
            <div class="play-stage">
                <div class="stage-toolbar">
                    <div></div>
                    <div class="counter" aria-label="후보 수">
                        <span class="count-num" id="roulette-count">후보 4명</span>
                    </div>
                    <div class="toolbar-actions">
                        <button class="action-btn" type="button" onclick="openSettings('roulette')">
                            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                            후보 설정
                        </button>
                        <button class="action-btn green" type="button" id="spin-btn" onclick="spinRoulette()">
                            <svg viewBox="0 0 24 24"><path d="m5 3 14 9-14 9V3z"/></svg>
                            START
                        </button>
                        <button class="action-btn reset" type="button" onclick="resetRoulette()">
                            초기화
                        </button>
                    </div>
                </div>

                <div class="roulette-stage">
                    <div class="wheel-area">
                        <div class="wheel-pointer"></div>
                        <canvas id="roulette-canvas" width="760" height="760"></canvas>
                        <button class="wheel-center" type="button" onclick="spinRoulette()" aria-label="룰렛 시작">
                            <img id="wheel-center-img" src="game-assets/gobookticon/gobook-02.png" alt="">
                        </button>
                    </div>
                    <aside class="winner-box">
                        <img id="winner-img" src="game-assets/gobookticon/gobook-03.png" alt="">
                        <div class="winner-label">WINNER</div>
                        <div class="winner-name" id="winner-name">대기 중</div>
                        <div class="history" id="history"></div>
                    </aside>
                </div>
            </div>
        </section>

        <section class="game-panel" id="gacha-panel">
            <div class="play-stage">
                <div class="stage-toolbar">
                    <div></div>
                    <div class="counter" aria-label="후보 수">
                        <span class="count-num" id="gacha-count">후보 8명</span>
                    </div>
                    <div class="toolbar-actions">
                        <button class="action-btn" type="button" onclick="openSettings('gacha')">
                            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                            후보 설정
                        </button>
                        <button class="action-btn reset" type="button" onclick="resetGacha()">
                            초기화
                        </button>
                    </div>
                </div>

                <div class="gacha-stage">
                    <aside class="gacha-info">
                        <section class="gacha-info-card">

                    <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>

                <img src="game-assets/gobookticon/gobook-13.png" alt="">
                <span>결과가 나왔어요</span>
