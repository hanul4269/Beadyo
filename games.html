        function applyPinballInput() {
            if (pinball.running) return;
            const names = parsePinballEntries(pinballInputValue());
            if (names.length >= 2) {
                pinball.names = names;
                pinball.ranking = [];
                updatePinball();
            }
        }

        function shufflePinballInput() {
            if (pinball.running) return;
            const names = shuffle(visiblePinballNames());
            pinball.names = names;
            $('pinball-entry-input').value = names.join(', ');
            pinball.ranking = [];
            updatePinball();
        }

        function setPinballRank(rank) {
            const names = visiblePinballNames();
            pinball.selectedRank = rank === 'last' ? names.length : 1;
            updatePinballRankLabel();
            syncPinballWinnerFromRank();
        }

        function changePinballRank(delta) {
            if (pinball.running) return;
            const total = visiblePinballNames().length;
            pinball.selectedRank = Math.max(1, Math.min(total, pinball.selectedRank + delta));
            updatePinballRankLabel();
            syncPinballWinnerFromRank();
        }

        function fitPinballCanvas() {
            const canvas = $('pinball-canvas');
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const width = Math.max(320, rect.width);
            const height = Math.max(390, rect.height);
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            return { canvas, ctx, width, height };
        }

        function drawRoundRect(ctx, x, y, width, height, radius) {
            const r = Math.min(radius, width / 2, height / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + width, y, x + width, y + height, r);
            ctx.arcTo(x + width, y + height, x, y + height, r);
            ctx.arcTo(x, y + height, x, y, r);
            ctx.arcTo(x, y, x + width, y, r);
            ctx.closePath();
        }

        function pinballSlots(width, height) {
            const names = uniquePinballNames();
            const side = Math.max(28, width * .08);
            const gap = Math.max(5, width * .01);
            const slotY = height - Math.max(74, height * .14);
            const slotH = Math.max(54, height * .1);
            const slotW = (width - side * 2 - gap * (names.length - 1)) / names.length;
            return names.map((name, i) => ({
                name,
                x: side + i * (slotW + gap),
                y: slotY,
                w: slotW,
                h: slotH,
                cx: side + i * (slotW + gap) + slotW / 2,
            }));
        }

        function pinballPegs(width, height) {
            const pegs = [];
            const rows = 8;
            const top = Math.max(96, height * .2);
            const bottom = height - Math.max(132, height * .3);
            for (let row = 0; row < rows; row++) {
                const count = row % 2 ? 7 : 6;
                const y = top + (bottom - top) * (row / Math.max(1, rows - 1));
                const inset = width * (row % 2 ? .12 : .18);
                for (let col = 0; col < count; col++) {
                    pegs.push({
                        x: inset + (width - inset * 2) * (col / Math.max(1, count - 1)),
                        y,
                    });
                }
            }
            return pegs;
        }

        function drawPinball() {
            const { ctx, width, height } = fitPinballCanvas();
            const names = visiblePinballNames();
            const slots = pinballSlots(width, height);
            const pegs = pinballPegs(width, height);
            ctx.clearRect(0, 0, width, height);

            const bg = ctx.createRadialGradient(width * .5, height * .46, 30, width * .5, height * .46, width * .68);
            bg.addColorStop(0, '#1c2419');
            bg.addColorStop(.58, '#0d110c');
            bg.addColorStop(1, '#050705');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = 'rgba(127,184,63,.18)';
            ctx.lineWidth = 1;
            for (let x = 0; x < width; x += 34) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += 34) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(238,247,228,.04)';
            drawRoundRect(ctx, width * .21, height * .06, width * .58, height * .78, 22);
            ctx.fill();
            ctx.strokeStyle = 'rgba(127,184,63,.34)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#eef7e4';
            ctx.strokeStyle = '#7fb83f';
            ctx.lineWidth = 2;
            drawRoundRect(ctx, width * .43, height * .02, width * .14, height * .09, 8);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#4f7f25';
            ctx.font = '900 12px Noto Sans KR, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('DROP', width / 2, height * .065);

            ctx.strokeStyle = 'rgba(238,247,228,.48)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(width * .5, height * .11);
            ctx.lineTo(width * .5, height * .19);
            ctx.moveTo(width * .3, height * .18);
            ctx.lineTo(width * .2, height * .34);
            ctx.lineTo(width * .26, height * .45);
            ctx.lineTo(width * .18, height * .62);
            ctx.lineTo(width * .24, height * .76);
            ctx.moveTo(width * .7, height * .18);
            ctx.lineTo(width * .8, height * .34);
            ctx.lineTo(width * .74, height * .45);
            ctx.lineTo(width * .82, height * .62);
            ctx.lineTo(width * .76, height * .76);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(127,184,63,.5)';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([5, 8]);
            ctx.beginPath();
            ctx.moveTo(width * .32, height * .24);
            ctx.lineTo(width * .42, height * .24);
            ctx.lineTo(width * .42, height * .32);
            ctx.lineTo(width * .55, height * .32);
            ctx.lineTo(width * .55, height * .42);
            ctx.moveTo(width * .68, height * .25);
            ctx.lineTo(width * .58, height * .25);
            ctx.lineTo(width * .58, height * .36);
            ctx.lineTo(width * .45, height * .36);
            ctx.lineTo(width * .45, height * .49);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#fff';
            ctx.strokeStyle = 'rgba(238,247,228,.34)';
            ctx.lineWidth = 2;
            pegs.forEach((peg, i) => {
                ctx.shadowColor = colors[i % colors.length];
                ctx.shadowBlur = 7;
                ctx.shadowOffsetY = 0;
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, 8.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.shadowColor = 'transparent';
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
            });

            ctx.strokeStyle = 'rgba(238,247,228,.32)';
            ctx.lineWidth = 2;
            slots.forEach((slot, i) => {
                if (i === 0) return;
                const x = slot.x - Math.max(3, width * .006);
                ctx.beginPath();
                ctx.moveTo(x, slot.y - height * .09);
                ctx.lineTo(x, slot.y + slot.h * .94);
                ctx.stroke();
            });

            slots.forEach((slot, i) => {
                const active = pinball.winnerIndex === i && !pinball.running;
                ctx.fillStyle = active ? 'rgba(127,184,63,.9)' : 'rgba(238,247,228,.92)';
                ctx.strokeStyle = active ? '#eef7e4' : 'rgba(255,255,255,.18)';
                ctx.lineWidth = active ? 3 : 2;
                drawRoundRect(ctx, slot.x, slot.y, slot.w, slot.h, 8);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = active ? '#fff' : '#30352e';
                ctx.font = `${slot.w < 62 ? 12 : 14}px Noto Sans KR, sans-serif`;
                ctx.font = `900 ${slot.w < 62 ? 12 : 14}px Noto Sans KR, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const label = slot.name.length > 5 ? slot.name.slice(0, 4) + '…' : slot.name;
                ctx.fillText(label, slot.cx, slot.y + slot.h / 2);
            });

            pinball.racers.forEach((ball, racerIndex) => {
                ctx.save();
                ctx.translate(ball.x, ball.y);
                ctx.rotate(ball.rotate || 0);
                const marble = ctx.createRadialGradient(-10, -12, 4, 0, 0, 30);
                marble.addColorStop(0, '#ffffff');
                marble.addColorStop(.42, '#eef7e4');
                marble.addColorStop(1, '#d6ebc1');
                ctx.fillStyle = marble;
                ctx.strokeStyle = ball.finished ? '#7fb83f' : colors[racerIndex % colors.length];
                ctx.lineWidth = 2;
                ctx.shadowColor = colors[racerIndex % colors.length];
                ctx.shadowBlur = ball.finished ? 5 : 13;
                ctx.shadowOffsetY = 0;
                ctx.beginPath();
                ctx.arc(0, 0, ball.size || 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.shadowColor = 'transparent';
                const img = ball.img;
                const icon = (ball.size || 18) * 1.36;
                if (img?.complete) ctx.drawImage(img, -icon / 2, -icon / 2, icon, icon);
                ctx.restore();
            });
        }

        function renderPinballRanking() {
            $('pinball-rank-list').innerHTML = pinball.ranking.slice(0, 8).map((name, i) => `
                <div><b>#${i + 1}</b><span>${escapeHtml(name)}</span></div>
            `).join('');
        }

        function pinballSegments(width, height) {
            return [
                { a: { x: width * .5, y: height * .11 }, b: { x: width * .5, y: height * .19 }, bounce: .45 },
                { a: { x: width * .3, y: height * .18 }, b: { x: width * .2, y: height * .34 }, bounce: .5 },
                { a: { x: width * .2, y: height * .34 }, b: { x: width * .26, y: height * .45 }, bounce: .5 },
                { a: { x: width * .26, y: height * .45 }, b: { x: width * .18, y: height * .62 }, bounce: .5 },
                { a: { x: width * .18, y: height * .62 }, b: { x: width * .24, y: height * .76 }, bounce: .5 },
                { a: { x: width * .7, y: height * .18 }, b: { x: width * .8, y: height * .34 }, bounce: .5 },
                { a: { x: width * .8, y: height * .34 }, b: { x: width * .74, y: height * .45 }, bounce: .5 },
                { a: { x: width * .74, y: height * .45 }, b: { x: width * .82, y: height * .62 }, bounce: .5 },
                { a: { x: width * .82, y: height * .62 }, b: { x: width * .76, y: height * .76 }, bounce: .5 },
                { a: { x: width * .055, y: height * .08 }, b: { x: width * .055, y: height * .9 }, bounce: .42 },
                { a: { x: width * .945, y: height * .08 }, b: { x: width * .945, y: height * .9 }, bounce: .42 },
            ];
        }

        function resolveCircleSegment(ball, segment) {
            const ax = segment.a.x;
            const ay = segment.a.y;
            const bx = segment.b.x;
            const by = segment.b.y;
            const abx = bx - ax;
            const aby = by - ay;
            const t = Math.max(0, Math.min(1, ((ball.x - ax) * abx + (ball.y - ay) * aby) / (abx * abx + aby * aby || 1)));
            const px = ax + abx * t;
            const py = ay + aby * t;
            let dx = ball.x - px;
            let dy = ball.y - py;
            let dist = Math.hypot(dx, dy);
            if (dist >= ball.size || !Number.isFinite(dist)) return;
            if (dist < .001) {
                dx = -aby;
                dy = abx;
                dist = Math.hypot(dx, dy) || 1;
            }
            const nx = dx / dist;
            const ny = dy / dist;
            ball.x += nx * (ball.size - dist);
            ball.y += ny * (ball.size - dist);
            const vn = ball.vx * nx + ball.vy * ny;
            if (vn < 0) {
                ball.vx -= (1 + segment.bounce) * vn * nx;
                ball.vy -= (1 + segment.bounce) * vn * ny;
            }
        }

        function resolveCirclePeg(ball, peg) {
            let dx = ball.x - peg.x;
            let dy = ball.y - peg.y;
            let dist = Math.hypot(dx, dy);
            const minDist = ball.size + 9;
            if (dist >= minDist || !Number.isFinite(dist)) return;
            if (dist < .001) {
                dx = Math.random() - .5;
                dy = Math.random() - .5;
                dist = Math.hypot(dx, dy) || 1;
            }
            const nx = dx / dist;
            const ny = dy / dist;
            ball.x += nx * (minDist - dist);
            ball.y += ny * (minDist - dist);
            const vn = ball.vx * nx + ball.vy * ny;
            if (vn < 0) {
                ball.vx -= 1.62 * vn * nx;
                ball.vy -= 1.62 * vn * ny;
            }
            ball.vx += (Math.random() - .5) * 18;
        }

        function resolveMarblePair(a, b) {
            if (a.finished || b.finished) return;
            let dx = b.x - a.x;
            let dy = b.y - a.y;
            let dist = Math.hypot(dx, dy);
            const minDist = a.size + b.size;
            if (dist >= minDist || !Number.isFinite(dist)) return;
            if (dist < .001) {
                dx = Math.random() - .5;
                dy = Math.random() - .5;
                dist = Math.hypot(dx, dy) || 1;
            }
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = (minDist - dist) / 2;
            a.x -= nx * overlap;
            a.y -= ny * overlap;
            b.x += nx * overlap;
            b.y += ny * overlap;
            const rvx = b.vx - a.vx;
            const rvy = b.vy - a.vy;
            const vn = rvx * nx + rvy * ny;
            if (vn > 0) return;
            const impulse = -1.18 * vn / 2;
            a.vx -= impulse * nx;
            a.vy -= impulse * ny;
            b.vx += impulse * nx;
            b.vy += impulse * ny;
        }

        function stepPinballPhysics(width, height, dt) {
            const pegs = pinballPegs(width, height);
            const segments = pinballSegments(width, height);
            const goalY = height - Math.max(70, height * .13);
            const gravity = height * 1.35;
            const friction = Math.pow(.992, dt * 60);
            pinball.racers.forEach(ball => {
                if (ball.finished) return;
                if (ball.delay > 0) {
                    ball.delay -= dt * 1000;
                    return;
                }
                ball.vy += gravity * dt;
                ball.vx *= friction;
                ball.vy *= friction;
                if (Math.hypot(ball.vx, ball.vy) < height * .045 && ball.y > height * .18) {
                    ball.vx += (Math.random() - .5) * height * .18;
                    ball.vy += height * .16;
                }
                ball.x += ball.vx * dt;
                ball.y += ball.vy * dt;
                ball.rotate += ball.vx * dt * .035;
                segments.forEach(segment => resolveCircleSegment(ball, segment));
                pegs.forEach(peg => resolveCirclePeg(ball, peg));
                if (ball.x < ball.size) {
                    ball.x = ball.size;
                    ball.vx = Math.abs(ball.vx) * .55;
                }
                if (ball.x > width - ball.size) {
                    ball.x = width - ball.size;
                    ball.vx = -Math.abs(ball.vx) * .55;
                }
                if (ball.y > goalY) {
                    ball.finished = true;
                    ball.y = goalY + (pinball.ranking.length % 3) * 4;
                    ball.vx = 0;
                    ball.vy = 0;
                    pinball.ranking.push(ball.name);
                    renderPinballRanking();
                    if (pinball.ranking.length === pinball.selectedRank) {
                        $('pinball-winner').textContent = ball.name;
                        $('pinball-result-img').src = ball.asset;
                    }
                }
            });
            for (let i = 0; i < pinball.racers.length; i++) {
                for (let j = i + 1; j < pinball.racers.length; j++) {
                    resolveMarblePair(pinball.racers[i], pinball.racers[j]);
                }
            }
        }

        function startPinball() {
            if (pinball.running) return;
            const names = visiblePinballNames();
            if (names.length < 2) return;
            const { width, height } = fitPinballCanvas();
            const unique = uniquePinballNames(names);
            const raceOrder = shuffle(names.map((name, i) => ({ name, originalIndex: i })));
            pinball.running = true;
            pinball.winnerIndex = null;
            pinball.ranking = [];
            $('pinball-btn').disabled = true;
            $('pinball-winner').textContent = '진행 중';
            $('pinball-history').innerHTML = '';
            renderPinballRanking();

            pinball.racers = raceOrder.map((entry, i) => {
                const img = new Image();
                const asset = ASSETS[entry.originalIndex % ASSETS.length];
                img.src = asset;
                const cols = Math.min(10, names.length);
                const row = Math.floor(i / cols);
                const col = i % cols;
                const spread = Math.min(width * .34, cols * 26);
                return {
                    ...entry,
                    img,
                    asset,
                    size: Math.max(12, Math.min(18, 22 - names.length * .22)),
                    delay: Math.random() * 360,
                    x: width / 2 - spread / 2 + (col + .5) * (spread / cols) + (Math.random() - .5) * 8,
                    y: height * .07 - row * 24,
                    vx: (Math.random() - .5) * 70,
                    vy: 0,
                    rotate: Math.random() * Math.PI,
                    finished: false,
                };
            });

            let last = performance.now();
            const started = last;
            function animate(now) {
                const dt = Math.min(.032, Math.max(.001, (now - last) / 1000));
                last = now;
                for (let i = 0; i < 3; i++) stepPinballPhysics(width, height, dt / 3);
                drawPinball();
                const allFinished = pinball.ranking.length >= names.length;
                const timedOut = now - started > 12500;
                if (!allFinished && !timedOut) {
                    requestAnimationFrame(animate);
                    return;
                }
                pinball.racers.filter(r => !r.finished).sort((a, b) => b.y - a.y).forEach(r => {
                    r.finished = true;
                    pinball.ranking.push(r.name);
                });
                renderPinballRanking();
                const winner = pinball.ranking[pinball.selectedRank - 1] || pinball.ranking[0] || names[0];
                const winnerIndex = names.indexOf(winner);
                pinball.running = false;
                pinball.winnerIndex = Math.max(0, unique.indexOf(winner));
                pinball.history.unshift(winner);
                pinball.history = pinball.history.slice(0, 8);
                $('pinball-winner').textContent = winner;
                $('pinball-result-img').src = ASSETS[Math.max(0, winnerIndex) % ASSETS.length];
                $('pinball-history').innerHTML = pinball.history.map(name => `<span class="chip">${escapeHtml(name)}</span>`).join('');
                $('pinball-btn').disabled = false;
                drawPinball();
            }

            requestAnimationFrame(animate);
        }

        function resetPinball() {
            pinball.history = [];
            pinball.racers = [];
            pinball.ranking = [];
            pinball.winnerIndex = null;
            pinball.running = false;
            $('pinball-btn').disabled = false;
            $('pinball-winner').textContent = '대기 중';
            $('pinball-result-img').src = ASSETS[4];
            $('pinball-history').innerHTML = '';
            renderPinballRanking();
            drawPinball();
        }

        function openSettings(mode) {
            settingsMode = mode;
            $('settings-title').textContent = mode === 'gacha' ? '뽑기 후보 설정' : (mode === 'pinball' ? '핀볼 후보 설정' : (mode === 'ladder' ? '사다리 설정' : '룰렛 설정'));
            $('name-input').value = (mode === 'gacha' ? gacha.names : (mode === 'pinball' ? pinball.names : (mode === 'ladder' ? ladder.names : roulette.names))).join('\n');
            $('prize-field').style.display = mode === 'ladder' ? '' : 'none';
            $('prize-input').value = ladder.prizes.join('\n');
            $('settings-modal').classList.add('open');
        }

        function applySettings() {
            const names = cleanLines($('name-input').value);
            if (settingsMode === 'ladder') {
                const prizes = cleanLines($('prize-input').value);
                if (names.length >= 2) ladder.names = names;
                if (prizes.length >= 2) ladder.prizes = prizes;
                ladder.count = Math.max(2, Math.min(8, Math.min(ladder.names.length, ladder.prizes.length)));
                resetLadder();
            } else {
                if (settingsMode === 'gacha') {
                    if (names.length >= 2) gacha.names = names;
                    gacha.count = Math.max(2, Math.min(16, gacha.names.length));
                    updateGacha();
                } else if (settingsMode === 'pinball') {
                    const pinballNames = parsePinballEntries($('name-input').value);
                    if (pinballNames.length >= 2) pinball.names = pinballNames;
                    pinball.count = Math.max(2, Math.min(12, pinball.names.length));
                    if ($('pinball-entry-input')) $('pinball-entry-input').value = pinball.names.join(', ');
                    updatePinball();
                } else {
                    if (names.length >= 2) roulette.names = names;
                    roulette.count = Math.max(2, Math.min(12, roulette.names.length));
                    updateRoulette();
                }
            }
            closeModal();
        }

        function modalBackdropClick(event) {
            if (event.target.classList.contains('modal-backdrop')) closeModal();
        }

        function closeModal() {
            document.querySelectorAll('.modal-backdrop.open').forEach(modal => modal.classList.remove('open'));
        }

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeModal();
            if (event.key === 'Enter' && document.querySelector('#ladder-panel.active') && !document.querySelector('.modal-backdrop.open')) runLadder(0);
        });

        resetLadder();
        updateRoulette();
        updateGacha();
        window.addEventListener('resize', () => {
            drawLadder();
            drawRoulette();
            renderGacha();
        });
    </script>
</body>
</html>
