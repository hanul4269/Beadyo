<!DOCTYPE html>
<html lang="ko" data-page="nikke">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <script>
        (() => {
            let theme = 'light';
            try {
                theme = localStorage.getItem('beadyo:theme') === 'dark' ? 'dark' : 'light';
            } catch {}
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
        })();
    </script>
    <title>NIKKE Archive | BEADYO</title>
    <link rel="icon" href="logo-icon.webp">
    <link rel="stylesheet" href="tokens.css?v=20260918">
    <script src="beadyo-common.js?v=mascot-webp-20260924"></script>
    <style>
        * { box-sizing: border-box; }

        html {
            color-scheme: light;
            background: var(--bg);
        }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            color: var(--text);
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 8% -10%, var(--body-glow), transparent 28rem),
                linear-gradient(180deg, var(--body-wash), transparent 240px),
                var(--bg);
        }

        button,
        a { font: inherit; }

        a { color: inherit; }

        button { cursor: pointer; }

        .skip-link {
            position: fixed;
            left: 12px;
            top: -60px;
            z-index: 100;
            padding: 10px 14px;
            border-radius: 8px;
            background: var(--signal);
            color: #fff;
            font-weight: 900;
        }

        .skip-link:focus { top: 12px; }

        .shell {
            width: min(1580px, 100%);
            margin: 0 auto;
            padding: 22px clamp(18px, 3vw, 40px) 40px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }

        .brand-mark {
            position: relative;
            display: grid;
            place-items: center;
            width: 54px;
            height: 54px;
            flex: 0 0 auto;
            border: 1px solid rgba(127,184,63,.28);
            border-radius: 12px;
            background: linear-gradient(145deg, var(--panel), var(--signal-soft));
            color: var(--signal-dark);
            font-size: 27px;
            font-weight: 950;
            box-shadow: 0 7px 18px rgba(42,47,41,.08);
        }

        .brand-mark::after {
            content: "";
            position: absolute;
            right: 5px;
            bottom: 5px;
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--gold);
            border-bottom: 2px solid var(--gold);
        }

        .kicker {
            margin: 0 0 4px;
            color: var(--signal-dark);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .22em;
        }

        h1 {
            margin: 0;
            font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
            font-size: clamp(38px, 5vw, 62px);
            line-height: .88;
            letter-spacing: .055em;
            transform: scaleX(.94);
            transform-origin: left center;
        }

        .tagline {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .view-tabs {
            display: inline-flex;
            gap: 5px;
            padding: 5px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--panel-glass);
            box-shadow: 0 5px 16px rgba(42,47,41,.06);
        }

        .view-tab {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            min-height: 42px;
            padding: 0 17px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: var(--muted);
            font-size: 13px;
            font-weight: 900;
            white-space: nowrap;
        }

        .view-tab::before {
            content: "";
            width: 7px;
            height: 7px;
            border: 1px solid currentColor;
            transform: rotate(45deg);
        }

        .view-tab.active {
            background: var(--signal);
            color: #fff;
            box-shadow: 0 7px 18px rgba(127,184,63,.22);
        }

        .view { display: none; }
        .view.active { display: block; }

        .story-layout {
            display: grid;
            grid-template-columns: clamp(240px, 17vw, 270px) minmax(0, 1fr);
            align-items: start;
            gap: 14px;
        }

        .briefing,
        .viewer,
        .guide-card {
            border: 1px solid var(--line);
            background: var(--panel);
            box-shadow: 0 10px 28px rgba(42,47,41,.06);
        }

        .briefing {
            position: sticky;
            top: 18px;
            display: flex;
            flex-direction: column;
            align-self: start;
            min-height: 560px;
            padding: 28px 26px;
            border-radius: 12px;
        }

        .briefing::before {
            content: "01";
            margin-bottom: 22px;
            color: var(--signal);
            font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
            font-size: 72px;
            font-weight: 950;
            line-height: .82;
            letter-spacing: .02em;
            opacity: .18;
        }

        .briefing-index {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            min-height: 25px;
            margin-bottom: 8px;
            padding: 0 9px;
            border-radius: 999px;
            background: var(--signal-soft);
            color: var(--signal-dark);
            font-size: 10px;
            font-weight: 950;
            letter-spacing: .12em;
        }

        .briefing h2,
        .guide-head h2 {
            margin: 0;
            font-size: 20px;
            letter-spacing: -.03em;
        }

        .briefing h2 {
            font-size: 25px;
        }

        .briefing p,
        .guide-head p {
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
        }

        .story-types {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
            margin: 30px 0 24px;
            border-top: 1px solid var(--line);
        }

        .story-type {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 15px 2px;
            border: 0;
            border-bottom: 1px solid var(--line);
            border-radius: 0;
            background: transparent;
            color: var(--surface-text);
            font-size: 12px;
            font-weight: 800;
        }

        .story-type span:last-child {
            color: var(--signal-dark);
            font-size: 10px;
            letter-spacing: .1em;
        }

        .source-link,
        .external-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 40px;
            border: 1px solid var(--line-strong);
            border-radius: 7px;
            color: var(--surface-text);
            font-size: 12px;
            font-weight: 900;
            text-decoration: none;
        }

        .source-link {
            width: 100%;
            min-width: 0;
            min-height: 46px;
            margin-top: auto;
            padding: 0 14px;
            background: var(--signal-soft);
            color: var(--signal-dark);
        }

        .source-link:hover,
        .external-link:hover {
            border-color: var(--signal);
            color: var(--signal-dark);
        }

        .viewer {
            min-width: 0;
            overflow: hidden;
            border-radius: 12px;
        }

        .viewer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            min-height: 54px;
            padding: 8px 12px 8px 16px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        .viewer-title {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            color: var(--surface-text);
            font-size: 12px;
            font-weight: 900;
            letter-spacing: .03em;
        }

        .status-light {
            width: 7px;
            height: 7px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: var(--signal);
            box-shadow: 0 0 0 4px var(--signal-soft);
        }

        .external-link {
            min-height: 34px;
            padding: 0 12px;
        }

        .frame-wrap {
            position: relative;
            padding: 10px;
            background: var(--frame-edge);
            overflow: hidden;
        }

        .content-frame {
            display: block;
            width: 100%;
            height: 10250px;
            border: 0;
            border-radius: 8px;
            background: var(--frame-bg);
            overflow: hidden;
            color-scheme: inherit;
        }

        .frame-loader {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
            background: var(--panel-2);
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .08em;
            transition: opacity .25s ease, visibility .25s ease;
        }

        .frame-loader::before {
            content: "";
            width: 28px;
            height: 28px;
            margin-right: 10px;
            border: 2px solid rgba(42,47,41,.12);
            border-top-color: var(--signal);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        .frame-loader.done {
            opacity: 0;
            visibility: hidden;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .guide-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin: 2px 0 15px;
            padding: 18px 20px;
            border-left: 3px solid var(--signal);
            background: linear-gradient(90deg, var(--signal-soft), transparent 65%);
        }

        .archive-badge {
            display: inline-flex;
            align-items: center;
            min-height: 34px;
            padding: 0 12px;
            border: 1px solid rgba(127,184,63,.25);
            border-radius: 999px;
            background: var(--signal-soft);
            color: var(--signal-dark);
            font-size: 12px;
            font-weight: 900;
            white-space: nowrap;
        }

        .guide-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(130px, 1fr));
            gap: 9px;
            margin-bottom: 14px;
        }

        .guide-card {
            position: relative;
            min-width: 0;
            min-height: 142px;
            padding: 16px;
            border-radius: 9px;
            color: var(--text);
            text-align: left;
            overflow: hidden;
        }

        .guide-card::after {
            content: "";
            position: absolute;
            right: -22px;
            bottom: -28px;
            width: 76px;
            height: 76px;
            border: 1px solid rgba(42,47,41,.08);
            transform: rotate(45deg);
        }

        .guide-card:hover {
            border-color: rgba(127,184,63,.5);
            transform: translateY(-2px);
        }

        .guide-card.active {
            border-color: var(--signal);
            background: linear-gradient(160deg, var(--signal-soft), var(--panel));
            box-shadow: inset 0 0 0 1px rgba(127,184,63,.08), 0 10px 24px rgba(42,47,41,.08);
        }

        .guide-number {
            display: block;
            margin-bottom: 25px;
            color: var(--signal-dark);
            font-family: Impact, sans-serif;
            font-size: 13px;
            letter-spacing: .1em;
        }

        .guide-card.active .guide-number { color: var(--gold); }

        .guide-name {
            display: block;
            font-size: 15px;
            font-weight: 950;
            line-height: 1.2;
        }

        .guide-desc {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            line-height: 1.45;
        }

        .guide-frame-wrap {
            position: relative;
            min-height: 620px;
            background: #0b0f16;
            overflow: hidden;
        }

        .guide-content-frame {
            display: block;
            width: 100%;
            height: 620px;
            border: 0;
            background: #0b0f16;
            overflow: hidden;
        }

        @media (max-width: 1180px) {
            .guide-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 980px) {
            .story-layout { grid-template-columns: 1fr; }
            .briefing {
                position: relative;
                top: auto;
                display: grid;
                grid-template-columns: minmax(220px, .9fr) minmax(360px, 1.5fr) auto;
                align-items: center;
                min-height: 0;
                gap: 20px;
                padding: 18px 20px;
            }
            .briefing::before { display: none; }
            .briefing h2 { font-size: 20px; }
            .story-types {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
                margin: 0;
                border-top: 0;
            }
            .story-type {
                padding: 10px 12px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--panel-2);
            }
            .source-link {
                width: auto;
                min-width: 156px;
                min-height: 40px;
                margin-top: 0;
            }
        }

        @media (max-width: 780px) {
            .shell { padding-top: 16px; }
            .topbar { align-items: stretch; flex-direction: column; gap: 17px; }
            .view-tabs { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
            .view-tab { justify-content: center; padding: 0 10px; }
            .briefing { grid-template-columns: 1fr; gap: 15px; padding: 17px; }
            .story-types { grid-template-columns: repeat(2, 1fr); margin: 15px 0; }
            .story-type { padding: 7px 0; }
            .source-link { width: 100%; }
            .guide-head { align-items: flex-start; flex-direction: column; gap: 10px; }
            .guide-grid { grid-template-columns: repeat(2, 1fr); }
            .archive-badge { font-size: 11px; }
        }

        @media (max-width: 470px) {
            .brand-mark { width: 46px; height: 46px; }
            .tagline { font-size: 12px; }
            .view-tab { font-size: 12px; }
            .guide-grid { grid-template-columns: 1fr 1fr; }
            .guide-card { min-height: 126px; padding: 13px; }
            .guide-number { margin-bottom: 17px; }
            .guide-name { font-size: 14px; }
            .external-link span { display: none; }
            .story-types { grid-template-columns: 1fr; margin: 0; }
            .story-type { padding: 9px 10px; }
            .frame-wrap { padding: 5px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">본문으로 이동</a>
    <main class="shell" id="main-content">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">N</div>
                <div>
                    <p class="kicker">COMMANDER'S ARCHIVE</p>
                    <h1>NIKKE</h1>
                </div>
            </div>
            <nav class="view-tabs" aria-label="NIKKE 자료 선택">

                <button class="view-tab" type="button" data-view="guide" aria-selected="false">NIKKE 가이드</button>
            </nav>
        </header>

        <section class="view active" id="story-view">
            <div class="story-layout">
                <aside class="briefing">

                        <div class="briefing-index">NIKKE STORY GUIDE</div>

                        <p>메인·이벤트·사이드·호감도 스토리를 이야기 흐름에 맞춰 살펴보세요.</p>

                        <div class="story-type"><span>이벤트 스토리</span><span>EVENT</span></div>
                        <div class="story-type"><span>사이드 스토리</span><span>SIDE</span></div>
                        <div class="story-type"><span>호감도 스토리</span><span>BOND</span></div>
                    </div>
                    <a class="source-link" href="https://ssissun.github.io/nikke-storyline/" target="_blank" rel="noopener noreferrer">원본에서 크게 보기 ↗</a>
                </aside>

                <div class="viewer">
                    <div class="viewer-bar">
                        <div class="viewer-title"><span class="status-light"></span>NIKKE 스토리 감상 순서 가이드</div>
                        <a class="external-link" href="https://ssissun.github.io/nikke-storyline/" target="_blank" rel="noopener noreferrer"><span>새 창으로</span> ↗</a>

                    <div class="frame-wrap">
                        <div class="frame-loader">STORY DATA LOADING</div>

                            class="content-frame"

        <section class="view" id="guide-view">
            <div class="guide-head">

                    <h2>NIKKE 가이드</h2>
                </div>

            </div>

            <div class="guide-grid" role="tablist" aria-label="NIKKE 가이드 목차">
                <button class="guide-card active" type="button" role="tab" aria-selected="true" data-guide="tier">
                    <span class="guide-number">FILE 01</span>

                    <span class="guide-number">FILE 02</span>

                    <span class="guide-desc">버스트별 투자 가이드</span>

                <button class="guide-card" type="button" role="tab" aria-selected="false" data-guide="wish">
                    <span class="guide-number">FILE 03</span>
                    <span class="guide-name">위시</span>
                    <span class="guide-desc">기업별 위시리스트</span>
                </button>
                <button class="guide-card" type="button" role="tab" aria-selected="false" data-guide="growth">
                    <span class="guide-number">FILE 04</span>
                    <span class="guide-name">육성 추천</span>
                    <span class="guide-desc">범용 솔레 · 속성 파티</span>

                    <span class="archive-badge">사이트에서 바로 보기</span>

                    <iframe

                        id="notion-frame"

    </main>

    <script>
        const guides = {
            tier: {
                title: '티어표',
                page: 'nikke-notion/tier.html?v=3'
            },
            skill: {
                title: '스킬작',
                page: 'nikke-notion/skill.html'
            },
            wish: {
                title: '위시',
                page: 'nikke-notion/wish.html'
            },
            growth: {
                title: '육성 추천 가이드',
                page: 'nikke-notion/growth.html'
            },
            raid: {
                title: '솔로레이드 뮤지엄',
                page: 'nikke-notion/raid.html'
            }
        };

        const storyFrame = document.getElementById('story-frame');
        const notionFrame = document.getElementById('notion-frame');
        const BEADYO_THEME_STORAGE_KEY = 'beadyo:theme';
        let currentNikkeTheme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
        let storyFrameAutoHeight = 0;
        let storyContentObserver = null;

        function syncEmbeddedThemes() {
            const message = { type: 'beadyo-theme-sync', theme: currentNikkeTheme };
            const origin = window.location.origin === 'null' ? '*' : window.location.origin;
            [storyFrame, notionFrame].forEach(frame => {
                if (!frame?.contentWindow) return;
                try {
                    frame.contentDocument.documentElement.dataset.theme = currentNikkeTheme;
                    frame.contentDocument.documentElement.style.colorScheme = currentNikkeTheme;
                } catch {}
                frame.contentWindow.postMessage(message, origin);
            });
        }

        function applyNikkeTheme(theme, persist = false) {
            currentNikkeTheme = theme === 'dark' ? 'dark' : 'light';
            document.documentElement.dataset.theme = currentNikkeTheme;
            document.documentElement.style.colorScheme = currentNikkeTheme;
            if (persist) {
                try {
                    localStorage.setItem(BEADYO_THEME_STORAGE_KEY, currentNikkeTheme);
                } catch {}
            }
            syncEmbeddedThemes();
        }

        function getStoryFrameHeight(width) {
            if (width >= 1100) return 9700;
            if (width >= 850) return 10000;
            if (width >= 700) return 11400;
            if (width >= 520) return 11800;
            if (width >= 390) return 12300;
            return 13000;
        }

        function resizeStoryFrame() {
            const width = storyFrame.getBoundingClientRect().width;
            if (width < 1) return;
            storyFrame.style.height = `${storyFrameAutoHeight || getStoryFrameHeight(width)}px`;
        }

        let layoutSyncFrame = 0;

        function reportPageHeight() {
            if (window.parent === window) return;
            const content = document.querySelector('.shell');
            window.parent.postMessage({
                type: 'nikke:height',
                height: Math.ceil(content.getBoundingClientRect().bottom)
            }, window.location.origin);
        }

        function scheduleLayoutSync() {
            cancelAnimationFrame(layoutSyncFrame);
            layoutSyncFrame = requestAnimationFrame(() => {
                resizeStoryFrame();
                requestAnimationFrame(reportPageHeight);
            });
        }

        function finishLoading(frame) {
            frame.parentElement?.querySelector('.frame-loader')?.classList.add('done');
        }

        function syncStoryContentHeight() {
            try {
                const root = storyFrame.contentDocument?.documentElement;
                if (!root) return;
                const height = Math.min(Math.max(Math.ceil(root.scrollHeight), 700), 30000);
                storyFrameAutoHeight = height;
                storyFrame.style.height = `${height}px`;
                requestAnimationFrame(reportPageHeight);
            } catch (_) {
                // 외부 원본으로 되돌릴 경우에는 기존 반응형 높이를 사용합니다.
            }
        }

        storyFrame.addEventListener('load', () => {
            finishLoading(storyFrame);
            syncEmbeddedThemes();
            storyContentObserver?.disconnect();
            const root = storyFrame.contentDocument?.documentElement;
            if (root) {
                storyContentObserver = new ResizeObserver(syncStoryContentHeight);
                storyContentObserver.observe(root);
                syncStoryContentHeight();
            }
            scheduleLayoutSync();
        });

        notionFrame.addEventListener('load', () => {
            finishLoading(notionFrame);
            syncEmbeddedThemes();
            scheduleLayoutSync();
        });

        window.addEventListener('message', event => {
            if (event.origin === window.location.origin && event.data?.type === 'beadyo-theme-sync') {
                applyNikkeTheme(event.data.theme, true);
                return;
            }

            const storyPath = new URL(storyFrame.src, window.location.href).pathname;
            if (
                event.origin === window.location.origin &&
                event.source === storyFrame.contentWindow &&
                event.data?.type === 'nikke:story-height' &&
                event.data.path === storyPath
            ) {
                const height = Math.min(Math.max(Number(event.data.height) || 0, 700), 30000);
                storyFrameAutoHeight = height;
                storyFrame.style.height = `${height}px`;
                requestAnimationFrame(reportPageHeight);
                return;
            }

            const expectedPath = new URL(notionFrame.src, window.location.href).pathname;
            if (
                event.origin !== window.location.origin ||
                event.source !== notionFrame.contentWindow ||
                event.data?.type !== 'nikke:notion-height' ||
                event.data.path !== expectedPath
            ) return;

            const height = Math.min(Math.max(Number(event.data.height) || 0, 420), 100000);
            notionFrame.style.height = `${height}px`;
            scheduleLayoutSync();
        });

        window.addEventListener('storage', event => {
            if (event.key === BEADYO_THEME_STORAGE_KEY) applyNikkeTheme(event.newValue);
        });

        document.querySelectorAll('.view-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const view = tab.dataset.view;
                document.querySelectorAll('.view-tab').forEach(item => {
                    const active = item === tab;
                    item.classList.toggle('active', active);
                    item.setAttribute('aria-selected', String(active));
                });
                document.querySelectorAll('.view').forEach(section => {
                    section.classList.toggle('active', section.id === `${view}-view`);
                });
                history.replaceState(null, '', view === 'guide' ? '#guide' : '#story');
                scheduleLayoutSync();
            });
        });

        document.querySelectorAll('.guide-card').forEach(card => {
            card.addEventListener('click', () => {
                const guideKey = card.dataset.guide;
                const guide = guides[guideKey];
                if (!guide) return;
                document.querySelectorAll('.guide-card').forEach(item => {
                    const active = item === card;
                    item.classList.toggle('active', active);
                    item.setAttribute('aria-selected', String(active));
                });
                document.getElementById('guide-title').textContent = guide.title;
                notionFrame.title = `NIKKE ${guide.title}`;
                if (notionFrame.dataset.guide !== guideKey) {
                    document.getElementById('guide-loader').classList.remove('done');
                    notionFrame.style.height = '620px';
                    notionFrame.dataset.guide = guideKey;
                    notionFrame.src = guide.page;
                }
                scheduleLayoutSync();
            });
        });

        if (location.hash === '#guide') {
            document.querySelector('[data-view="guide"]')?.click();
        }

        window.addEventListener('resize', scheduleLayoutSync);
        new ResizeObserver(scheduleLayoutSync).observe(document.querySelector('.shell'));
        scheduleLayoutSync();
    </script>
</body>
</html>
