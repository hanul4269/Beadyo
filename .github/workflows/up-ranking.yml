name: Update UP Ranking

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Fetch UP ranking from SOOP
        run: python3 .github/scripts/check_up.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/hanul4269/Beadyo.git
          git pull --rebase
          git add up.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "chore: update UP ranking"
            git push origin main
          fi
