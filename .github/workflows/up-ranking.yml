name: Update UP Ranking

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install supabase-py
        run: python3 -m pip install supabase --quiet

      - name: Test SOOP API access
        run: |
          echo "=== SOOP API test ==="
          curl -s --max-time 10 \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            -H 'Accept: application/json' \
            -H 'Referer: https://www.sooplive.co.kr/' \
            -H 'Origin: https://www.sooplive.co.kr' \
            'https://api.m.afreecatv.com/station/board/reply/list?szBjId=spbabobj&nTitleNo=195398193&nPageNo=1&nListCnt=5' \
            | head -c 500
          echo ""
          echo "=== exit: $? ==="

      - name: Fetch UP ranking from SOOP
        run: python3 .github/scripts/check_up.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/hanul4269/Beadyo.git
          git add up.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "chore: update UP ranking"
            git push origin main
          fi
