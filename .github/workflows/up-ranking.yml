name: Update UP Ranking

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: up-ranking
  cancel-in-progress: true

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # 댓글 수집에 필요한 curl_cffi. 버전·해시를 고정한 파일로만 설치한다.
      - name: Install pinned collector dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary :all: --require-hashes
          -r .github/scripts/requirements-up.txt

      - name: Fetch UP ranking from SOOP
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python .github/scripts/check_up.py
