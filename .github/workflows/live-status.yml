name: Update Live Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SOOP live status
        run: |
          RESPONSE=$(curl -s --max-time 10 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://st.sooplive.co.kr/api/get_station.php?szBjId=beadyo97" 2>/dev/null)

          echo "Response: $RESPONSE"

          if [ -z "$RESPONSE" ]; then
            echo "API 응답 없음, 종료"
            exit 0
          fi

          IS_LIVE=$(echo "$RESPONSE" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    data = d.get('DATA', {})
    title = (data.get('station_title') or '').strip()
    broad_no = str(data.get('broad_no') or '').strip()
    print('true' if (title or broad_no) else 'false')
except Exception as e:
    sys.stderr.write(str(e) + '\n')
    print('false')
")

          UPDATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"live":%s,"updated":"%s"}\n' "$IS_LIVE" "$UPDATED" > live.json
          echo "live=$IS_LIVE"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json
          if git diff --cached --quiet; then
            echo "상태 변화 없음"
          else
            git commit -m "chore: update live status"
            git push
          fi
