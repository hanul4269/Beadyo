name: Update Live Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SOOP live status
        run: python3 .github/scripts/check_live.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/hanul4269/Beadyo.git
          git add live.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "chore: update live status"
            git push origin main
          fi
