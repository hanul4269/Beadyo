<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>구슬요의 보석함</title>
    <link rel="canonical" href="https://beadyo.com/gembox.html">
    <meta property="og:url" content="https://beadyo.com/gembox.html">
    <link rel="icon" href="logo-icon.webp">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" media="print" onload="this.media='all'">
    <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@800;900&display=swap" rel="stylesheet">
    </noscript>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --accent: #7fb83f;
            --accent-dark: #4f7f25;
            --accent-light: #eef7e4;
            --bg: #f4f5f1;
            --surface: #ffffff;
            --surface-2: #fbfcf8;
            --border: rgba(34,39,32,0.09);
            --text: #222720;
            --muted: #737b70;
            --gold: #c49a34;
            --coral: #db7b62;
        }
        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .page-shell {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 0 48px;
        }
        .hero {
            position: relative;
            min-height: 190px;
            margin-bottom: 12px;
            background:
                linear-gradient(90deg, rgba(244,249,239,0.96) 0%, rgba(244,249,239,0.88) 43%, rgba(244,249,239,0.54) 72%, rgba(244,249,239,0.84) 100%),
                url("banner.jpg") center / cover no-repeat;
            border-top: 1px solid rgba(34,39,32,0.04);
            border-bottom: 1px solid var(--border);
            box-shadow: inset 0 -1px 0 rgba(255,255,255,0.76);
            overflow: hidden;
        }
        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.24), rgba(255,255,255,0.62));
            pointer-events: none;
        }
        .hero-inner {
            position: relative;
            z-index: 1;
            max-width: 1180px;
            min-height: 190px;
            margin: 0 auto;
            padding: 8px 18px 14px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 28px;
            align-items: end;
        }
        .hero-main {
            align-self: center;
            max-width: 720px;
        }
        h1 {
            font-family: 'AppleMyungjo', 'Hahmlet', 'Noto Serif KR', 'Nanum Myeongjo', 'Batang', serif;
            font-size: 58px;
            line-height: 0.98;
            letter-spacing: 0;
            color: #2d5f70;
            font-weight: 900;
            word-break: keep-all;
            -webkit-text-stroke: 0.35px rgba(255,255,255,0.78);
            text-shadow:
                0 2px 0 rgba(255,255,255,0.92),
                0 5px 12px rgba(47,95,111,0.16),
                0 0 18px rgba(127,184,63,0.18);
        }
        .hero-copy {
            max-width: 680px;
            margin-top: 5px;
            color: rgba(45,54,39,0.88);
            font-size: 15px;
            line-height: 1.42;
            font-weight: 800;
            word-break: keep-all;
        }
        .hero-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 9px;
        }
        .hero-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 13px;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 0 8px 18px rgba(79,127,37,0.18);
        }
        .hero-button.secondary {
            background: rgba(255,255,255,0.86);
            color: var(--accent-dark);
            border: 1px solid rgba(127,184,63,0.3);
        }
        .hero-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(45,54,39,0.82);
            font-size: 13px;
            font-weight: 900;
        }
        .hero-side {
            display: grid;
            grid-template-columns: repeat(2, 132px);
            gap: 10px;
            align-self: end;
        }
        .season-card {
            min-height: 62px;
            padding: 9px 12px;
            border: 1px solid rgba(255,255,255,0.62);
            border-radius: 8px;
            background: rgba(255,255,255,0.82);
            box-shadow: 0 8px 24px rgba(34,39,32,0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .season-card strong {
            display: block;
            color: rgba(20,24,18,0.96);
            font-size: 22px;
            line-height: 1;
            margin-bottom: 7px;
        }
        .season-card span {
            color: rgba(45,54,39,0.76);
            font-size: 13px;
            line-height: 1.25;
            font-weight: 900;
        }
        .controls {
            max-width: 1180px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0 auto 14px;
            padding: 0 18px;
            flex-wrap: wrap;
        }
        .season-tabs {
            display: inline-flex;
            gap: 4px;
            padding: 4px;
            border: 1px solid rgba(34,39,32,0.06);
            border-radius: 999px;
            background: #edf0e9;
        }
        .season-tab {
            height: 34px;
            padding: 0 16px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }
        .season-tab.active {
            background: #fff;
            color: var(--accent-dark);
            box-shadow: 0 1px 5px rgba(34,39,32,0.1);
        }
        .cast-grid {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 18px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }
        .cast-card {
            display: flex;
            flex-direction: column;
            min-height: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(34,39,32,0.04);
        }
        .cast-cover {
            position: relative;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #edf4e5, #fff8e6);
            overflow: hidden;
        }
        .cast-cover.video-cover {
            border: 0;
            padding: 0;
            width: 100%;
            cursor: pointer;
            font: inherit;
            text-align: left;
        }
        .cast-cover.video-cover::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 8px 20px rgba(34,39,32,0.18);
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.15s, transform 0.15s;
        }
        .cast-cover.video-cover::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 2;
            width: 0;
            height: 0;
            border-top: 11px solid transparent;
            border-bottom: 11px solid transparent;
            border-left: 17px solid var(--accent-dark);
            transform: translate(-38%, -50%);
            opacity: 0;
            transition: opacity 0.15s;
        }
        .cast-cover.video-cover:hover::after,
        .cast-cover.video-cover:hover::before,
        .cast-cover.video-cover:focus-visible::after,
        .cast-cover.video-cover:focus-visible::before {
            opacity: 1;
        }
        .cast-cover.video-cover:hover::after,
        .cast-cover.video-cover:focus-visible::after {
            transform: translate(-50%, -50%) scale(1.04);
        }
        .cast-cover.video-cover:focus-visible {
            outline: 3px solid rgba(127,184,63,0.4);
            outline-offset: -3px;
        }
        .cast-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .cast-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(79,127,37,0.26);
            font-size: 54px;
            font-weight: 900;
        }
        .duet-cover {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px 18px;
            background: linear-gradient(135deg, #eef7e4 0%, #fff8e6 52%, #f6e8e1 100%);
        }
        .duet-cover-inner {
            width: min(100%, 300px);
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: start;
            gap: 12px;
            text-align: center;
        }
        .duet-cover-inner strong {
            grid-column: 1 / -1;
            margin-top: 2px;
            color: rgba(79,127,37,0.42);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0;
        }
        .duet-cover-profile {
            display: grid;
            justify-items: center;
            gap: 8px;
            min-width: 0;
            color: rgba(20,24,18,0.9);
            text-decoration: none;
            font-size: 13px;
            font-weight: 900;
        }
        .duet-cover-profile:hover,
        .duet-cover-profile:focus-visible {
            color: var(--accent-dark);
        }
        .duet-cover-profile:focus-visible {
            outline: 3px solid rgba(127,184,63,0.38);
            outline-offset: 4px;
            border-radius: 8px;
        }
        .duet-cover-avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.9);
            background: var(--accent-light);
            box-shadow: 0 8px 18px rgba(34,39,32,0.12);
        }
        .duet-cover-avatar img,
        .duet-cover-fallback {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .duet-cover-fallback {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-dark);
            font-size: 24px;
            font-weight: 900;
        }
        .season-badge {
            position: absolute;
            left: 10px;
            top: 10px;
            min-height: 26px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.92);
            color: var(--accent-dark);
            font-size: 12px;
            font-weight: 900;
            box-shadow: 0 3px 10px rgba(34,39,32,0.12);
        }
        .cast-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            flex: 1;
        }
        .cast-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
        }
        .cast-profile {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }
        a.cast-profile {
            color: inherit;
            text-decoration: none;
            border-radius: 999px;
        }
        a.cast-profile:hover .cast-name,
        a.cast-profile:focus-visible .cast-name {
            color: var(--accent-dark);
        }
        a.cast-profile:focus-visible {
            outline: 3px solid rgba(127,184,63,0.38);
            outline-offset: 4px;
        }
        .duet-profiles {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            min-width: 0;
        }
        .duet-profile-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
            padding: 2px 8px 2px 2px;
            border-radius: 999px;
            background: rgba(127,184,63,0.08);
            color: inherit;
            text-decoration: none;
        }
        .duet-profile-link:hover .duet-member-name,
        .duet-profile-link:focus-visible .duet-member-name {
            color: var(--accent-dark);
        }
        .duet-profile-link:focus-visible {
            outline: 3px solid rgba(127,184,63,0.38);
            outline-offset: 3px;
        }
        .duet-member-name {
            min-width: 0;
            color: var(--text);
            font-size: 15px;
            font-weight: 900;
            white-space: nowrap;
        }
        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid #fff;
            background: var(--accent-light);
            box-shadow: 0 1px 5px rgba(34,39,32,0.12);
        }
        .profile-fallback {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--accent-light);
            color: var(--accent-dark);
            font-size: 15px;
            font-weight: 900;
            border: 2px solid #fff;
            box-shadow: 0 1px 5px rgba(34,39,32,0.12);
        }
        .cast-name {
            min-width: 0;
            font-size: 18px;
            font-weight: 900;
            line-height: 1.25;
            word-break: keep-all;
        }
        .cast-note {
            color: #4d5549;
            font-size: 13px;
            line-height: 1.55;
            word-break: keep-all;
        }
        .song-list {
            display: grid;
            gap: 7px;
            margin-top: auto;
        }
        .song-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 38px;
            padding: 8px 10px;
            border: 1px solid rgba(34,39,32,0.08);
            border-radius: 8px;
            background: var(--surface-2);
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 800;
        }
        .song-link:hover {
            border-color: rgba(127,184,63,0.38);
            background: var(--accent-light);
        }
        .song-link small {
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }
        .cast-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding-top: 2px;
        }
        .action-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 12px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-size: 12px;
            font-weight: 900;
            text-decoration: none;
        }
        .action-link.secondary {
            background: #fff;
            color: var(--accent-dark);
            border: 1px solid rgba(127,184,63,0.28);
        }
        .empty {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 240px;
            border: 1px dashed rgba(127,184,63,0.34);
            border-radius: 8px;
            background: rgba(255,255,255,0.58);
            color: var(--muted);
            text-align: center;
            font-size: 14px;
            font-weight: 800;
        }
        .empty img {
            width: 84px;
            height: 84px;
            object-fit: contain;
            opacity: 0.85;
        }
        .video-modal {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(20,24,18,0.68);
        }
        .video-modal.open {
            display: flex;
        }
        .video-dialog {
            width: min(100%, 920px);
            border-radius: 8px;
            background: #10130f;
            box-shadow: 0 22px 70px rgba(0,0,0,0.42);
            overflow: hidden;
        }
        .video-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 48px;
            padding: 10px 12px 10px 16px;
            color: #fff;
            font-size: 14px;
            font-weight: 900;
        }
        .video-title {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .video-close {
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            color: #fff;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }
        .video-close:hover {
            background: rgba(255,255,255,0.2);
        }
        .video-frame-wrap {
            aspect-ratio: 16 / 9;
            background: #000;
        }
        .video-frame-wrap iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        @media (max-width: 900px) {
            .hero-inner {
                grid-template-columns: 1fr;
                align-items: start;
            }
            .hero-side {
                grid-template-columns: repeat(2, minmax(120px, 1fr));
                width: min(100%, 360px);
            }
            .cast-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 620px) {
            .page-shell { padding-bottom: 36px; }
            .topbar { align-items: flex-start; }
            .hero {
                min-height: 266px;
                background-position: center;
            }
            .hero-inner {
                min-height: 266px;
                padding: 10px 12px 16px;
            }
            h1 { font-size: 40px; line-height: 1; }
            .hero-copy { font-size: 13px; max-width: 94%; line-height: 1.38; }
            .hero-actions { gap: 7px; margin-top: 8px; }
            .hero-button { min-height: 34px; padding: 0 12px; font-size: 12px; }
            .hero-side { grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
            .season-card strong { font-size: 22px; }
            .controls { align-items: stretch; }
            .season-tabs { width: 100%; overflow-x: auto; }
            .cast-grid { grid-template-columns: 1fr; }
            .video-modal { padding: 12px; }
            .video-head { min-height: 44px; padding-left: 12px; }
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <section class="hero">
            <div class="hero-inner">
                <div class="hero-main">

    </main>
    <div class="video-modal" id="videoModal" aria-hidden="true" onclick="handleVideoBackdrop(event)">

            </div>
            <div class="video-frame-wrap" id="videoFrameWrap"></div>
        </div>
    </div>

    <script>

        const state = { season: 2 };
        const seasons = [2, 1];

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])
            );
        }

        function jsArg(value) {
            return esc(JSON.stringify(String(value ?? '')));
        }

        function safeUrl(value) {
            const raw = String(value || '').trim();
            if (!raw) return '';
            try {
                const url = new URL(raw, location.href);
                if (url.protocol === 'http:' || url.protocol === 'https:') return url.toString();
            } catch {}
            return '';
        }

        function youtubeId(url) {
            const href = safeUrl(url);
            if (!href) return '';
            try {
                const parsed = new URL(href);
                const host = parsed.hostname.toLowerCase();
                if (host === 'youtu.be') return parsed.pathname.split('/').filter(Boolean)[0] || '';
                if (host === 'youtube.com' || host === 'www.youtube.com') {
                    if (parsed.pathname === '/watch') return parsed.searchParams.get('v') || '';
                    const parts = parsed.pathname.split('/').filter(Boolean);
                    if (parts[0] === 'shorts' || parts[0] === 'embed') return parts[1] || '';
                }
            } catch {}
            return '';
        }

        function youtubeThumb(url) {
            const id = youtubeId(url);
            return /^[A-Za-z0-9_-]{11}$/.test(id) ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : '';
        }

        function youtubeEmbedUrl(url) {
            const id = youtubeId(url);
            return /^[A-Za-z0-9_-]{11}$/.test(id) ? `https://www.youtube.com/embed/${id}?autoplay=1&rel=0` : '';
        }

        function soopProfileImage(stationId) {
            const id = String(stationId || '').trim();
            if (!/^[A-Za-z0-9_]+$/.test(id)) return '';
            return `https://stimg.sooplive.co.kr/LOGO/${id.slice(0, 2)}/${id}/${id}.jpg`;
        }

        function memberProfileImage(member) {
            return safeUrl(member?.profileImage) || soopProfileImage(member?.stationId);
        }

        function renderSeasonTabs() {
            const labels = { 1: 'Season 1', 2: 'Season 2' };
            document.getElementById('seasonTabs').innerHTML = seasons.map(season => `
                <button class="season-tab ${String(state.season) === String(season) ? 'active' : ''}" onclick="setSeason('${season}')">
                    ${labels[season]}
                </button>
            `).join('');
        }

        function setSeason(season) {
            state.season = Number(season);
            renderSeasonTabs();
            renderCast();
        }

        function matchesCast(cast) {
            const seasonOk = Number(cast.season) === Number(state.season);
            return seasonOk;
        }

        function renderCast() {
            const grid = document.getElementById('castGrid');
            const items = CAST.filter(matchesCast)
                .sort((a, b) =>
                    Number(b.season || 0) - Number(a.season || 0)
                    || Number(Boolean(a.duet)) - Number(Boolean(b.duet))
                    || Number(a.soloOrder ?? 999) - Number(b.soloOrder ?? 999)
                    || Number(a.duetOrder ?? 999) - Number(b.duetOrder ?? 999)
                    || String(a.name || '').localeCompare(String(b.name || ''), 'ko-KR')
                );

            if (!items.length) {
                grid.innerHTML = `<div class="empty">
                    <img src="game-assets/gobookticon/gobook-10.png" alt="">
                    <div>출연진 정보 준비 중</div>
                </div>`;
                return;
            }

            grid.innerHTML = items.map(cast => {
                const stationUrl = safeUrl(cast.stationUrl);
                const members = Array.isArray(cast.members)
                    ? cast.members.map(member => {
                        const name = String(member?.name || '').trim() || '출연진';
                        return {
                            name,
                            stationUrl: safeUrl(member?.stationUrl),
                            profileUrl: memberProfileImage(member),
                            initial: esc(name.slice(0, 1) || '?')
                        };
                    })
                    : [];
                const isDuet = members.length > 1;
                const songs = Array.isArray(cast.songs) ? cast.songs : [];
                const primarySong = songs[0] || null;
                const videoUrl = youtubeEmbedUrl(primarySong?.url || '');
                const profileUrl = safeUrl(cast.profileImage) || soopProfileImage(cast.stationId);
                const imageUrl = safeUrl(cast.image) || youtubeThumb(primarySong?.url || '') || profileUrl;
                const initial = esc(String(cast.name || '?').trim().slice(0, 1) || '?');
                const duetCoverHtml = isDuet ? `<div class="duet-cover-inner">
                    ${members.map(member => {
                        const avatar = `<span class="duet-cover-avatar">${member.profileUrl ? `<img src="${esc(member.profileUrl)}" alt="" loading="lazy" decoding="async">` : `<span class="duet-cover-fallback">${member.initial}</span>`}</span>
                            <span>${esc(member.name)}</span>`;
                        return member.stationUrl
                            ? `<a class="duet-cover-profile" href="${esc(member.stationUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(member.name)} 방송국으로 이동">${avatar}</a>`
                            : `<div class="duet-cover-profile">${avatar}</div>`;
                    }).join('')}
                    <strong>DUET</strong>
                </div>` : '';
                const coverHtml = imageUrl
                    ? `<img src="${esc(imageUrl)}" alt="${esc(cast.name || '')}" loading="lazy" decoding="async">`
                    : (isDuet ? duetCoverHtml : `<div class="cast-fallback">${initial}</div>`);
                const songHtml = songs.length
                    ? songs.map(song => {
                        const href = safeUrl(song.url);
                        if (!href) return '';
                        return `<a class="song-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">
                            <span>${esc(song.title || '개인곡')}</span>
                        </a>`;
                    }).join('')
                    : `<div class="song-link" aria-disabled="true"><span>${isDuet ? '듀엣곡 준비 중' : '개인곡 준비 중'}</span><small>soon</small></div>`;
                const profileHtml = `${profileUrl ? `<img class="profile-img" src="${esc(profileUrl)}" alt="" loading="lazy" decoding="async">` : `<span class="profile-fallback">${initial}</span>`}
                                <div class="cast-name">${esc(cast.name || '출연진')}</div>`;
                const duetProfileHtml = isDuet ? `<div class="duet-profiles">
                    ${members.map(member => {
                        const avatar = member.profileUrl ? `<img class="profile-img" src="${esc(member.profileUrl)}" alt="" loading="lazy" decoding="async">` : `<span class="profile-fallback">${member.initial}</span>`;
                        const content = `${avatar}<span class="duet-member-name">${esc(member.name)}</span>`;
                        return member.stationUrl
                            ? `<a class="duet-profile-link" href="${esc(member.stationUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(member.name)} 방송국으로 이동">${content}</a>`
                            : `<span class="duet-profile-link">${content}</span>`;
                    }).join('')}
                </div>` : '';
                const memberActionHtml = isDuet ? members.map(member =>
                    member.stationUrl ? `<a class="action-link secondary" href="${esc(member.stationUrl)}" target="_blank" rel="noopener noreferrer">${esc(member.name)} 방송국</a>` : ''
                ).join('') : '';
                return `<article class="cast-card">
                    ${videoUrl ? `<button class="cast-cover video-cover" type="button" onclick="openVideoModal(${jsArg(videoUrl)}, ${jsArg(primarySong?.title || cast.name || '영상')})" aria-label="${esc(cast.name || '출연진')} 영상 재생">` : `<div class="cast-cover ${isDuet && !imageUrl ? 'duet-cover' : ''}">`}
                        ${coverHtml}
                        <div class="season-badge">Season ${esc(cast.season || '')}${isDuet ? ' Duet' : ''}</div>
                    ${videoUrl ? `</button>` : `</div>`}
                    <div class="cast-body">
                        <div class="cast-head">
                            ${isDuet ? duetProfileHtml : (stationUrl
                                ? `<a class="cast-profile" href="${esc(stationUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(cast.name || '출연진')} 방송국으로 이동">${profileHtml}</a>`
                                : `<div class="cast-profile">${profileHtml}</div>`)}
                        </div>
                        ${cast.note ? `<p class="cast-note">${esc(cast.note)}</p>` : ''}
                        <div class="song-list">${songHtml}</div>
                        <div class="cast-actions">
                            ${stationUrl ? `<a class="action-link" href="${esc(stationUrl)}" target="_blank" rel="noopener noreferrer">방송국</a>` : ''}
                            ${memberActionHtml}
                            ${(cast.links || []).map(link => {
                                const href = safeUrl(link.url);
                                return href ? `<a class="action-link secondary" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(link.label || '링크')}</a>` : '';
                            }).join('')}
                        </div>
                    </div>
                </article>`;
            }).join('');
        }

        function openVideoModal(src, title) {
            const modal = document.getElementById('videoModal');
            const titleEl = document.getElementById('videoTitle');
            const frameWrap = document.getElementById('videoFrameWrap');
            const safeSrc = safeUrl(src);
            if (!modal || !frameWrap || !safeSrc) return;
            titleEl.textContent = title || '영상';
            frameWrap.innerHTML = `<iframe src="${esc(safeSrc)}" title="${esc(title || 'YouTube 영상')}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-presentation allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation" allowfullscreen></iframe>`;
            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closeVideoModal() {
            const modal = document.getElementById('videoModal');
            const frameWrap = document.getElementById('videoFrameWrap');
            if (!modal || !frameWrap) return;
            modal.classList.remove('open');
            modal.setAttribute('aria-hidden', 'true');
            frameWrap.innerHTML = '';
            document.body.style.overflow = '';
        }

        function handleVideoBackdrop(event) {
            if (event.target?.id === 'videoModal') closeVideoModal();
        }

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeVideoModal();
        });

        renderSeasonTabs();
        renderCast();
